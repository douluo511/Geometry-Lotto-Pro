name: SSQDLT strict cached evidence audit
on:
  pull_request:
    paths:
      - 'research/strict_audit_20261113/**'
      - '.github/workflows/ssqdlt-strict-audit.yml'
permissions:
  contents: read
concurrency:
  group: strict-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  strict-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned statistical and existing research dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.4.6 scipy==1.17.1 requests==2.34.2
      - name: Run complete relevant suites and strict cached analysis
        run: python -m research.strict_audit_20261113.run_checks --out "${{ runner.temp }}/strict-evidence"
      - name: Retain complete logs, source hashes, results and candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-audit-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/strict-evidence/
          if-no-files-found: error
          retention-days: 90
