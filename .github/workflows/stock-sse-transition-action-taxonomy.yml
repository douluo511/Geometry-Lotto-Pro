name: Stock SSE transition action taxonomy

on:
  push:
    branches:
      - diagnostic/stock-sse-transition-action-taxonomy-v3-prep-20261006
  pull_request:
    paths:
      - ".github/stock_diag/stock_sse_primary_transition_full_corpus.py"
      - ".github/stock_diag/stock_sse_transition_action_taxonomy.py"
      - ".github/workflows/stock-sse-transition-action-taxonomy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  taxonomy:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout and unchanged current Stock product bytes
        shell: bash
        run: |
          set -euo pipefail
          exact="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$exact"
          authority="7f270b9ab58e11fd8129053a65e000c90ff9d8c1"
          test -z "$(git diff --name-only "$authority"..HEAD -- StockAIPro)"
          echo "STOCK_PRODUCT_TREE_BYTE_IDENTITY=PASS"

      - name: Setup pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false

      - name: Install pinned diagnostic dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2" "pypdf==5.4.0"

      - name: Rebuild full official SSE transition corpus
        shell: bash
        run: python .github/stock_diag/stock_sse_primary_transition_full_corpus.py

      - name: Classify transition action taxonomy
        shell: bash
        run: python .github/stock_diag/stock_sse_transition_action_taxonomy.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-SSE-TRANSITION-ACTION-TAXONOMY-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            stock_sse_primary_transition_full_corpus.json
            stock_sse_transition_action_taxonomy.json
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve strict PIT boundary
        if: always()
        shell: bash
        run: |
          echo "TITLE_ACTION_TAXONOMY=DIAGNOSTIC_ONLY"
          echo "PRIMARY_DOCUMENT_ACTION_SEMANTICS_COMPLETE=NOT VERIFIED"
          echo "EFFECTIVE_STATE_RECONSTRUCTION=NOT VERIFIED"
          echo "SHANGHAI_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "FULL_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "ADVANCED_BUSINESS=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"
