name: SSQDLT P0 unattended schedule evidence (research only)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ssqdlt-p0-scheduler.yml'
      - 'research/supercompute/automation/**'
      - 'research/supercompute/tests/test_p0_scheduler.py'
      - 'research/supercompute/tests/test_p0_acceptance.py'
  schedule:
    # P0 bootstrap: two independent UTC windows/day. No lottery or paid API calls.
    - cron: '17 16,17 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssqdlt-p0-research-ledger
  cancel-in-progress: false

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated P0 infrastructure
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify idempotence, tamper evidence and restart tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s research/supercompute/tests -p 'test_p0_*.py' -v

  record-unattended-heartbeat:
    needs: offline-contract
    if: >-
      github.repository == 'douluo511/Geometry-Lotto-Pro' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout isolated P0 infrastructure from main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Append remote ledger receipt, push, and independently re-read
        env:
          PYTHONPATH: .
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="ssqdlt-p0-ledger-v1"
          ledger="$RUNNER_TEMP/ssqdlt-p0-ledger"
          restore="$RUNNER_TEMP/ssqdlt-p0-restored"
          tracking="refs/remotes/origin/$branch"

          # Always start from committed remote state; never trust Actions caches.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch --no-tags origin "refs/heads/$branch:$tracking"
            git worktree add --detach "$ledger" "$tracking"
          else
            # First run: separate branch fork; no commits to main.
            git worktree add --detach "$ledger" "$GITHUB_SHA"
          fi

          python research/supercompute/automation/runner.py record --ledger "$ledger"

          git -C "$ledger" config user.name "github-actions[bot]"
          git -C "$ledger" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$ledger" add research/p0_ledger
          if ! git -C "$ledger" diff --cached --quiet; then
            git -C "$ledger" commit -m "p0: append $GITHUB_EVENT_NAME run $GITHUB_RUN_ID"
            git -C "$ledger" push origin "HEAD:refs/heads/$branch"
          fi

          # Fresh checkout of the pushed remote commit proves persistence.
          git fetch --no-tags origin "refs/heads/$branch:$tracking"
          git worktree add --detach "$restore" "$tracking"
          echo "### P0 remote persistence and recovery check" >> "$GITHUB_STEP_SUMMARY"
          python research/supercompute/automation/runner.py verify --ledger "$restore" \
            --expected-run-id "$GITHUB_RUN_ID" | tee -a "$GITHUB_STEP_SUMMARY"

          # Cross-check every sampled receipt against independent GitHub
          # Actions event metadata; in-progress runs remain UNVERIFIED.
          python research/supercompute/automation/acceptance.py --ledger "$restore" \
            --out "$RUNNER_TEMP/p0-acceptance.json" | tee -a "$GITHUB_STEP_SUMMARY"

          # Infrastructure acceptance is separate from any lottery forecast.
      - name: Archive P0 externally checked evidence (not a formal prediction)
        uses: actions/upload-artifact@v4
        with:
          name: p0-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/p0-acceptance.json
          if-no-files-found: error
