name: Human Nature Pro Independent Repository Export Verification

on:
  pull_request:
    paths:
      - "Human-Nature-Pro/**"
      - ".github/workflows/human-nature-pro-windows.yml"
      - ".github/workflows/human-independent-repo-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Exact checkout identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Deterministic project-only export
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPORT_DIR: ${{ runner.temp }}/human-independent
        run: |
          set -euo pipefail
          python Human-Nature-Pro/tests/export_independent_repo.py --destination "$EXPORT_DIR" --source-commit "$SOURCE_SHA" | tee "$RUNNER_TEMP/EXPORT.json"
      - name: Independent second-pass verification
        env:
          EXPORT_DIR: ${{ runner.temp }}/human-independent
        run: |
          set -euo pipefail
          python Human-Nature-Pro/tests/export_independent_repo.py --destination "$EXPORT_DIR" --verify-only | tee "$RUNNER_TEMP/VERIFY.json"
          grep -q '"status": "PASS"' "$RUNNER_TEMP/VERIFY.json"
      - name: Mutation must fail closed
        env:
          EXPORT_DIR: ${{ runner.temp }}/human-independent
        run: |
          set -euo pipefail
          cp -a "$EXPORT_DIR" "$RUNNER_TEMP/tampered"
          printf '\n# tampered\n' >> "$RUNNER_TEMP/tampered/Human-Nature-Pro/README.md"
          set +e
          python Human-Nature-Pro/tests/export_independent_repo.py --destination "$RUNNER_TEMP/tampered" --verify-only > "$RUNNER_TEMP/TAMPER.json"
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q '"status": "FAIL"' "$RUNNER_TEMP/TAMPER.json"
      - name: Upload reproducible export candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: HUMAN-INDEPENDENT-REPO-EXPORT-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/human-independent
            ${{ runner.temp }}/EXPORT.json
            ${{ runner.temp }}/VERIFY.json
            ${{ runner.temp }}/TAMPER.json
          if-no-files-found: error
          retention-days: 30
      - name: Explicit boundary
        run: |
          echo "PROJECT_ONLY_EXPORT=PASS"
          echo "REPOSITORY_INDEPENDENCE=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"
