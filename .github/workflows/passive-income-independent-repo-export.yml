name: Passive Income Independent Repository Export Verification
on:
  pull_request:
    paths:
      - '.github/scripts/export_passive_income_independent_repo.py'
      - '.github/workflows/passive-income-independent-repo-export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Export and verify
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPORT_DIR: ${{ runner.temp }}/passive-income-independent
        run: |
          set -euo pipefail
          python .github/scripts/export_passive_income_independent_repo.py --destination "$EXPORT_DIR" --source-commit "$SOURCE_SHA" | tee "$RUNNER_TEMP/PASSIVE_EXPORT.json"
          python .github/scripts/export_passive_income_independent_repo.py --destination "$EXPORT_DIR" --verify-only | tee "$RUNNER_TEMP/PASSIVE_VERIFY.json"
          grep -q '"status": "PASS"' "$RUNNER_TEMP/PASSIVE_VERIFY.json"
      - name: Mutation must fail closed
        env:
          EXPORT_DIR: ${{ runner.temp }}/passive-income-independent
        run: |
          set -euo pipefail
          cp -a "$EXPORT_DIR" "$RUNNER_TEMP/passive-income-tampered"
          printf '\n# tampered\n' >> "$RUNNER_TEMP/passive-income-tampered/PassiveIncomePipelineOS/README.md"
          set +e
          python .github/scripts/export_passive_income_independent_repo.py --destination "$RUNNER_TEMP/passive-income-tampered" --verify-only > "$RUNNER_TEMP/PASSIVE_TAMPER.json"
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q '"status": "FAIL"' "$RUNNER_TEMP/PASSIVE_TAMPER.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PASSIVE-INCOME-INDEPENDENT-REPO-EXPORT-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/passive-income-independent
            ${{ runner.temp }}/PASSIVE_EXPORT.json
            ${{ runner.temp }}/PASSIVE_VERIFY.json
            ${{ runner.temp }}/PASSIVE_TAMPER.json
          retention-days: 30
      - run: |
          echo "PROJECT_ONLY_EXPORT=PASS"
          echo "REPOSITORY_INDEPENDENCE=NOT VERIFIED"
          echo "REAL_RELEASE_N_TO_N_PLUS_1=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"
