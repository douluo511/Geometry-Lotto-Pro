name: SSQ DLT Agent v1 acceptance
on:
  pull_request:
    paths:
      - 'research/ssq_dlt_agent_v1/**'
      - 'research/ssq_dlt_v45/**'
      - 'research/ssq_dlt_d2_v44/**'
      - '.github/workflows/ssq-dlt-agent-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-acceptance:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/ssq_dlt_agent_v1/requirements-windows.lock.txt
      - name: Install fixed dependencies
        run: python -m pip install -r research/ssq_dlt_agent_v1/requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Current byte tests, real SDK loop fixtures, native Windows contracts
        run: python -m research.ssq_dlt_agent_v1.acceptance --output agent-acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssq-dlt-agent-v1-acceptance
          path: agent-acceptance/
