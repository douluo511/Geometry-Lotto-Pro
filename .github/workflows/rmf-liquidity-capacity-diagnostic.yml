name: RMF liquidity capacity diagnostic

on:
  push:
    branches:
      - "diagnostic/rmf-liquidity-capacity-20261005"
    paths:
      - "RealMoneyFinance/tests/liquidity_capacity_diagnostic.py"
      - ".github/workflows/rmf-liquidity-capacity-diagnostic.yml"
  pull_request:
    paths:
      - "RealMoneyFinance/tests/liquidity_capacity_diagnostic.py"
      - ".github/workflows/rmf-liquidity-capacity-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify RMF product bytes unchanged
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "62f75def60c16d5768110901890d05edbabe7b34" HEAD
          changed="$(git diff --name-only "62f75def60c16d5768110901890d05edbabe7b34"..HEAD -- RealMoneyFinance ':!.github' | grep -v '^RealMoneyFinance/tests/liquidity_capacity_diagnostic.py$' || true)"
          test -z "$changed" || { echo "$changed"; exit 1; }
          echo "RMF_PRODUCT_BYTES_CHANGED=FALSE"
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
      - name: Install RMF runtime dependency
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2"
      - name: Execute real-network capacity diagnostic
        working-directory: RealMoneyFinance
        run: python tests/liquidity_capacity_diagnostic.py
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RMF-LIQUIDITY-CAPACITY-DIAGNOSTIC-${{ github.sha }}
          path: RealMoneyFinance/rmf_liquidity_capacity_diagnostic.json
          if-no-files-found: error
          retention-days: 30
      - name: Explicit boundary
        run: |
          echo "AMOUNT_BASED_PARTICIPATION_CAPACITY=SUPPORTED"
          echo "OBSERVED_MARKET_IMPACT=NOT VERIFIED"
          echo "BROKER_EXECUTION_SLIPPAGE=NOT VERIFIED"
          echo "LIMIT_FILLABILITY=NOT VERIFIED"
          echo "LIQUIDITY_CAPACITY_FULL_GATE=NOT VERIFIED"
          echo "CAPITAL_DEPLOYMENT_READY=FALSE"
          echo "FINAL_GATE=FAIL"
