name: Stock SSE market-calendar query validation
on:
  push:
    branches: ["diagnostic/stock-sse-market-calendar-query-20261005"]
    paths: ["StockAIPro/hardening_tests/stock_sse_market_calendar_query.py",".github/workflows/stock-sse-market-calendar-query.yml"]
  pull_request:
    paths: ["StockAIPro/hardening_tests/stock_sse_market_calendar_query.py",".github/workflows/stock-sse-market-calendar-query.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 0}
      - name: Verify exact checkout and unchanged Stock bytes
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"; expected="${{ github.event.pull_request.head.sha || github.sha }}"; test "$actual" = "$expected"; echo "EXACT_DIAGNOSTIC_HEAD=$actual"
          base="43168d9e75c70ab55be808d8a51f0c0eb14d83d5"; git merge-base --is-ancestor "$base" HEAD
          changed="$(git diff --name-only "$base..HEAD" -- StockAIPro | grep -v '^StockAIPro/hardening_tests/stock_sse_' || true)"
          test -z "$changed" || { echo "$changed"; exit 1; }; echo "STOCK_PRODUCT_BYTES_CHANGED=FALSE"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11.9"}
      - run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2"
      - name: Query official SSE market calendar
        working-directory: StockAIPro
        run: python hardening_tests/stock_sse_market_calendar_query.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-SSE-MARKET-CALENDAR-QUERY-${{ github.sha }}
          path: StockAIPro/stock_sse_market_calendar_query.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve strict boundary
        working-directory: StockAIPro
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("stock_sse_market_calendar_query.json").read_text(encoding="utf-8"))["adjudication"]
          assert a["market_calendar_live_query"]=="SUPPORTED"
          assert a["historical_daily_suspension_state"]=="NOT VERIFIED"
          assert a["shanghai_historical_st_pit"]=="NOT VERIFIED"
          assert a["full_historical_st_pit"]=="NOT VERIFIED"
          assert a["advanced_business"]=="NOT VERIFIED"
          assert a["final_gate"]=="FAIL"
          print("EXCHANGE_TRADING_DAY_CALENDAR="+a["exchange_trading_day_calendar"])
          print("MARKET_EVENT_CALENDAR_SURFACE="+a["market_event_calendar_surface"])
          print("HISTORICAL_DAILY_SUSPENSION_STATE=NOT VERIFIED")
          print("FINAL_GATE=FAIL")
          PY
