name: Stock SZSE A-share source-bound denominator gate
on:
  push:
    branches:
      - fix/stock-szse-ashare-denominator-authority-20261008
    paths:
      - ".github/stock_diag/stock_szse_ashare_candidate_gate.py"
      - ".github/stock_diag/test_szse_ashare_candidate_gate.py"
      - ".github/workflows/stock-szse-ashare-denominator.yml"
  pull_request:
    paths:
      - ".github/stock_diag/stock_szse_ashare_candidate_gate.py"
      - ".github/stock_diag/test_szse_ashare_candidate_gate.py"
      - ".github/workflows/stock-szse-ashare-denominator.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-stock-ashare-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify product unchanged against #329 behavior authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor 18c58db6c07b71476f179abfedfb898e994e5f69 HEAD
          git merge-base --is-ancestor 9969490c89ccb4cc10536f66416976c5bf40caef HEAD
          test -z "$(git diff --name-only 9969490c89ccb4cc10536f66416976c5bf40caef..HEAD -- StockAIPro)"
          echo "EXACT_PRODUCT_BYTE_IDENTITY=PASS; NO_STOCK_PRODUCT_CHANGE"
      - name: Setup pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - name: Run 22 source and production stock-share controls
        run: python .github/stock_diag/test_szse_ashare_candidate_gate.py
      - name: Verify old official source artifact byte-for-byte; do not inherit new-head network PASS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/11533525796/zip" \
            --output stock_equity_notice_input.zip
          echo "8f9bc189f99fca771953f42171df4efdac4713e5bb38fbc4fa9492f0fe16219d  stock_equity_notice_input.zip" | sha256sum --check
          unzip -oq stock_equity_notice_input.zip
          test -f stock_szse_effective_event_audit.json
          echo "HISTORICAL_FIRST_PARTY_EVIDENCE_ZIP_PIN=PASS"
      - name: Extract A-share/B-share candidate ledgers without daily state promotion
        run: python .github/stock_diag/stock_szse_ashare_candidate_gate.py stock_szse_effective_event_audit.json
      - name: Cross-check all real A-share/B-share code candidates against exact Stock product market classifier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json,pathlib
          source=pathlib.Path("StockAIPro/staging/Stock_AI_Pro/versions/4.3.0/stock_ai/historical_pit.py")
          spec=importlib.util.spec_from_file_location("stock_historical_pit",source)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          data=json.load(open("stock_szse_ashare_candidate_evidence.json",encoding="utf-8"))
          assert (data["source_frozen_denominator"],data["equity_notice_rows"],
              data["equity_notice_code_candidates"],data["szse_a_share_candidate_pairs"],
              data["szse_b_share_excluded_pairs"])==(1849,961,967,958,9)
          a,b=data["a_share_candidates"],data["b_share_exclusion_ledger"]
          assert len({(x["official_url"],x["equity_code_candidate"]) for x in a+b})==967
          assert all(module._market_for_code(x["equity_code_candidate"])=="SZSE" for x in a)
          assert all(module._market_for_code(x["equity_code_candidate"]) is None for x in b)
          assert all(x["actual_daily_suspension_qualified"]=="NOT VERIFIED" for x in a+b)
          assert all(x["actual_stock_lifecycle_qualified"]=="NOT VERIFIED" for x in a+b)
          assert data["adjudication"]["production_historical_st_pit"]=="NOT VERIFIED"
          assert data["adjudication"]["final_gate"]=="FAIL"
          print("STOCK_PRODUCT_A_SHARE_CODE_GATE=PASS; A_SHARE_CANDIDATES=958; B_SHARE_EXCLUSIONS=9")
          print("PRODUCTION_HISTORY_ST_DAILY_PIT=NOT_VERIFIED; FINAL_GATE=FAIL")
          PY
      - name: Upload hash-bound A/B-share candidate-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-SZSE-ASHARE-PIT-CANDIDATES-${{ github.event.pull_request.head.sha || github.sha }}
          path: stock_szse_ashare_candidate_evidence.json
          if-no-files-found: warn
          retention-days: 30
