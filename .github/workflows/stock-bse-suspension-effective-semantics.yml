name: Stock BSE suspension effective semantics
on:
  push:
    branches:
      - diagnostic/stock-bse-suspension-effective-semantics-20261006
    paths:
      - ".github/stock_diag/stock_bse_suspension_effective_semantics.py"
      - ".github/workflows/stock-bse-suspension-effective-semantics.yml"
  pull_request:
    paths:
      - ".github/stock_diag/stock_bse_suspension_effective_semantics.py"
      - ".github/workflows/stock-bse-suspension-effective-semantics.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify current Stock product byte identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          authoritative="7f270b9ab58e11fd8129053a65e000c90ff9d8c1"
          test -z "$(git diff --name-only "$authoritative"..HEAD -- StockAIPro)"
          echo "STOCK_PRODUCT_TREE_BYTE_IDENTITY=PASS"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2" "pypdf==6.1.1" "pymupdf==1.28.2"
      - name: Resolve BSE stop/resume dates from primary PDFs
        run: python .github/stock_diag/stock_bse_suspension_effective_semantics.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: STOCK-BSE-SUSPENSION-EFFECTIVE-SEMANTICS-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            stock_bse_suspension_marketwide_corpus.json
            stock_bse_suspension_effective_semantics.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve strict PIT boundary
        if: always()
        run: |
          echo "BSE_EFFECTIVE_DAILY_SUSPENSION_STATE=NOT VERIFIED"
          echo "BSE_HISTORICAL_SUSPENSION_PIT=NOT VERIFIED"
          echo "BSE_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "FULL_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"
