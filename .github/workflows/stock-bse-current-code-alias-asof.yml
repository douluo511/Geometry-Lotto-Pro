name: Stock BSE current alias HTTP, historical lookahead fails closed
on:
  push:
    branches: [diagnostic/stock-bse-code-alias-asof-20261008]
    paths:
      - ".github/stock_diag/stock_bse_code_alias_source.py"
      - ".github/stock_diag/test_stock_bse_code_alias_source.py"
      - ".github/workflows/stock-bse-current-code-alias-asof.yml"
  pull_request:
    paths:
      - ".github/stock_diag/stock_bse_code_alias_source.py"
      - ".github/stock_diag/test_stock_bse_code_alias_source.py"
      - ".github/workflows/stock-bse-current-code-alias-asof.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-asof-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Exact head and unmodified Stock product
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify product unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor 9969490c89ccb4cc10536f66416976c5bf40caef HEAD
          test -z "$(git diff --name-only 9969490c89ccb4cc10536f66416976c5bf40caef..HEAD -- StockAIPro)"
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - name: Install pinned HTML & HTTPS parsing
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2" "beautifulsoup4==4.15.0"
      - name: 20 false historical alias / real HTTP failure counterexamples
        run: python .github/stock_diag/test_stock_bse_code_alias_source.py
      - name: Attempt fresh official BSE code mapping - do NOT turn network fail green
        run: python .github/stock_diag/stock_bse_code_alias_source.py
      - name: Refuse use as full historical BSE lifecycle or ST state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f stock_bse_current_code_alias_evidence.json
          python - <<'PY'
          import json
          x=json.load(open("stock_bse_current_code_alias_evidence.json",encoding="utf-8"))
          a=x["adjudication"]
          assert a["production_historical_st_pit"]=="NOT VERIFIED"
          assert a["historical_full_SSE_SZSE_BSE_ST_suspension"]=="NOT VERIFIED"
          assert a["final_gate"]=="FAIL"
          print("CURRENT_ALIAS_HTTP="+x["actual_http_receipt"]+"; HISTORICAL_BSE_PIT=NOT VERIFIED; FINAL_GATE=FAIL")
          PY
      - name: Upload raw current source and precise failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-BSE-CURRENT-ALIAS-ONLY-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            stock_bse_current_code_alias_evidence.json
            stock_bse_current_code_alias_raw.html
          if-no-files-found: warn
          retention-days: 30
