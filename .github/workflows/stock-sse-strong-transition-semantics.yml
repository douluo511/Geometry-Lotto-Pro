name: Stock SSE strong transition semantics
on:
  push:
    branches:
      - diagnostic/stock-sse-strong-transition-semantics-20261006
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify current-product byte identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 7f270b9ab58e11fd8129053a65e000c90ff9d8c1 HEAD
          test -z "$(git diff --name-only 7f270b9ab58e11fd8129053a65e000c90ff9d8c1..HEAD -- StockAIPro)"
          echo "STOCK_PRODUCT_TREE_BYTE_IDENTITY=PASS"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2" "pypdf==5.4.0"
      - name: Resolve direct transition semantics
        run: python .github/stock_diag/stock_sse_strong_transition_semantics.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: STOCK-SSE-STRONG-TRANSITION-SEMANTICS-${{ github.sha }}
          path: stock_sse_strong_transition_semantics.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve PIT boundary
        if: always()
        run: |
          echo "EFFECTIVE_STATE_RECONSTRUCTION=NOT VERIFIED"
          echo "SHANGHAI_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "FULL_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "ADVANCED_BUSINESS=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"
