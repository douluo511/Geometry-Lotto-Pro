name: RMF SSE dense historical-membership crosscheck

on:
  push:
    branches:
      - diagnostic/rmf-sse-membership-dense-crosscheck-prep-20261006
  pull_request:
    paths:
      - ".github/rmf/historical_universe_membership_probe.py"
      - ".github/rmf/sse_membership_dense_crosscheck.py"
      - ".github/workflows/rmf-sse-membership-dense-crosscheck.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dense-crosscheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout and unchanged current RMF product bytes
        shell: bash
        run: |
          set -euo pipefail
          exact="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$exact"
          authority="48b46336dc3ce165e2eb8afcdec7a9de17cb3725"
          test -z "$(git diff --name-only "$authority"..HEAD -- RealMoneyFinance)"
          echo "RMF_PRODUCT_TREE_BYTE_IDENTITY=PASS"

      - name: Setup pinned Python
        uses: actions/setup-python@a26af69be951213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false

      - name: Install minimal pinned network dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2"

      - name: Run dense official SSE membership crosscheck
        shell: bash
        run: |
          set -euo pipefail
          python .github/rmf/sse_membership_dense_crosscheck.py             --output "$RUNNER_TEMP/rmf_sse_membership_dense_crosscheck.json"             --network-evidence "$RUNNER_TEMP/rmf_sse_membership_dense_network.jsonl"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RMF-SSE-MEMBERSHIP-DENSE-CROSSCHECK-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/rmf_sse_membership_dense_crosscheck.json
            ${{ runner.temp }}/rmf_sse_membership_dense_network.jsonl
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve strict survivorship/PIT boundary
        if: always()
        shell: bash
        run: |
          echo "HISTORICAL_PIT_AVAILABILITY=NOT VERIFIED"
          echo "SURVIVORSHIP_SELECTION_CONTROL=NOT VERIFIED"
          echo "CAPITAL_DEPLOYMENT_READY=false"
          echo "FINAL_GATE=FAIL"
