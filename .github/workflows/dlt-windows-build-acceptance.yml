name: Windows build and exact-package acceptance

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'DLT/**'
      - '.github/workflows/dlt-windows-build-acceptance.yml'
  pull_request:
    paths:
      - 'DLT/**'
      - '.github/workflows/dlt-windows-build-acceptance.yml'

defaults:
  run:
    working-directory: DLT

jobs:
  build-and-accept:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: 'x64'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Source compile check
        run: python -m compileall -q src
      - name: Source self-test
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\src"
          python -c "from glp.service import self_test; import json; x=self_test(); print(json.dumps(x,ensure_ascii=False,indent=2)); raise SystemExit(0 if x['status']=='PASS' else 2)"

      - name: Network Contract Gate
        run: python scripts/network_contract_gate.py

      - name: Network Fault Injection Gate
        run: python scripts/network_fault_gate.py

      - name: Live official-network evidence gate
        run: python scripts/real_network_check.py

      - name: Native Windows PyInstaller build
        run: pyinstaller --noconfirm --clean GeometryLottoPro.spec
      - name: Exact-package Windows acceptance
        shell: pwsh
        run: ./scripts/windows_acceptance.ps1

      - name: Physical GUI Click Smoke
        shell: pwsh
        run: |
          ..\.github\scripts\physical_gui_click_smoke.ps1 `
            -ExePath ".\dist\Geometry_Lotto_Pro_DLT.exe" `
            -Points "0.14,0.15;0.38,0.15;0.14,0.24;0.38,0.24" `
            -ButtonTexts "预测下一期;一键更新;一键修复;高级分析" `
            -EvidencePath ".\artifacts\physical_gui_click.json"

      - name: Evidence-derived Final Gate
        shell: pwsh
        run: |
          $contract = Get-Content artifacts\network_contract_gate.json -Raw | ConvertFrom-Json
          $fault = Get-Content artifacts\network_fault_gate.json -Raw | ConvertFrom-Json
          $live = Get-Content artifacts\real_network_check.json -Raw | ConvertFrom-Json
          $accept = Get-Content artifacts\acceptance.json -Raw | ConvertFrom-Json
          $gui = Get-Content artifacts\physical_gui_click.json -Raw | ConvertFrom-Json
          $exe = Resolve-Path dist\Geometry_Lotto_Pro_DLT.exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()

          $ok = (
            $contract.status -eq 'PASS' -and
            $fault.status -eq 'PASS' -and
            $live.status -eq 'PASS' -and
            $accept.final_release_gate -eq 'PASS' -and
            $accept.exe_sha256 -eq $hash -and
            $gui.status -eq 'PASS'
          )
          $final = [ordered]@{
            schema = 'dlt-evidence-derived-final-gate-v1'
            final_gate = $(if ($ok) { 'PASS' } else { 'FAIL' })
            exe_sha256 = $hash
            contract_gate = $contract.status
            fault_injection_gate = $fault.status
            real_network_gate = $live.status
            exact_exe_gate = $accept.final_release_gate
            physical_gui_click_gate = $gui.status
          }
          $final | ConvertTo-Json -Depth 6 | Set-Content artifacts\final_gate.json -Encoding utf8
          Get-Content artifacts\final_gate.json
          if (-not $ok) { throw 'DLT evidence-derived Final Gate failed' }

      - name: Upload exact EXE and evidence only after all hard gates pass
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Geometry-Lotto-Pro-DLT-Windows-Acceptance
          path: |
            dist/Geometry_Lotto_Pro_DLT.exe
            artifacts/**
          if-no-files-found: error
          retention-days: 30
