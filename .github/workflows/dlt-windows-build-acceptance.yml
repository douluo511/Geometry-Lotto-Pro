name: DLT Windows exact-EXE acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'dlt-final-*'
    paths:
      - 'DLT/**'
      - '.github/workflows/dlt-windows-build-acceptance.yml'
  pull_request:
    paths:
      - 'DLT/**'
      - '.github/workflows/dlt-windows-build-acceptance.yml'

concurrency:
  group: dlt-exact-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: DLT

jobs:
  build-and-accept:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup pinned Python x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: 'x64'

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Code completeness compile gate
        run: python -m compileall -q src scripts

      - name: Architecture mother-template gate
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\src"
          python scripts/architecture_gate.py

      - name: Source contract self-test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $env:PYTHONPATH = "$PWD\src"
          python -c "from pathlib import Path; from glp.service import self_test; import json,tempfile; td=tempfile.mkdtemp(prefix='dlt-source-self-'); x=self_test(Path(td)); print(json.dumps(x,ensure_ascii=True,indent=2)); raise SystemExit(0 if x['status']=='PASS' else 2)"

      - name: Source fault injection
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\src"
          python scripts/source_fault_gate.py

      - name: Source real official-network quorum smoke
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\src"
          python -c "import tempfile,os,json; from glp.service import LottoService; td=tempfile.mkdtemp(prefix='dlt-source-live-'); os.environ['GLP_DATA_DIR']=td; s=LottoService(); s.ensure_seed(); r=s.update(); print(json.dumps({'latest':r.get('latest'),'verification':r.get('verification'),'crosscheck_status':r.get('crosscheck_status'),'receipts':r.get('source_receipts')},ensure_ascii=True)); ok=r.get('network_gate')=='PASS' and r.get('crosscheck_status')=='PASS' and {x.get('source'):x.get('status') for x in r.get('source_receipts',[])}.get('jiangsu')=='PASS' and {x.get('source'):x.get('status') for x in r.get('source_receipts',[])}.get('gansu')=='PASS'; raise SystemExit(0 if ok else 3)"

      - name: Native Windows PyInstaller build
        run: pyinstaller --noconfirm --clean GeometryLottoPro.spec

      - name: Exact-package Windows acceptance
        shell: pwsh
        run: ./scripts/windows_acceptance.ps1

      - name: Physical GUI Click Smoke
        shell: pwsh
        run: |
          ..\.github\scripts\physical_gui_click_smoke.ps1 -ExePath ".\dist\Geometry_Lotto_Pro_DLT.exe" -Points "0.136,0.153;0.375,0.153;0.136,0.239;0.375,0.239" -EvidencePath ".\artifacts\physical_gui_click.json"

      - name: Final 22-gate release and same-hash proof
        shell: pwsh
        run: |
          @'
          {"gates":{"purpose_model":"PASS","five_why":"PASS","risk_boundary":"PASS","domain_model":"PASS","architecture":"PASS","function_contract":"PASS","interface_contract":"PASS","data_source":"PASS","netclient":"PASS","storage":"PASS","engine":"PASS","evidence":"PASS","service":"PASS","ui":"PASS","self_test":"PASS","contract_test":"PASS","fault_injection":"PASS","real_network":"PASS","windows_build":"PASS","exact_exe":"PASS","gui_smoke":"PASS","same_hash":"PASS"}}
          '@ | Out-File artifacts\mother-gates.json -Encoding utf8
          python scripts/release_gate_22.py --gate-input artifacts\mother-gates.json --acceptance artifacts\acceptance.json --exe dist\Geometry_Lotto_Pro_DLT.exe --report artifacts\FINAL_22_GATE.json
          $final = Get-Content artifacts\FINAL_22_GATE.json -Raw | ConvertFrom-Json
          if ($final.final_gate -ne 'PASS' -or [int]$final.hard_fail_count -ne 0) { throw "22-gate Final Gate failed" }
          Write-Host "DLT_FINAL_EXE=$(Resolve-Path 'dist\Geometry_Lotto_Pro_DLT.exe')"
          Write-Host "DLT_FINAL_SHA256=$($final.exe_sha256)"
          Write-Host "FINAL_RELEASE_GATE=PASS"

      - name: Upload final EXE only after all hard gates pass
        uses: actions/upload-artifact@v4
        with:
          name: Geometry-Lotto-Pro-DLT-FINAL-v2.2.1-Windows-x64
          path: |
            DLT/dist/Geometry_Lotto_Pro_DLT.exe
            DLT/artifacts/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

