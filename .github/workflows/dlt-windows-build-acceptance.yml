# exact-head revalidation trigger 2026-10-04 after repository-admin capability probe
name: Windows build and exact-package acceptance

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'DLT/**'
      - '.github/workflows/dlt-windows-build-acceptance.yml'
  pull_request:
    paths:
      - 'DLT/**'
      - '.github/workflows/dlt-windows-build-acceptance.yml'

permissions:
  contents: write
  actions: read

defaults:
  run:
    working-directory: DLT

jobs:
  build-and-accept:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Exact checkout identity gate
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          New-Item -ItemType Directory -Force ".\artifacts" | Out-Null
          $actual=(git rev-parse HEAD).Trim()
          $expected=[string]$env:EXPECTED_SOURCE_SHA
          $ok=(-not [string]::IsNullOrWhiteSpace($expected)) -and ($actual -eq $expected)
          $report=[ordered]@{
            schema='dlt-checkout-identity-v1'
            status=$(if($ok){'PASS'}else{'FAIL'})
            github_event_sha=$env:GITHUB_SHA
            github_run_id=$env:GITHUB_RUN_ID
            expected_source_sha=$expected
            actual_checkout_sha=$actual
            exact_head_required=$true
          }
          $report | ConvertTo-Json -Depth 6 | Set-Content ".\artifacts\checkout_identity.json" -Encoding utf8
          Get-Content ".\artifacts\checkout_identity.json"
          if(-not $ok){ throw "exact checkout identity mismatch: actual=$actual expected=$expected" }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
          architecture: 'x64'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Source compile check
        run: python -m compileall -q src scripts
      - name: PowerShell acceptance script syntax gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach($script in @(
            '.\scripts\windows_acceptance.ps1',
            '.\scripts\updater_acceptance.ps1',
            '.\scripts\release_update_acceptance.ps1',
            '.\scripts\physical_gui_click_smoke.ps1',
            '.\scripts\physical_gui_failure_smoke.ps1',
            '.\scripts\background_acceptance.ps1'
          )){
            $tokens=$null
            $errors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors
            )
            if($errors.Count -gt 0){ throw ($errors | Out-String) }
          }
      - name: Service isolation and false-PASS regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Source self-test
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\src"
          python -c "from glp.service import self_test; import json; x=self_test(); print(json.dumps(x,ensure_ascii=False,indent=2)); raise SystemExit(0 if x['status']=='PASS' else 2)"

      - name: Business content + no-shell gate
        run: |
          $env:PYTHONPATH = "$PWD\src"
          python scripts/business_no_shell_gate.py

      - name: Network Contract Gate
        run: python scripts/network_contract_gate.py

      - name: Network Fault Injection Gate
        run: python scripts/network_fault_gate.py

      - name: Live official-network evidence gate
        run: python scripts/real_network_check.py

      - name: Native Windows main build + reproducible Same Hash
        shell: pwsh
        run: |
          $env:PYTHONHASHSEED='1'
          $env:SOURCE_DATE_EPOCH='946684800'
          pyinstaller --noconfirm --clean GeometryLottoPro.spec
          if ($LASTEXITCODE -ne 0) { throw 'primary main build failed' }
          $primary=(Get-FileHash .\dist\Geometry_Lotto_Pro_DLT.exe -Algorithm SHA256).Hash.ToLower()

          New-Item -ItemType Directory -Force .\reproducible_build\main-dist | Out-Null
          pyinstaller --noconfirm --clean --distpath .\reproducible_build\main-dist --workpath .\reproducible_build\main-work GeometryLottoPro.spec
          if ($LASTEXITCODE -ne 0) { throw 'reproducible main build failed' }
          $rebuilt=(Get-FileHash .\reproducible_build\main-dist\Geometry_Lotto_Pro_DLT.exe -Algorithm SHA256).Hash.ToLower()
          $same=($primary -eq $rebuilt)
          New-Item -ItemType Directory -Force .\artifacts | Out-Null
          $r=[ordered]@{
            schema='dlt-reproducible-main-build-v1'
            status=$(if($same){'PASS'}else{'FAIL'})
            github_sha=$env:GITHUB_SHA
            github_run_id=$env:GITHUB_RUN_ID
            primary_sha256=$primary
            rebuild_sha256=$rebuilt
            same_hash=$same
            pythonhashseed=$env:PYTHONHASHSEED
            source_date_epoch=$env:SOURCE_DATE_EPOCH
          }
          $r | ConvertTo-Json -Depth 5 | Set-Content .\artifacts\reproducible_main_build.json -Encoding utf8
          Get-Content .\artifacts\reproducible_main_build.json
          if(-not $same){ throw 'main EXE reproducible Same Hash failed' }

      - name: Native Windows independent Updater build + reproducible Same Hash
        shell: pwsh
        run: |
          $env:PYTHONHASHSEED='1'
          $env:SOURCE_DATE_EPOCH='946684800'
          pyinstaller --noconfirm --clean --distpath .\dist --workpath .\updater_primary_work GeometryLottoProUpdater.spec
          if ($LASTEXITCODE -ne 0) { throw 'primary updater build failed' }
          $primary=(Get-FileHash .\dist\Geometry_Lotto_Pro_DLT_Updater.exe -Algorithm SHA256).Hash.ToLower()

          New-Item -ItemType Directory -Force .\reproducible_build\updater-dist | Out-Null
          pyinstaller --noconfirm --clean --distpath .\reproducible_build\updater-dist --workpath .\reproducible_build\updater-work GeometryLottoProUpdater.spec
          if ($LASTEXITCODE -ne 0) { throw 'reproducible updater build failed' }
          $rebuilt=(Get-FileHash .\reproducible_build\updater-dist\Geometry_Lotto_Pro_DLT_Updater.exe -Algorithm SHA256).Hash.ToLower()
          if($primary -ne $rebuilt){ throw 'Updater reproducible Same Hash failed' }

      - name: Exact-package Windows acceptance
        shell: pwsh
        run: ./scripts/windows_acceptance.ps1

      - name: Publish hash-bound current-version prerelease on independent main
        if: github.repository == 'douluo511/Geometry-Lotto-Pro-DLT' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $env:PYTHONPATH="$PWD\src"
          $version=(python -c "from glp.constants import APP_VERSION; print(APP_VERSION)").Trim()
          if($version -notmatch '^\d+\.\d+\.\d+$'){ throw 'APP_VERSION is not stable semver' }
          $tag="v$version"
          $exe=(Resolve-Path ".\dist\Geometry_Lotto_Pro_DLT.exe").Path
          $updater=(Resolve-Path ".\dist\Geometry_Lotto_Pro_DLT_Updater.exe").Path
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes=(Get-Item $exe).Length
          New-Item -ItemType Directory -Force ".\artifacts" | Out-Null
          $manifestName="dlt-$version-manifest.json"
          $manifestPath=(Resolve-Path ".\artifacts").Path + "\$manifestName"
          $artifactUrl="https://github.com/douluo511/Geometry-Lotto-Pro-DLT/releases/download/$tag/Geometry_Lotto_Pro_DLT.exe"
          $manifest=[ordered]@{
            schema='dlt-software-update-manifest-v1'
            app='Geometry Lotto Pro DLT'
            version=$version
            artifact_url=$artifactUrl
            artifact_sha256=$sha
            artifact_bytes=[int64]$bytes
            github_sha=$env:GITHUB_SHA
            github_run_id=$env:GITHUB_RUN_ID
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $manifestPath -Encoding utf8
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -ne 0){
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title "DLT $version acceptance prerelease" --notes "Hash-bound prerelease for real N-to-N+1 updater acceptance. Not Final until Final Gate PASS."
            if($LASTEXITCODE -ne 0){ throw 'failed to create acceptance prerelease' }
          }
          gh release upload $tag $exe $updater $manifestPath --repo $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE -ne 0){ throw 'failed to upload hash-bound prerelease assets' }

      - name: Independent Updater exact-process / rollback / data-network acceptance
        shell: pwsh
        run: |
          .\scripts\updater_acceptance.ps1 `
            -UpdaterExe ".\dist\Geometry_Lotto_Pro_DLT_Updater.exe" `
            -MainExe ".\dist\Geometry_Lotto_Pro_DLT.exe" `
            -RebuiltUpdaterExe ".\reproducible_build\updater-dist\Geometry_Lotto_Pro_DLT_Updater.exe" `
            -EvidencePath ".\artifacts\updater_acceptance.json"

      - name: Independent repository real Release N-to-N+1 updater acceptance
        if: github.repository == 'douluo511/Geometry-Lotto-Pro-DLT' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $env:PYTHONPATH="$PWD\src"
          $current=(python -c "from glp.constants import APP_VERSION; print(APP_VERSION)").Trim()
          $parts=$current.Split('.')
          if($parts.Count -ne 3 -or [int]$parts[2] -le 0){ throw 'current APP_VERSION cannot derive previous patch release' }
          $previous="$($parts[0]).$($parts[1]).$([int]$parts[2]-1)"
          .\scripts\release_update_acceptance.ps1 `
            -UpdaterExe ".\dist\Geometry_Lotto_Pro_DLT_Updater.exe" `
            -CurrentMainExe ".\dist\Geometry_Lotto_Pro_DLT.exe" `
            -UpdaterEvidencePath ".\artifacts\updater_acceptance.json" `
            -EvidencePath ".\artifacts\real_release_update.json" `
            -CurrentVersion $current `
            -PreviousVersion $previous

      - name: Exact EXE GUI construction gate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ".\\artifacts" | Out-Null
          $out = (Resolve-Path ".\\artifacts").Path + "\\gui_self_test.json"
          $p = Start-Process -FilePath ".\\dist\\Geometry_Lotto_Pro_DLT.exe" -ArgumentList @("--gui-self-test","--result-file",$out) -PassThru -Wait -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw "Exact EXE GUI construction self-test failed with exit code $($p.ExitCode)" }
          if (-not (Test-Path $out)) { throw "Exact EXE GUI construction evidence missing" }
          $r = Get-Content $out -Raw | ConvertFrom-Json
          Get-Content $out
          if ($r.status -ne "PASS") { throw "Exact EXE GUI construction gate failed" }

      - name: Exact EXE detached background continuity
        shell: pwsh
        run: |
          .\scripts\background_acceptance.ps1 `
            -MainExe ".\dist\Geometry_Lotto_Pro_DLT.exe" `
            -EvidencePath ".\artifacts\background_acceptance.json" `
            -TimeoutSeconds 1800

      - name: Physical GUI Click Smoke
        shell: pwsh
        run: |
          .\scripts\physical_gui_click_smoke.ps1 `
            -ExePath ".\dist\Geometry_Lotto_Pro_DLT.exe" `
            -Points "0.14,0.15;0.38,0.15;0.14,0.24;0.38,0.24" `
            -ButtonTexts "预测下一期;一键更新;一键修复;高级分析" `
            -PreconditionIndex 1 `
            -EvidencePath ".\artifacts\physical_gui_click.json" `
            -BackendEvidencePath ".\artifacts\physical_gui_backend.json" `
            -BackendTimeoutSeconds 1800

      - name: Physical GUI Update Fail-Closed Click
        shell: pwsh
        run: |
          .\scripts\physical_gui_failure_smoke.ps1 `
            -ExePath ".\dist\Geometry_Lotto_Pro_DLT.exe" `
            -UpdaterExePath ".\dist\Geometry_Lotto_Pro_DLT_Updater.exe" `
            -SuccessBackendPath ".\artifacts\physical_gui_backend.json" `
            -Operation update `
            -EvidencePath ".\artifacts\physical_gui_failure.json"

      - name: Physical GUI Repair Fail-Closed Click
        shell: pwsh
        run: |
          .\scripts\physical_gui_failure_smoke.ps1 `
            -ExePath ".\dist\Geometry_Lotto_Pro_DLT.exe" `
            -UpdaterExePath ".\dist\Geometry_Lotto_Pro_DLT_Updater.exe" `
            -SuccessBackendPath ".\artifacts\physical_gui_backend.json" `
            -Operation repair `
            -OperationTimeoutSeconds 900 `
            -EvidencePath ".\artifacts\physical_gui_repair_failure.json"

      - name: Runtime B01-B08 business and no-shell evidence gate
        shell: pwsh
        run: |
          $env:PYTHONPATH="$PWD\src"
          python scripts/business_runtime_gate.py `
            --evidence-dir ".\artifacts" `
            --exe ".\dist\Geometry_Lotto_Pro_DLT.exe" `
            --report ".\artifacts\business_runtime_gate.json"
          if($LASTEXITCODE -ne 0){ throw 'DLT runtime business evidence derivation failed' }
          Get-Content ".\artifacts\business_runtime_gate.json"

      - name: Evidence-derived Final Gate
        shell: pwsh
        run: |
          python scripts/final_gate.py `
            --evidence-dir ".\artifacts" `
            --exe ".\dist\Geometry_Lotto_Pro_DLT.exe" `
            --report ".\artifacts\final_gate.json"
          $exit=$LASTEXITCODE
          $final=Get-Content ".\artifacts\final_gate.json" -Raw | ConvertFrom-Json
          Get-Content ".\artifacts\final_gate.json"
          if($exit -ne 0 -or $final.final_gate -ne 'PASS' -or [int]$final.hard_fail_count -ne 0){
            throw "DLT Final Gate blocked: $($final.non_pass_gates -join ', ')"
          }

      - name: Upload exact EXE and evidence only after all hard gates pass
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Geometry-Lotto-Pro-DLT-Windows-Acceptance
          # upload-artifact is an action (not a run step), so defaults.run.working-directory
          # does not apply. Paths must be repository-root relative.
          path: |
            DLT/dist/Geometry_Lotto_Pro_DLT.exe
            DLT/dist/Geometry_Lotto_Pro_DLT_Updater.exe
            DLT/artifacts/**
          if-no-files-found: error
          retention-days: 30

      - name: Promote current release only after Final Gate and final artifact upload PASS
        if: success() && github.repository == 'douluo511/Geometry-Lotto-Pro-DLT' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $env:PYTHONPATH="$PWD\src"
          $version=(python -c "from glp.constants import APP_VERSION; print(APP_VERSION)").Trim()
          $tag="v$version"
          $final=Get-Content ".\artifacts\final_gate.json" -Raw | ConvertFrom-Json
          if($final.final_gate -ne 'PASS' -or [int]$final.hard_fail_count -ne 0){ throw 'cannot promote non-PASS Final Gate' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --prerelease=false --draft=false --title "Geometry Lotto Pro DLT $version FINAL"
          if($LASTEXITCODE -ne 0){ throw 'failed to promote DLT Final release' }


      - name: Upload DLT diagnostic candidate and evidence - NOT FINAL
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Geometry-Lotto-Pro-DLT-CANDIDATE-NOT-FINAL
          path: |
            DLT/dist/Geometry_Lotto_Pro_DLT.exe
            DLT/dist/Geometry_Lotto_Pro_DLT_Updater.exe
            DLT/artifacts/**
          if-no-files-found: warn
          retention-days: 90

# Hard-gate revalidation trigger: DLT negative GUI failure gates + fail-closed scope review


  prospective-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: dlt-prospective-ledger
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout exact prospective source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Exact prospective source identity gate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "EXACT_PROSPECTIVE_SOURCE=$EXPECTED_SHA"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r DLT/requirements.txt

      - name: Compile prospective protocol
        run: python -m compileall -q DLT/src/glp/prospective.py DLT/scripts/prospective_snapshot.py

      - name: Prospective protocol and 1.0.3 compatibility tests
        env:
          PYTHONPATH: DLT/src
        run: |
          python -m unittest DLT.tests.test_prospective_protocol -v
          python -m unittest DLT.tests.test_background_103_compat -v

      - name: Checkout persistent prospective evidence ledger
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: evidence/dlt-prospective-ledger
          path: prospective-ledger
          fetch-depth: 1

      - name: Execute live official prospective cycle
        env:
          GLP_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python DLT/scripts/prospective_snapshot.py --ledger-dir prospective-ledger/DLT/prospective_ledger

      - name: Fail-closed prospective evidence schema
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("prospective-ledger/DLT/prospective_ledger/last_cycle.json")
          x=json.loads(p.read_text(encoding="utf-8"))
          live=x["live_source"]
          status=x["status"]
          freeze=x["freeze"]
          cohort=x["cohort"]
          assert cohort["source_commit"] == os.environ["EXPECTED_SHA"]
          assert live["network_gate"] == "PASS"
          assert live["freshness_gate"] == "PASS"
          assert live["crosscheck_status"] == "PASS"
          assert freeze["target_issue"] != live["latest_issue"]
          assert freeze["research_only"] is True
          assert freeze["production_rho"] == 0.0
          assert freeze["promotion_authorized"] is False
          assert freeze["prediction"]["edge_state"] == "NO_EDGE"
          assert freeze["prediction"]["dan_state"] == "NULL_DAN"
          assert len(freeze["prediction"]["research_dan_front"]) in {1, 2}
          assert status["edge_state"] == "NO_EDGE"
          assert status["dan_state"] == "NULL_DAN"
          assert status["production_rho"] == 0.0
          assert status["promotion_authorized"] is False
          assert status["qualification"]["decision"] in {"NOT_READY","NO_EDGE","PROSPECTIVE_EDGE_CANDIDATE"}
          if status["qualification"]["decision"] == "PROSPECTIVE_EDGE_CANDIDATE":
              assert status["qualification"]["promotion_authorized"] is False
              assert status["qualification"]["production_rho"] == 0.0
          print("PROSPECTIVE_FAIL_CLOSED_SCHEMA=PASS")
          PY

      - name: Commit append-only prospective ledger evidence
        id: prospective_ledger
        working-directory: prospective-ledger
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DLT/prospective_ledger
          if git diff --cached --quiet; then
            echo "LEDGER_CHANGED=false"
          else
            git commit -m "DLT prospective cycle: source ${SOURCE_SHA}"
            git push origin HEAD:evidence/dlt-prospective-ledger
            echo "LEDGER_CHANGED=true"
          fi
          echo "LEDGER_COMMIT=$(git rev-parse HEAD)"
          echo "ledger_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload exact prospective evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DLT-PROSPECTIVE-${{ github.event.pull_request.head.sha || github.sha }}
          path: prospective-ledger/DLT/prospective_ledger
          if-no-files-found: error
          retention-days: 90
