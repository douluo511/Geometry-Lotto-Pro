name: Stock SSE market-wide risk-warning history

on:
  push:
    branches:
      - "diagnostic/stock-sse-risk-warning-marketwide-20261006"
    paths:
      - ".github/stock_diag/stock_sse_marketwide_risk_warning_history.py"
      - ".github/workflows/stock-sse-marketwide-risk-warning-history.yml"
  pull_request:
    paths:
      - ".github/stock_diag/stock_sse_marketwide_risk_warning_history.py"
      - ".github/workflows/stock-sse-marketwide-risk-warning-history.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout and unchanged Stock product bytes
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          authoritative="43168d9e75c70ab55be808d8a51f0c0eb14d83d5"
          git merge-base --is-ancestor "$authoritative" HEAD
          test -z "$(git diff --name-only "$authoritative..HEAD" -- StockAIPro)"
          echo "STOCK_PRODUCT_BYTES_CHANGED=FALSE"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"

      - name: Install pinned dependency
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2"

      - name: Query market-wide official SSE risk-warning history
        run: python .github/stock_diag/stock_sse_marketwide_risk_warning_history.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-SSE-MARKETWIDE-RISK-WARNING-${{ github.sha }}
          path: stock_sse_marketwide_risk_warning_history.json
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve strict boundary
        if: success()
        run: |
          python - <<'PY'
          import json
          x=json.load(open("stock_sse_marketwide_risk_warning_history.json",encoding="utf-8"))
          a=x["adjudication"]
          assert a["marketwide_risk_warning_event_surface"] == "SUPPORTED"
          assert a["shanghai_historical_st_pit"] == "NOT VERIFIED"
          assert a["effective_state_reconstruction"] == "NOT VERIFIED"
          assert a["full_historical_st_pit"] == "NOT VERIFIED"
          assert a["advanced_business"] == "NOT VERIFIED"
          assert a["final_gate"] == "FAIL"
          print("MARKETWIDE_RISK_WARNING_EVENT_SURFACE=SUPPORTED")
          print("SHANGHAI_HISTORICAL_ST_PIT=NOT VERIFIED")
          print("FINAL_GATE=FAIL")
          PY
