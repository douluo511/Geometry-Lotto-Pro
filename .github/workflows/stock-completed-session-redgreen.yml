name: Stock completed daily session RED-GREEN counterexamples
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'StockAIPro/hardening_tests/completed_session_first_fail_test.py'
      - 'StockAIPro/staging/Stock_AI_Pro/versions/4.3.0/stock_ai/completed_session.py'
      - 'StockAIPro/staging/Stock_AI_Pro/versions/4.3.0/stock_ai/data_source.py'
      - '.github/workflows/stock-completed-session-redgreen.yml'
permissions:
  contents: read
jobs:
  completed-session-counterexamples:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      STOCK_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: StockAIPro
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.STOCK_SOURCE_SHA }}
      - name: Verify exact source head
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:STOCK_SOURCE_SHA) { throw 'wrong source head' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - run: python -m pip install --disable-pip-version-check -r requirements-offline-ci.txt
      - name: Product counterexamples against actual index and history consumers
        run: python hardening_tests/completed_session_first_fail_test.py
      - name: Preserve exact-head counterexample receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Stock-completed-session-counterexamples-${{ env.STOCK_SOURCE_SHA }}
          path: StockAIPro/completed_session_first_fail_evidence.json
          if-no-files-found: error
