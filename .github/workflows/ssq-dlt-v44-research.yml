name: SSQ DLT V4.4 Research D2 Scoring

on:
  push:
    branches:
      - "research/ssq-dlt-v44-d2-prospective-gates"
      - "research/ssq-dlt-v44-local-ledger"
    paths:
      - "research/ssq_dlt_d2_v44/**"
      - ".github/workflows/ssq-dlt-v44-research.yml"
  pull_request:
    paths:
      - "research/ssq_dlt_d2_v44/**"
      - ".github/workflows/ssq-dlt-v44-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-score-tests:
    name: Research D2 tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile scoring module
        run: python -m py_compile research/ssq_dlt_d2_v44/scoring.py
      - name: Install real signature verifier
        run: python -m pip install -r research/ssq_dlt_d2_v44/requirements-test.txt
      - name: Require cryptographic dependency
        run: python -c "from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey"
      - name: Negative and positive unit tests
        run: python -m unittest discover -s research/ssq_dlt_d2_v44/tests -v
