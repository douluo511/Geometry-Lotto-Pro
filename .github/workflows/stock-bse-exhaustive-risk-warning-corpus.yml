name: Stock BSE exhaustive risk-warning corpus

on:
  push:
    branches:
      - "diagnostic/stock-bse-exhaustive-risk-warning-corpus-20261006"
    paths:
      - ".github/stock_diag/stock_bse_exhaustive_risk_warning_corpus.py"
      - ".github/workflows/stock-bse-exhaustive-risk-warning-corpus.yml"
  pull_request:
    paths:
      - ".github/stock_diag/stock_bse_exhaustive_risk_warning_corpus.py"
      - ".github/workflows/stock-bse-exhaustive-risk-warning-corpus.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout and unchanged Stock product bytes
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          authoritative="7f270b9ab58e11fd8129053a65e000c90ff9d8c1"
          test "$(git rev-parse HEAD)" = "$expected"
          git merge-base --is-ancestor "$authoritative" HEAD
          test -z "$(git diff --name-only "$authoritative"..HEAD -- StockAIPro)"
          echo "STOCK_PRODUCT_BYTES_CHANGED=FALSE"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"

      - name: Install pinned dependency
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2"

      - name: Replay exhaustive BSE risk-warning keyword corpus
        id: replay
        continue-on-error: true
        run: python .github/stock_diag/stock_bse_exhaustive_risk_warning_corpus.py

      - name: Upload exhaustive replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-BSE-EXHAUSTIVE-RISK-WARNING-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            stock_bse_exhaustive_risk_warning_corpus.json
            stock_bse_exhaustive_risk_warning_corpus.canonical.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve strict evidence boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f stock_bse_exhaustive_risk_warning_corpus.json
          python - <<'PY'
          import json
          x=json.load(open("stock_bse_exhaustive_risk_warning_corpus.json",encoding="utf-8"))
          a=x["adjudication"]
          assert a["bse_historical_st_effective_date_reconstruction"] == "NOT VERIFIED"
          assert a["bse_historical_st_pit"] == "NOT VERIFIED"
          assert a["bse_historical_suspension_pit"] == "NOT VERIFIED"
          assert a["full_historical_st_pit"] == "NOT VERIFIED"
          assert a["advanced_business"] == "NOT VERIFIED"
          assert a["final_gate"] == "FAIL"
          print("EXHAUSTIVE_BSE_KEYWORD_EVENT_CORPUS="+a["exhaustive_bse_keyword_event_corpus"])
          print("BSE_HISTORICAL_ST_PIT=NOT VERIFIED")
          print("FINAL_GATE=FAIL")
          PY
          test "${{ steps.replay.outcome }}" = "success"
