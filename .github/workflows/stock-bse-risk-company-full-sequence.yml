name: Stock BSE risk-company full sequence
on:
  push:
    branches:
      - diagnostic/stock-bse-risk-company-full-sequence-20261006
  workflow_dispatch:
permissions:
  contents: read
jobs:
  company-sequence:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact checkout and unchanged Stock product bytes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 080b24bf7f438ee0dcd45df1ab4e73405657d789 HEAD
          test -z "$(git diff --name-only 080b24bf7f438ee0dcd45df1ab4e73405657d789..HEAD -- StockAIPro)"
      - uses: actions/setup-python@a26af69be951213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
      - run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2"
      - name: Exhaust company-scoped BSE announcement sequences
        run: python .github/stock_diag/stock_bse_risk_company_full_sequence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: STOCK-BSE-RISK-COMPANY-SEQUENCE-${{ github.sha }}
          path: |
            stock_bse_risk_company_full_sequence.json
            stock_bse_risk_warning_marketwide_corpus.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve strict boundary
        if: always()
        run: |
          echo "BSE_REMOVAL_EVENT_HISTORY_COMPLETE=NOT VERIFIED"
          echo "BSE_EFFECTIVE_STATE_RECONSTRUCTION=NOT VERIFIED"
          echo "BSE_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "FULL_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"
