name: Stock SZSE frozen 1849 raw source - 19 independent shards

on:
  push:
    branches:
      - fix/stock-szse-bounded-shard-evidence-20261008
    paths:
      - ".github/stock_diag/stock_szse_merge_shards.py"
      - ".github/stock_diag/test_szse_merge_shards.py"
      - ".github/workflows/stock-szse-all-shards.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - name: Install pinned source contracts
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2" "beautifulsoup4==4.15.0"
      - name: Offline 16 shard plus 6 merge counterexamples
        run: |
          python .github/stock_diag/test_szse_bounded_shard.py
          python .github/stock_diag/test_szse_merge_shards.py
  fetch:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ["00", "01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13", "14", "15", "16", "17", "18"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require exact Stock #329 product-byte identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git merge-base --is-ancestor 9969490c89ccb4cc10536f66416976c5bf40caef HEAD
          test -z "$(git diff --name-only 9969490c89ccb4cc10536f66416976c5bf40caef..HEAD -- StockAIPro)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - name: Install pinned source parser
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2" "beautifulsoup4==4.15.0"
      - name: Validate pinned 1849 old URL identities - not old HTTP results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 120 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/11532256260/zip" \
            --output frozen_source_artifact.zip
          echo "89e065870802432a2c53585886f38479b3691785759604caae8ecb8526235593  frozen_source_artifact.zip" | sha256sum --check
          unzip -oq frozen_source_artifact.zip
          test -f stock_szse_suspension_static_archive.json
      - name: Official HTTPS bounded shard ${{ matrix.shard }} - exact current head
        shell: bash
        run: |
          set -euo pipefail
          python .github/stock_diag/stock_szse_bounded_shard.py \
            --archive stock_szse_suspension_static_archive.json \
            --shard-index ${{ matrix.shard }} \
            --raw-dir szse_shard_raw --report szse_shard_report.json
      - name: Upload all raw, including failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shard-${{ matrix.shard }}
          path: |
            szse_shard_report.json
            szse_shard_raw/
          if-no-files-found: warn
          retention-days: 30
  aggregate:
    needs: [contracts, fetch]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - name: Install parser
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2" "beautifulsoup4==4.15.0"
      - name: Get all current-run immutable shard artifacts without overlay
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: shard-*
          path: shard-parts
          merge-multiple: false
      - name: Retrieve same frozen official URL-index authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 120 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/11532256260/zip" \
            --output frozen_source_artifact.zip
          echo "89e065870802432a2c53585886f38479b3691785759604caae8ecb8526235593  frozen_source_artifact.zip" | sha256sum --check
          unzip -oq frozen_source_artifact.zip
      - name: Reject missing shard, response tamper, URL mismatch or false Final
        run: |
          python .github/stock_diag/stock_szse_merge_shards.py \
            --archive stock_szse_suspension_static_archive.json \
            --parts shard-parts \
            --report szse_1849_merged_source.json
      - name: Upload only diagnostic source aggregation, not production PIT
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-SZSE-FROZEN-SOURCE-MERGE-NOT-PIT-${{ github.sha }}
          path: szse_1849_merged_source.json
          if-no-files-found: warn
          retention-days: 30
