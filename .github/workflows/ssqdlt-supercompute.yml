name: SSQDLT CPU supercompute research (manual)

on:
  push:
    branches:
      - main
      - 'feature/ssqdlt-supercompute-*'
    paths:
      - 'research/supercompute/**'
      - 'tests/test_supercompute.py'
      - '.github/workflows/ssqdlt-supercompute.yml'
  workflow_dispatch:
    inputs:
      trials:
        description: 'Uniform MC draws per lottery'
        type: choice
        required: true
        default: '50000'
        options: ['5000', '50000', '250000', '1000000']
      backtest:
        description: 'Historical walk-forward periods'
        type: choice
        required: true
        default: '200'
        options: ['50', '200', '500']
      workers:
        description: 'CPU processes'
        type: choice
        required: true
        default: '2'
        options: ['1', '2', '4']

permissions:
  contents: read

concurrency:
  group: ssqdlt-supercompute-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify historical data, CPU determinism, and research firewall
        run: python -m unittest discover -s tests -p 'test_supercompute.py' -v

  smoke:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Actually compute both historical snapshots with CPU parallel workers
        run: >-
          python -m research.supercompute.engine
          --game both --simulate 10000
          --backtest 200 --workers 2
          --out supercompute-output
      - name: Verify receipt SHA256 and research-only outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib
          p=Path("supercompute-output")
          raw=(p/"report.json").read_bytes()
          assert hashlib.sha256(raw).hexdigest()==(p/"report.sha256").read_text().split()[0]
          r=json.loads(raw)
          assert set(r["games"])=={"ssq","dlt"} and r["paid_api_calls"]==0
          for entry in r["games"].values():
              assert entry["edge"]=="NO_EDGE"
              assert entry["formal_A"]==0
              assert entry["uniform_monte_carlo"]["trials"]==10000
              assert entry["historical_walk_forward"]["models"]["RANDOM_NULL"]["evaluated"]==200
          print("FULL_BOTH_GAMES_RESEARCH_SMOKE_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ssqdlt-cpu-smoke-${{ github.run_id }}
          path: supercompute-output/
          retention-days: 90
          if-no-files-found: error

  calculate:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated snapshot-only CPU calculator
        run: >-
          python -m research.supercompute.engine
          --game both --simulate "${{ inputs.trials }}"
          --backtest "${{ inputs.backtest }}"
          --workers "${{ inputs.workers }}"
          --out supercompute-output
      - name: Verify SHA256 and no formal claims
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          base=Path("supercompute-output")
          raw=(base/"report.json").read_bytes()
          expected=(base/"report.sha256").read_text().split()[0]
          assert hashlib.sha256(raw).hexdigest()==expected
          report=json.loads(raw)
          assert report["paid_api_calls"]==0
          assert set(report["games"])=={"ssq","dlt"}
          for game in report["games"].values():
              assert game["edge"]=="NO_EDGE"
              assert game["formal_A"]==0
          print("OFFLINE_RESEARCH_RECEIPT_OK", expected)
          PY
      - name: Archive evidence from this one GitHub run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssqdlt-cpu-research-${{ github.run_id }}
          path: supercompute-output/
          if-no-files-found: warn
          retention-days: 90
      - name: Show historical cutoff and evidence boundary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report=json.loads(Path("supercompute-output/report.json").read_text())
          print("## CPU calculation — historical research, NOT live prediction")
          for name, game in report["games"].items():
              snap=game["snapshot"]
              print(f"* {name}: {snap['rows']} rows; through {snap['asof_issue']} ({snap['asof_date']}); {game['edge']}")
          print("Lottery results are not predictable by increasing computation alone.")
          PY
