name: Stock SZSE dated claims x A-share candidate intake - NOT PIT

on:
  push:
    branches:
      - diagnostic/stock-pit-ashare-effective-join-20261008
    paths:
      - ".github/stock_diag/stock_szse_ashare_effective_join.py"
      - ".github/stock_diag/test_stock_szse_ashare_effective_join.py"
      - ".github/workflows/stock-szse-ashare-effective-join.yml"
  pull_request:
    paths:
      - ".github/stock_diag/stock_szse_ashare_effective_join.py"
      - ".github/stock_diag/test_stock_szse_ashare_effective_join.py"
      - ".github/workflows/stock-szse-ashare-effective-join.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  hash-joined-ashare-dated-notice:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact audit candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact SHA and unchanged Stock product bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor 9969490c89ccb4cc10536f66416976c5bf40caef HEAD
          git merge-base --is-ancestor f3965d5b47458b2e0574be6c07302a5c507cbb24 HEAD
          test -z "$(git diff --name-only 9969490c89ccb4cc10536f66416976c5bf40caef..HEAD -- StockAIPro)"
      - name: Setup pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - name: Run candidate provenance and fake state negative contracts
        run: python .github/stock_diag/test_stock_szse_ashare_effective_join.py
      - name: Retrieve exact #343 A/B share candidate output, no network PASS inheritance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/11533373747/zip" \
            --output stock_ashare_candidate_input.zip
          echo "0933a38db88b3e591572e1e076cd7f25f625905e503157e458a2ec303fc6eb66  stock_ashare_candidate_input.zip" | sha256sum --check
          mkdir ashare_input
          unzip -oq stock_ashare_candidate_input.zip -d ashare_input
          test -f ashare_input/stock_szse_ashare_candidate_evidence.json
      - name: Retrieve exact #341 dated-claim diagnostic, no PIT state inheritance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/11533993962/zip" \
            --output stock_dated_notice_input.zip
          echo "4f388eaa85739faa764dba554f1883756b17a3136a39f955183a4c325ffb82d4  stock_dated_notice_input.zip" | sha256sum --check
          mkdir dated_input
          unzip -oq stock_dated_notice_input.zip -d dated_input
          test -f dated_input/stock_szse_effective_event_candidates.json
      - name: Bind actual 967 notice/equity pairs to source-matched dated claims
        run: |
          python .github/stock_diag/stock_szse_ashare_effective_join.py \
            --share ashare_input/stock_szse_ashare_candidate_evidence.json \
            --dated dated_input/stock_szse_effective_event_candidates.json \
            --out stock_szse_ashare_dated_candidate_join.json
      - name: Confirm complete candidate denominator and FAIL-closed product status
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("stock_szse_ashare_dated_candidate_join.json").read_text(encoding="utf-8"))
          assert (x["source_frozen_denominator"],x["total_equity_notice_pairs"],
                  x["a_share_candidate_pairs"],x["b_share_exclusions"])==(1849,967,958,9)
          assert len(x["pairs"])==967
          assert len({(a["official_url"],a["equity_code_candidate"]) for a in x["pairs"]})==967
          assert all(a["actual_equity_asof_master"]=="NOT VERIFIED" and
                     a["realized_stock_halt"]=="NOT VERIFIED" and
                     a["realized_resumption"]=="NOT VERIFIED" and
                     a["qualified_daily_st_pit"]=="NOT VERIFIED" for a in x["pairs"])
          assert x["adjudication"]["final_gate"]=="FAIL"
          assert not Path("historical_st_pit.json").exists()
          print("SOURCE_BOUND_A_SHARE_DATED_CANDIDATES=PASS; HISTORICAL_PIT=NOT VERIFIED; FINAL_GATE=FAIL")
          PY
      - name: Upload hash-bound diagnostic only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-SZSE-SHARE-DATE-CANDIDATES-NOT-PIT-${{ github.event.pull_request.head.sha || github.sha }}
          path: stock_szse_ashare_dated_candidate_join.json
          if-no-files-found: warn
          retention-days: 30
