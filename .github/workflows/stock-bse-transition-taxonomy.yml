name: Stock BSE transition taxonomy diagnostic

on:
  push:
    branches:
      - diagnostic/stock-bse-transition-taxonomy-20261006
  workflow_dispatch:

permissions:
  contents: read

jobs:
  taxonomy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout and unchanged Stock product bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 56d1e933c8671783f592f0f45c80caafc629f057 HEAD
          test -z "$(git diff --name-only 56d1e933c8671783f592f0f45c80caafc629f057..HEAD -- StockAIPro)"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2" "pypdf==6.1.1"

      - name: Rebuild exhaustive BSE corpus
        run: python .github/stock_diag/stock_bse_risk_warning_marketwide_corpus.py

      - name: Reproduce effective-date evidence without hiding non-pass
        shell: bash
        run: |
          set +e
          python .github/stock_diag/stock_bse_risk_warning_effective_dates.py
          rc=$?
          set -e
          echo "EFFECTIVE_DATE_DIAGNOSTIC_EXIT=$rc"
          test -f stock_bse_risk_warning_effective_dates.json

      - name: Classify initial implementation vs continuation semantics
        run: python .github/stock_diag/stock_bse_transition_taxonomy.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-BSE-TRANSITION-TAXONOMY-${{ github.sha }}
          path: |
            stock_bse_risk_warning_marketwide_corpus.json
            stock_bse_risk_warning_effective_dates.json
            stock_bse_transition_taxonomy.json
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve strict boundary
        if: always()
        run: |
          echo "BSE_REMOVAL_EVENT_HISTORY=NOT VERIFIED"
          echo "BSE_EFFECTIVE_STATE_RECONSTRUCTION=NOT VERIFIED"
          echo "BSE_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "FULL_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "ADVANCED_BUSINESS=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"
