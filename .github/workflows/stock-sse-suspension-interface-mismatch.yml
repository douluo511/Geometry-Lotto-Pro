name: Stock SSE suspension interface mismatch classification

on:
  push:
    branches:
      - "diagnostic/stock-sse-suspension-interface-mismatch-20261005"
    paths:
      - "StockAIPro/hardening_tests/stock_sse_suspension_interface_mismatch.py"
      - ".github/workflows/stock-sse-suspension-interface-mismatch.yml"
  pull_request:
    paths:
      - "StockAIPro/hardening_tests/stock_sse_suspension_interface_mismatch.py"
      - ".github/workflows/stock-sse-suspension-interface-mismatch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout and unchanged Stock product bytes
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          echo "EXACT_DIAGNOSTIC_HEAD=$actual"
          base="43168d9e75c70ab55be808d8a51f0c0eb14d83d5"
          git merge-base --is-ancestor "$base" HEAD
          unexpected=""
          while IFS= read -r p; do
            case "$p" in
              StockAIPro/hardening_tests/stock_sse_*) ;;
              "") ;;
              *) unexpected="${unexpected}${p}"$'\n' ;;
            esac
          done < <(git diff --name-only "$base..HEAD" -- StockAIPro)
          test -z "$unexpected" || { printf "%s" "$unexpected"; exit 1; }
          echo "STOCK_PRODUCT_BYTES_CHANGED=FALSE"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"

      - name: Install pinned diagnostic dependency
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2"

      - name: Classify 2026 interval-vs-snapshot mismatches
        working-directory: StockAIPro
        run: python hardening_tests/stock_sse_suspension_interface_mismatch.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-SSE-SUSPENSION-MISMATCH-${{ github.sha }}
          path: StockAIPro/stock_sse_suspension_interface_mismatch.json
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve strict boundary
        if: always()
        working-directory: StockAIPro
        shell: bash
        run: |
          set -euo pipefail
          test -f stock_sse_suspension_interface_mismatch.json || { echo "EVIDENCE=NOT VERIFIED"; exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("stock_sse_suspension_interface_mismatch.json").read_text(encoding="utf-8"))
          a=x["adjudication"]
          assert a["historical_daily_suspension_state"] == "NOT VERIFIED"
          assert a["shanghai_historical_st_pit"] == "NOT VERIFIED"
          assert a["full_historical_st_pit"] == "NOT VERIFIED"
          assert a["advanced_business"] == "NOT VERIFIED"
          assert a["product_bytes_changed"] is False
          assert a["final_gate"] == "FAIL"
          print("SNAPSHOT_DATE_FILTER_DISCRIMINATION="+a["snapshot_date_filter_discrimination"])
          print("SNAPSHOT_INTERVAL_SEMANTICS="+a["daily_snapshot_vs_interval_semantics"])
          print("HISTORICAL_DAILY_SUSPENSION_STATE=NOT VERIFIED")
          print("FINAL_GATE=FAIL")
          PY
