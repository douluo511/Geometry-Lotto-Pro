name: Stock SSE daily suspension state semantics

on:
  push:
    branches:
      - "diagnostic/stock-sse-daily-suspension-state-semantics-20261005"
    paths:
      - "StockAIPro/hardening_tests/stock_sse_daily_snapshot_interval_consistency.py"
      - ".github/workflows/stock-sse-daily-suspension-state-semantics.yml"
  pull_request:
    paths:
      - "StockAIPro/hardening_tests/stock_sse_daily_snapshot_interval_consistency.py"
      - ".github/workflows/stock-sse-daily-suspension-state-semantics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout and product bytes unchanged
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          echo "EXACT_DIAGNOSTIC_HEAD=$actual"
          base="43168d9e75c70ab55be808d8a51f0c0eb14d83d5"
          git merge-base --is-ancestor "$base" HEAD
          changed="$(git diff --name-only "$base..HEAD" -- StockAIPro | grep -v '^StockAIPro/hardening_tests/stock_sse_' || true)"
          test -z "$changed" || { echo "$changed"; exit 1; }
          echo "STOCK_PRODUCT_BYTES_CHANGED=FALSE"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"

      - name: Install pinned diagnostic dependency
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2"

      - name: Cross-check official daily snapshots against official intervals
        working-directory: StockAIPro
        run: python hardening_tests/stock_sse_daily_snapshot_interval_consistency.py

      - name: Upload exact diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-SSE-DAILY-SUSPENSION-STATE-${{ github.sha }}
          path: StockAIPro/stock_sse_daily_snapshot_interval_consistency.json
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve strict non-promotion boundary
        if: always()
        working-directory: StockAIPro
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f stock_sse_daily_snapshot_interval_consistency.json ]; then
            echo "DAILY_STATE_EVIDENCE=NOT VERIFIED"
            echo "FULL_HISTORICAL_ST_PIT=NOT VERIFIED"
            echo "FINAL_GATE=FAIL"
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("stock_sse_daily_snapshot_interval_consistency.json").read_text(encoding="utf-8"))["adjudication"]
          assert a["shanghai_historical_st_pit"] == "NOT VERIFIED"
          assert a["beijing_historical_st_pit"] == "NOT VERIFIED"
          assert a["full_historical_st_pit"] == "NOT VERIFIED"
          assert a["advanced_business"] == "NOT VERIFIED"
          assert a["product_bytes_changed"] is False
          assert a["final_gate"] == "FAIL"
          print("SHANGHAI_DAILY_SUSPENSION_STATE="+a["shanghai_historical_daily_suspension_state"])
          print("SHANGHAI_HISTORICAL_ST_PIT=NOT VERIFIED")
          print("BEIJING_HISTORICAL_ST_PIT=NOT VERIFIED")
          print("FULL_HISTORICAL_ST_PIT=NOT VERIFIED")
          print("ADVANCED_BUSINESS=NOT VERIFIED")
          print("FINAL_GATE=FAIL")
          PY
