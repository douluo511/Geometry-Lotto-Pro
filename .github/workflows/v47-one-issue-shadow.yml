name: V47 one-issue historical-input audit (research only)
on:
  push:
    branches:
      - research/v47-next-issue-shadow-20261113
    paths:
      - '.github/workflows/v47-one-issue-shadow.yml'
      - 'research/harness_v46/next_issue_shadow.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect latest pinned historic observation rows
        run: python -m research.harness_v46.next_issue_shadow
