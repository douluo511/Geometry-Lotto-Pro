name: V47 one-issue historical-input audit (research only)
on:
  push:
    branches:
      - research/v47-next-issue-shadow-20261113
    paths:
      - '.github/workflows/v47-one-issue-shadow.yml'
      - 'research/harness_v46/next_issue_shadow.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute six V47 models and five exploratory arms per game
        run: python -m research.harness_v46.next_issue_shadow
      - name: Preserve exact model outputs and source hashes
        uses: actions/upload-artifact@v4
        with:
          name: one-issue-ssq-2026131-dlt-26130
          path: one-issue-shadow-20261113.json
          if-no-files-found: error
          retention-days: 90
