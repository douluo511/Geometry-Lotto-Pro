name: RMF SSE product-file distribution context

on:
  push:
    branches:
      - diagnostic/rmf-sse-product-file-distribution-context-20261006
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact checkout and unchanged RMF product bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor bcc70c0f600f9bc8888407fc626e0bde10f4404b HEAD
          test -z "$(git diff --name-only bcc70c0f600f9bc8888407fc626e0bde10f4404b..HEAD -- RealMoneyFinance)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2" "pypdf==5.4.0"
      - name: Extract official distribution context
        run: python .github/rmf/sse_product_file_distribution_context.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: RMF-SSE-PRODUCT-FILE-DISTRIBUTION-CONTEXT-${{ github.sha }}
          path: rmf_sse_product_file_distribution_context.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve strict boundary
        if: always()
        run: |
          echo "HISTORICAL_FILE_CONTENTS_REPLAYABLE_NOW=NOT VERIFIED"
          echo "HISTORICAL_PIT_CONTENT_AVAILABILITY=NOT VERIFIED"
          echo "SURVIVORSHIP_SELECTION_CONTROL=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"
