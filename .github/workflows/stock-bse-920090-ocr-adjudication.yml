name: Stock BSE 920090 OCR adjudication
on:
  push:
    branches:
      - diagnostic/stock-bse-920090-ocr-adjudication-20261006
    paths:
      - ".github/stock_diag/bse_920090_ocr_adjudication.py"
      - ".github/workflows/stock-bse-920090-ocr-adjudication.yml"
  pull_request:
    paths:
      - ".github/stock_diag/bse_920090_ocr_adjudication.py"
      - ".github/workflows/stock-bse-920090-ocr-adjudication.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adjudicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - name: Install pinned Python diagnostic dependencies
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2" "pymupdf==1.28.2"
      - name: Install Chinese Tesseract language pack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-chi-sim
          tesseract --version
          tesseract --list-langs
          dpkg-query -W -f='${Package}=${Version}\n' tesseract-ocr tesseract-ocr-chi-sim
      - name: OCR exact first-party 920090 resume PDF
        run: python .github/stock_diag/bse_920090_ocr_adjudication.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: STOCK-BSE-920090-OCR-${{ github.event.pull_request.head.sha || github.sha }}
          path: stock_bse_920090_ocr_adjudication.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve strict boundary
        if: always()
        run: |
          echo "OCR_IS_LAST_RESORT_DIAGNOSTIC_ONLY=true"
          echo "BSE_DAILY_SUSPENSION_PIT=NOT VERIFIED"
          echo "HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"
