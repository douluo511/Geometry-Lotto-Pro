name: Stock historical PIT consumption contract

on:
  push:
    branches:
      - diagnostic/stock-historical-pit-consumption-contract-20261006
  pull_request:
    paths:
      - ".github/stock_diag/stock_historical_pit_consumption_contract.py"
      - ".github/workflows/stock-historical-pit-consumption-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact checkout and unchanged Stock product bytes
        shell: bash
        run: |
          set -euo pipefail
          exact="${{ github.event.pull_request.head.sha || github.sha }}"
          authority="7f270b9ab58e11fd8129053a65e000c90ff9d8c1"
          test "$(git rev-parse HEAD)" = "$exact"
          test -z "$(git diff --name-only "$authority"..HEAD -- StockAIPro)"
          echo "STOCK_PRODUCT_TREE_BYTE_IDENTITY=PASS"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - name: Prove current PIT-consumption behavior
        run: python .github/stock_diag/stock_historical_pit_consumption_contract.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: STOCK-HISTORICAL-PIT-CONSUMPTION-CONTRACT-${{ github.event.pull_request.head.sha || github.sha }}
          path: stock_historical_pit_consumption_contract.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve strict boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f stock_historical_pit_consumption_contract.json
          python - <<'PY'
          import json
          x=json.load(open("stock_historical_pit_consumption_contract.json",encoding="utf-8"))
          a=x["adjudication"]
          assert a["historical_candidate_pool_consumes_pit"] == "FAIL"
          assert a["historical_dataset_carries_pit_state"] == "FAIL"
          assert a["behavior_gap_confirmed"] is True
          assert a["advanced_business"] == "NOT VERIFIED"
          assert a["final_gate"] == "FAIL"
          print("PIT_CONSUMPTION_GAP=CONFIRMED")
          print("ADVANCED_BUSINESS=NOT VERIFIED")
          print("FINAL_GATE=FAIL")
          PY
