name: Stock AI native Windows desktop candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'StockAIPro/desktop_native/**'
      - 'StockAIPro/hardening_tests/desktop_native_contract_test.py'
      - '.github/workflows/stock-ai-desktop-candidate.yml'

concurrency:
  group: stock-ai-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-candidate:
    runs-on: windows-2022
    timeout-minutes: 65
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      STOCK_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: StockAIPro
    steps:
      - name: Checkout exact desktop candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.STOCK_SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact checkout identity
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim()
          if ($actual -ne $env:STOCK_SOURCE_SHA) { throw "stale checkout: $actual != $env:STOCK_SOURCE_SHA" }

      - name: Setup pinned Windows Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
          architecture: 'x64'

      - name: Install runtime and native build dependencies
        run: |
          python -m pip install --disable-pip-version-check -r staging/Stock_AI_Pro/versions/4.3.0/requirements.txt
          python -m pip install --disable-pip-version-check pyinstaller==6.11.1

      - name: Native desktop service, repair, and updater contract gate
        run: python hardening_tests/desktop_native_contract_test.py

      - name: Build native Windows main and independent updater candidates
        shell: pwsh
        run: ./desktop_native/build_windows.ps1

      - name: Exact EXE headless self-test
        shell: pwsh
        run: |
          $exe = Resolve-Path ./dist/StockAIPro/StockAIPro.exe
          $before = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "StockAIPro.exe self-test failed rc=$LASTEXITCODE" }
          $after = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          if ($before -ne $after) { throw "EXE changed after self-test: $before != $after" }
          [ordered]@{
            status = "PASS"
            exe_sha256_before = $before
            exe_sha256_after = $after
            same_hash_after_self_test = "PASS"
            physical_gui = "NOT VERIFIED"
            final_same_hash = "NOT VERIFIED"
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 ./desktop_exact_exe_evidence.json

      - name: Frozen EXE repair worker runs through Service-compatible runtime
        shell: pwsh
        run: |
          $exe = Resolve-Path ./dist/StockAIPro/StockAIPro.exe
          $root = Resolve-Path ./dist/StockAIPro/_internal/Stock_AI_Pro
          $env:STOCK_AI_DATA_ROOT = Join-Path $env:RUNNER_TEMP "stock-ai-repair-worker"
          $before = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          & $exe --worker repair --package-root $root
          if ($LASTEXITCODE -ne 0) { throw "frozen repair worker failed rc=$LASTEXITCODE" }
          $after = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          if ($before -ne $after) { throw "EXE changed after repair worker: $before != $after" }
          Write-Host "FROZEN_REPAIR_WORKER=PASS; EXE_SHA256=$after"

      - name: Frozen EXE real-network core function
        shell: pwsh
        run: |
          $exe = Resolve-Path ./dist/StockAIPro/StockAIPro.exe
          $root = Resolve-Path ./dist/StockAIPro/_internal/Stock_AI_Pro
          $data = Join-Path $env:RUNNER_TEMP "stock-ai-frozen-business"
          $env:STOCK_AI_DATA_ROOT = $data
          $before = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          & $exe --worker core --package-root $root
          if ($LASTEXITCODE -ne 0) { throw "frozen core worker failed rc=$LASTEXITCODE" }
          $lastRun = Join-Path $data "state/last_run.json"
          if (!(Test-Path $lastRun)) { throw "frozen core produced no last_run.json" }
          $last = Get-Content -Raw $lastRun | ConvertFrom-Json
          if ($last.status -eq "FAIL") { throw "frozen core last_run status FAIL: $($last.error)" }
          $latest = Join-Path $data "predictions/latest/summary.json"
          if (!(Test-Path $latest)) { throw "frozen core produced no frozen prediction summary" }
          $after = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          if ($before -ne $after) { throw "EXE changed after frozen core: $before != $after" }
          [ordered]@{
            status = "PASS"
            action = "core"
            exe_sha256_before = $before
            exe_sha256_after = $after
            last_run_status = $last.status
            prediction_summary = $latest
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 ./desktop_frozen_core_evidence.json

      - name: Frozen EXE advanced analysis
        shell: pwsh
        run: |
          $exe = Resolve-Path ./dist/StockAIPro/StockAIPro.exe
          $root = Resolve-Path ./dist/StockAIPro/_internal/Stock_AI_Pro
          $env:STOCK_AI_DATA_ROOT = Join-Path $env:RUNNER_TEMP "stock-ai-frozen-business"
          $before = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          & $exe --worker advanced --package-root $root
          if ($LASTEXITCODE -ne 0) { throw "frozen advanced worker failed rc=$LASTEXITCODE" }
          if (!(Test-Path (Join-Path $env:STOCK_AI_DATA_ROOT "reports/audit_report.json"))) { throw "audit report missing" }
          if (!(Test-Path (Join-Path $env:STOCK_AI_DATA_ROOT "reports/backtest_summary.json"))) { throw "backtest summary missing" }
          $after = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          if ($before -ne $after) { throw "EXE changed after advanced analysis: $before != $after" }
          [ordered]@{
            status = "PASS"
            action = "advanced_analysis"
            exe_sha256_before = $before
            exe_sha256_after = $after
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 ./desktop_frozen_advanced_evidence.json

      - name: Independent updater exposes missing production release as BLOCKED
        shell: pwsh
        run: |
          $root = Resolve-Path ./dist/StockAIPro/_internal/Stock_AI_Pro
          & ./dist/StockAIPro/StockAIUpdater.exe --package-root $root
          $rc = $LASTEXITCODE
          if ($rc -ne 3) { throw "expected updater BLOCKED rc=3 without production release config, got $rc" }
          Write-Host "UPDATER_REAL_RELEASE=BLOCKED; reason=production signed manifest/release context absent"

      - name: Upload current Windows candidate and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Stock-AI-native-desktop-${{ env.STOCK_SOURCE_SHA }}
          path: |
            StockAIPro/dist/StockAIPro/**
            StockAIPro/desktop_native_contract_evidence.json
            StockAIPro/desktop_windows_build_evidence.json
            StockAIPro/desktop_exact_exe_evidence.json
            StockAIPro/desktop_frozen_core_evidence.json
            StockAIPro/desktop_frozen_advanced_evidence.json
          if-no-files-found: warn

      - name: Explicit Final boundary
        if: success()
        shell: pwsh
        run: |
          Write-Host "WINDOWS_NATIVE_BUILD=CANDIDATE_PASS"
          Write-Host "EXACT_EXE_SELF_TEST=CANDIDATE_PASS"
          Write-Host "PHYSICAL_GUI=NOT VERIFIED"
          Write-Host "REAL_RELEASE_UPDATE=BLOCKED"
          Write-Host "REPOSITORY_INDEPENDENCE=BLOCKED"
          Write-Host "FINAL_GATE=FAIL"
