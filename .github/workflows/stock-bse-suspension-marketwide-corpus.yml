name: Stock BSE market-wide suspension corpus

on:
  push:
    branches:
      - "diagnostic/stock-bse-suspension-marketwide-corpus-20261006"
    paths:
      - ".github/stock_diag/stock_bse_suspension_marketwide_corpus.py"
      - ".github/workflows/stock-bse-suspension-marketwide-corpus.yml"
  pull_request:
    paths:
      - ".github/stock_diag/stock_bse_suspension_marketwide_corpus.py"
      - ".github/workflows/stock-bse-suspension-marketwide-corpus.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout and unchanged Stock product bytes
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          authoritative="7f270b9ab58e11fd8129053a65e000c90ff9d8c1"
          test "$(git rev-parse HEAD)" = "$expected"
          git merge-base --is-ancestor "$authoritative" HEAD
          test -z "$(git diff --name-only "$authoritative"..HEAD -- StockAIPro)"
          echo "STOCK_PRODUCT_BYTES_CHANGED=FALSE"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false

      - name: Install pinned dependency
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2"

      - name: Build exhaustive BSE suspension keyword event corpus
        run: python .github/stock_diag/stock_bse_suspension_marketwide_corpus.py

      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-BSE-SUSPENSION-CORPUS-${{ github.event.pull_request.head.sha || github.sha }}
          path: stock_bse_suspension_marketwide_corpus.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve strict event-only boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          x=json.load(open("stock_bse_suspension_marketwide_corpus.json",encoding="utf-8"))
          a=x["adjudication"]
          assert a["bse_suspension_event_semantics_complete"] == "NOT VERIFIED"
          assert a["bse_effective_daily_suspension_state"] == "NOT VERIFIED"
          assert a["bse_historical_suspension_pit"] == "NOT VERIFIED"
          assert a["bse_historical_st_pit"] == "NOT VERIFIED"
          assert a["full_historical_st_pit"] == "NOT VERIFIED"
          assert a["advanced_business"] == "NOT VERIFIED"
          assert a["final_gate"] == "FAIL"
          print("BSE_SUSPENSION_QUERY_PAGINATION="+a["bse_suspension_query_pagination"])
          print("BSE_SUSPENSION_TITLE_EVENT_CORPUS="+a["bse_suspension_title_event_corpus"])
          print("BSE_HISTORICAL_SUSPENSION_PIT=NOT VERIFIED")
          print("FULL_HISTORICAL_ST_PIT=NOT VERIFIED")
          print("FINAL_GATE=FAIL")
          PY
