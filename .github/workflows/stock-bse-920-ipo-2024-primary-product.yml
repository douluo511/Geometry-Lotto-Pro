name: Stock BSE 920 IPO 2024 primary listing evidence - PRODUCT fail first
on:
  push:
    branches:
      - fix/stock-bse-920-new-ipo-2024-contradiction-20261008
    paths:
      - "StockAIPro/staging/Stock_AI_Pro/versions/4.3.0/stock_ai/historical_pit.py"
      - "StockAIPro/hardening_tests/historical_bse_market_date_boundary_test.py"
      - "StockAIPro/staging/Stock_AI_Pro/versions/4.3.0/PACKAGE_MANIFEST.json"
      - "StockAIPro/staging/Stock_AI_Pro/PACKAGE_MANIFEST.json"
      - ".github/workflows/stock-bse-920-ipo-2024-primary-product.yml"
  pull_request:
    paths:
      - "StockAIPro/staging/Stock_AI_Pro/versions/4.3.0/stock_ai/historical_pit.py"
      - "StockAIPro/hardening_tests/historical_bse_market_date_boundary_test.py"
      - "StockAIPro/staging/Stock_AI_Pro/versions/4.3.0/PACKAGE_MANIFEST.json"
      - "StockAIPro/staging/Stock_AI_Pro/PACKAGE_MANIFEST.json"
      - ".github/workflows/stock-bse-920-ipo-2024-primary-product.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ipo-2024-marketdate-source-failfirst:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout EXACT BSE product child branch and frozen recovery ancestor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Check true production branch ancestry and immutable original recovery
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor 462f4a5637fc0f3f247ce4cdb6c26eee4cbce871 HEAD
          test -z "$(git diff --name-only 462f4a5637fc0f3f247ce4cdb6c26eee4cbce871..HEAD -- StockAIPro/recovered_exact)"
          echo "UNCHANGED_IMMUTABLE_STOCK_RECOVERY=PASS"
      - name: Setup pinned Python 3.11.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - name: FAIL FIRST official 2024-05-30 920002 real IPO vs blanket 2025 boundary
        run: python StockAIPro/hardening_tests/historical_bse_market_date_boundary_test.py
      - name: Fetch TWO original official BSE HTML primary sources, never synthetic pass
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p firstparty_2024_920002
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/155.0.0.0" \
            "https://www.bse.cn/issue_report_meeting/200021986.html" \
            -o firstparty_2024_920002/official_20240530_920002_listing.html
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/155.0.0.0" \
            "https://www.bse.cn/important_news/200021617.html" \
            -o firstparty_2024_920002/official_20240419_920_rule.html
          python - <<'PY'
          import hashlib,re
          from html import unescape
          from pathlib import Path
          import fitz
          root=Path("firstparty_2024_920002")
          items=[
            ("official_20240530_920002_listing.html",
             ("万达轴承成功登陆北交所","2024年5月30日","920002")),
            ("official_20240419_920_rule.html",
             ("证券代码","2024年4月22日","920号段")),
          ]
          for fname,patterns in items:
            raw=(root/fname).read_bytes()
            if not 300<len(raw)<3_000_000:raise ValueError("missing_actual_firstparty_HTML")
            normalized=re.sub(r"\\s+","",unescape(raw.decode("utf-8-sig")))
            if not all(p in normalized for p in patterns):
              raise AssertionError("BSE_ORIGINAL_WEB_ARTICLE_DATE_CODE_NOT_VERIFIED:"+fname)
            d=hashlib.sha256(raw).hexdigest()
            (root/(fname+".sha256")).write_text(d+"  "+fname+"\\n")
            print("BSE_OFFICIAL_2024_NEW_920_IPO_HTML_PRIMARY=PASS",fname,d)
          PY
      - name: All legacy BSE and source-to-lifecycle byte-contract regressions
        run: python StockAIPro/hardening_tests/historical_st_pit_contract_test.py
      - name: Print candidate code and nested manifest actual SHA256 for REQUIRED rebinding
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("StockAIPro/staging/Stock_AI_Pro")
          code=root/"versions/4.3.0/stock_ai/historical_pit.py"
          inner=root/"versions/4.3.0/PACKAGE_MANIFEST.json"
          outer=root/"PACKAGE_MANIFEST.json"
          sha=lambda f:hashlib.sha256(f.read_bytes()).hexdigest()
          a,b=json.loads(inner.read_text()),json.loads(outer.read_text())
          actual=sha(code)
          assert a["files"]["stock_ai/historical_pit.py"]==actual,"STAGED_INNER_MANIFEST_STALE"
          assert b["files"]["versions/4.3.0/stock_ai/historical_pit.py"]==actual,"STAGED_OUTER_SOURCE_MANIFEST_STALE"
          assert b["files"]["versions/4.3.0/PACKAGE_MANIFEST.json"]==sha(inner),"STAGED_OUTER_NESTED_MANIFEST_STALE"
          print("STOCK_PRODUCTION_CODE_SHA256="+actual)
          print("STOCK_NESTED_VERSION_MANIFEST_SHA256="+sha(inner))
          print("STOCK_ROOT_STAGING_MANIFEST_SHA256="+sha(outer))
          print("STOCK_FULL_BUSINESS=NOT VERIFIED; NEW_WINDOWS_EXACT_EXE_GUI_HASH=NOT VERIFIED; FINAL_GATE=FAIL")
          PY
      - name: Preserve original source PDF SHA even if fail-first guard fails
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: STOCK-BSE-920002-2024-PRIMARY-FIRSTLIST-${{ github.event.pull_request.head.sha || github.sha }}
          path: firstparty_2024_920002/
          if-no-files-found: warn
          retention-days: 30
