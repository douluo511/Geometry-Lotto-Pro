name: Stock SSE open-ended suspension cross-check

on:
  push:
    branches:
      - "diagnostic/stock-sse-open-ended-suspension-crosscheck-20261006"
    paths:
      - ".github/stock_diag/stock_sse_open_ended_suspension_crosscheck.py"
      - ".github/workflows/stock-sse-open-ended-suspension-crosscheck.yml"
  pull_request:
    paths:
      - ".github/stock_diag/stock_sse_open_ended_suspension_crosscheck.py"
      - ".github/workflows/stock-sse-open-ended-suspension-crosscheck.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout and unchanged Stock product bytes
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          authoritative="43168d9e75c70ab55be808d8a51f0c0eb14d83d5"
          git merge-base --is-ancestor "$authoritative" HEAD
          unexpected=""
          while IFS= read -r path; do
            case "$path" in
              StockAIPro/hardening_tests/stock_sse_suspension_endpoint_discovery.py) ;;
              StockAIPro/hardening_tests/stock_sse_historical_suspension_query.py) ;;
              "") ;;
              *) unexpected="${unexpected}${path}"$'\n' ;;
            esac
          done < <(git diff --name-only "$authoritative..HEAD" -- StockAIPro)
          test -z "$unexpected" || { printf "%s" "$unexpected"; exit 1; }
          echo "STOCK_PRODUCT_BYTES_CHANGED=FALSE"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"

      - name: Install pinned diagnostic dependencies
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2" "akshare==1.17.85" "pandas>=2.2,<3"

      - name: Rebuild official SSE interval corpus
        run: python StockAIPro/hardening_tests/stock_sse_historical_suspension_query.py

      - name: Revalidate official endStopDate semantics
        run: python .github/stock_diag/sse_suspension_field_semantics.py

      - name: Replay all closed suspension intervals
        run: python .github/stock_diag/stock_sse_daily_suspension_replay.py

      - name: Cross-check every open-ended interval with independent market histories
        run: python .github/stock_diag/stock_sse_open_ended_suspension_crosscheck.py

      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-SSE-OPEN-ENDED-SUSPENSION-CROSSCHECK-${{ github.sha }}
          path: |
            stock_sse_historical_suspension_query.json
            stock_sse_suspension_field_semantics.json
            stock_sse_daily_suspension_replay.json
            stock_sse_open_ended_suspension_crosscheck.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve strict final boundary
        run: |
          python - <<'PY'
          import json
          x=json.load(open("stock_sse_open_ended_suspension_crosscheck.json",encoding="utf-8"))
          a=x["adjudication"]
          assert a["shanghai_historical_st_pit"] == "NOT VERIFIED"
          assert a["beijing_historical_st_pit"] == "NOT VERIFIED"
          assert a["full_historical_st_pit"] == "NOT VERIFIED"
          assert a["advanced_business"] == "NOT VERIFIED"
          assert a["final_gate"] == "FAIL"
          print("OPEN_ENDED_INTERVAL_RESOLUTION="+a["open_ended_interval_resolution"])
          print("HISTORICAL_DAILY_SUSPENSION_STATE="+a["historical_daily_suspension_state"])
          print("FULL_HISTORICAL_ST_PIT=NOT VERIFIED")
          print("FINAL_GATE=FAIL")
          PY
