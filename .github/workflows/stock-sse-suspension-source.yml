name: Stock SSE official suspension source discovery
on:
  pull_request:
    paths:
      - '.github/stock_diag/stock_sse_suspend_source.py'
      - '.github/workflows/stock-sse-suspension-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-source-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PRODUCT_BASE_SHA: 895fab5d4eb4be3d0b06e2c6c82c473911f4b8d1
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Verify exact head and unchanged product
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$PRODUCT_BASE_SHA" HEAD
          test -z "$(git diff --name-only "$PRODUCT_BASE_SHA"..HEAD -- StockAIPro)"
          echo 'PRODUCT_BYTES_UNCHANGED=PASS'
      - name: Source boundary adversarial controls
        run: python .github/stock_diag/stock_sse_suspend_source.py --self-test
      - name: Fetch actual official HTML and linked query scripts
        run: python .github/stock_diag/stock_sse_suspend_source.py --output "$RUNNER_TEMP/sse-source-discovery"
      - name: Capture bounded historical native rows with complete pagination
        run: python .github/stock_diag/stock_sse_suspend_source.py --capture-from "$RUNNER_TEMP/sse-source-discovery" --capture-output "$RUNNER_TEMP/sse-historical-capture"
      - name: Preserve exact official source receipts and raw bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-SSE-SOURCE-DISCOVERY-${{ env.SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/sse-source-discovery
            ${{ runner.temp }}/sse-historical-capture
          retention-days: 30
          if-no-files-found: error
