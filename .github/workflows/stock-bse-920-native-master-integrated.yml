name: Stock PIT source-native origin required - fail-first forged selfhash
on:
  push:
    branches: [fix/stock-920-and-native-master-integrated-20261008]
    paths:
      - "StockAIPro/staging/Stock_AI_Pro/versions/4.3.0/stock_ai/historical_pit.py"
      - "StockAIPro/hardening_tests/historical_st_pit_contract_test.py"
      - "StockAIPro/hardening_tests/historical_native_source_authority_failclosed_test.py"
      - ".github/workflows/stock-pit-native-authority-no-selfhash-falsepass.yml"
  pull_request:
    paths:
      - "StockAIPro/staging/Stock_AI_Pro/versions/4.3.0/stock_ai/historical_pit.py"
      - "StockAIPro/hardening_tests/historical_st_pit_contract_test.py"
      - "StockAIPro/hardening_tests/historical_native_source_authority_failclosed_test.py"
      - ".github/workflows/stock-pit-native-authority-no-selfhash-falsepass.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reject-self-signed-fake-universe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Exact SHA and parent candidate check
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor 02919bbdbc77ca1872fb905cd0705ad72abebb13 HEAD
      - name: Python pinned
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - name: Compile product and business adversarial gate
        run: python -m py_compile StockAIPro/staging/Stock_AI_Pro/versions/4.3.0/stock_ai/historical_pit.py StockAIPro/hardening_tests/historical_native_source_authority_failclosed_test.py
      - name: Prove forged full three-market source universe cannot earn product PASS
        run: python StockAIPro/hardening_tests/historical_native_source_authority_failclosed_test.py
      - name: Test 14/14 BSE date and code-shape contracts from parent #372
        run: python StockAIPro/hardening_tests/historical_bse_market_date_boundary_test.py
      - name: Assert staged product source plus nested and outer exact SHA after fix
        shell: bash
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          base=Path("StockAIPro/staging/Stock_AI_Pro")
          source=base/"versions/4.3.0/stock_ai/historical_pit.py"
          inner=base/"versions/4.3.0/PACKAGE_MANIFEST.json"
          outer=base/"PACKAGE_MANIFEST.json"
          H=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          print("EXACT_INTEGRATED_STOCK_PIT_SOURCE_SHA256="+H(source),flush=True)
          print("EXACT_INTEGRATED_STOCK_NESTED_SHA256="+H(inner),flush=True)
          j=json.loads(inner.read_text(encoding="utf-8"))
          k=json.loads(outer.read_text(encoding="utf-8"))
          if (j["files"]["stock_ai/historical_pit.py"]!=H(source)
              or k["files"]["versions/4.3.0/stock_ai/historical_pit.py"]!=H(source)
              or k["files"]["versions/4.3.0/PACKAGE_MANIFEST.json"]!=H(inner)):
              raise RuntimeError("candidate_product_or_nested_manifest_exact_sha_not_bound")
          print("EXACT_INTEGRATED_STOCK_PACKAGE_SHA_BINDINGS=PASS")
          PY
      - name: Record not a qualified historical market archive
        if: always()
        shell: bash
        run: |
          echo "BSE_SSE_SZSE_FIRST_PARTY_HISTORIC_DAILY_NATIVE_MASTERS=NOT VERIFIED"
          echo "ALL_DAILY_SOURCE_ST_AND_HALT=NOT VERIFIED"
          echo "HISTORICAL_ST_PIT_RELEASE=FAIL"
          echo "STOCK_FINAL_GATE=FAIL"
