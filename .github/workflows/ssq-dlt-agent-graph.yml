name: SSQ DLT Agent Graph research acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/**'
      - '.github/workflows/ssq-dlt-agent-graph.yml'
jobs:
  windows-components:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Install exact observed dependency archives
        run: python -m pip install --disable-pip-version-check --no-input --timeout 20 --retries 1 --use-deprecated=legacy-resolver --require-hashes -r research/ssq_dlt_agent_graph/requirements.lock
      - name: Check dependencies
        run: python -m pip check
      - name: Run research component acceptance
        run: python -m research.ssq_dlt_agent_graph.acceptance --output evidence/agent-graph
      - name: Upload raw receipts even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-graph-acceptance
          path: evidence/agent-graph
          if-no-files-found: error
