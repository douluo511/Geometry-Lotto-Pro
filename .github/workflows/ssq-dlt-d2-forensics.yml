name: SSQ DLT D2 forensics research
on:
  pull_request:
    paths:
      - 'research/ssq_dlt_d2_forensics/**'
      - 'research/ssq_dlt_d2_forensics_evidence/**'
      - 'research/ssq_dlt_d2_next/**'
      - 'research/ssq_dlt_v45/**'
      - '.github/workflows/ssq-dlt-d2-forensics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-current-byte-acceptance:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/ssq_dlt_agent_v1/requirements-windows.lock.txt
      - run: python -m pip install -r research/ssq_dlt_agent_v1/requirements.txt
      - run: python -m pip check
      - run: python -m research.ssq_dlt_d2_forensics_evidence.acceptance --output forensics-acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssq-dlt-d2-forensics-acceptance
          path: forensics-acceptance/
