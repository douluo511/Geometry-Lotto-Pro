name: SSQ Final Production Bootstrap

on:
  push:
    branches:
      - finalization/ssq-admin-bootstrap-20260930
  workflow_dispatch:
    inputs:
      visibility:
        description: Independent repository visibility
        required: true
        default: public
        type: choice
        options:
          - public
          - private

permissions:
  contents: read
  actions: read

jobs:
  bootstrap-final:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_REPO: douluo511/Geometry-Lotto-Pro-SSQ
      GH_TOKEN: ${{ secrets.SSQ_REPO_ADMIN_TOKEN }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'

      - name: Fail closed without repository-admin token
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw "SSQ_REPO_ADMIN_TOKEN is required and must be able to create/push douluo511/Geometry-Lotto-Pro-SSQ"
          }
          gh auth status
          if ($LASTEXITCODE -ne 0) { throw "GitHub admin token authentication failed" }

      - name: Export exact independent repository package
        id: export
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "ssq-export"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          python SSQ/tools/export_independent_repo.py --destination $dest --source-commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "independent repository export failed" }
          python SSQ/tools/export_independent_repo.py --destination $dest --verify-only
          if ($LASTEXITCODE -ne 0) { throw "independent repository export verification failed" }
          "path=$dest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create or seed independent repository with remote re-verification
        id: bootstrap
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "independent-repo-bootstrap-evidence.json"
          $args = @(
            "-ExportDir", "${{ steps.export.outputs.path }}",
            "-TargetRepo", $env:TARGET_REPO,
            "-Visibility", "${{ inputs.visibility }}",
            "-ExpectedSourceCommit", $env:GITHUB_SHA,
            "-EvidencePath", $evidence
          )
          & ./tools/bootstrap_independent_repo.ps1 @args
          if ($LASTEXITCODE -ne 0) { throw "independent repository bootstrap failed" }
          $r = Get-Content $evidence -Raw | ConvertFrom-Json
          if ($r.status -ne "PASS" -or $r.remote_verification -ne "PASS") {
            throw "independent repository remote verification did not PASS"
          }
          "remote_commit=$($r.remote_main_commit)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Copy-Item $evidence "$env:GITHUB_WORKSPACE/independent-repo-bootstrap-evidence.json"

      - name: Wait for baseline Windows acceptance run
        id: baseline_run
        shell: pwsh
        run: |
          $expected = "${{ steps.bootstrap.outputs.remote_commit }}"
          $found = $null
          for ($i=0; $i -lt 120; $i++) {
            $rows = gh run list --repo $env:TARGET_REPO --workflow "SSQ Windows exact-EXE acceptance" --branch main --limit 20 --json databaseId,headSha,status,conclusion,event | ConvertFrom-Json
            $candidate = @($rows | Where-Object { $_.headSha -eq $expected } | Select-Object -First 1)
            if ($candidate.Count -gt 0) {
              $found = $candidate[0]
              if ($found.status -eq "completed") { break }
            }
            Start-Sleep -Seconds 10
          }
          if ($null -eq $found -or $found.status -ne "completed") {
            throw "baseline Windows acceptance run did not complete"
          }
          "run_id=$($found.databaseId)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "BASELINE_RUN_ID=$($found.databaseId)"
          Write-Host "BASELINE_RUN_CONCLUSION=$($found.conclusion)"

      - name: Verify v8.5.0 baseline prerelease identity
        shell: pwsh
        run: |
          $release = gh release view v8.5.0 --repo $env:TARGET_REPO --json tagName,isPrerelease,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "v8.5.0 baseline prerelease missing" }
          if ($release.tagName -ne "v8.5.0" -or $release.isPrerelease -ne $true) {
            throw "v8.5.0 baseline must remain a non-Final prerelease"
          }
          $names = @($release.assets | ForEach-Object { $_.name })
          foreach ($required in @("Geometry_Lotto_Pro_SSQ_Windows_Verified.exe","ssq-8.5.0-manifest.json")) {
            if ($names -notcontains $required) { throw "baseline release missing asset: $required" }
          }

      - name: Clone independent repository and advance only release version
        id: candidate_commit
        shell: pwsh
        run: |
          gh auth setup-git
          $clone = Join-Path $env:RUNNER_TEMP "ssq-independent"
          if (Test-Path $clone) { Remove-Item -Recurse -Force $clone }
          git clone "https://github.com/$($env:TARGET_REPO).git" $clone
          if ($LASTEXITCODE -ne 0) { throw "independent repository clone failed" }
          $constants = Join-Path $clone "SSQ/SSQ/glp/constants.py"
          $source = [System.IO.File]::ReadAllText($constants)
          $old = 'APP_VERSION = "8.5.0"'
          $new = 'APP_VERSION = "8.5.1"'
          $matches = ([regex]::Matches($source, [regex]::Escape($old))).Count
          if ($matches -ne 1) { throw "expected exactly one frozen APP_VERSION 8.5.0 declaration" }
          [System.IO.File]::WriteAllText($constants, $source.Replace($old, $new), [System.Text.UTF8Encoding]::new($false))
          git -C $clone config user.name "SSQ Finalization Bot"
          git -C $clone config user.email "ssq-finalization@users.noreply.github.com"
          git -C $clone add SSQ/SSQ/glp/constants.py
          git -C $clone diff --cached --exit-code
          if ($LASTEXITCODE -eq 0) { throw "candidate version advance produced no diff" }
          git -C $clone commit -m "Release: advance independently validated SSQ candidate to 8.5.1"
          if ($LASTEXITCODE -ne 0) { throw "candidate release commit failed" }
          $sha = (git -C $clone rev-parse HEAD).Trim()
          git -C $clone push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "candidate release push failed" }
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "CANDIDATE_MAIN_SHA=$sha"

      - name: Wait for v8.5.1 full Final Gate
        id: final_run
        shell: pwsh
        run: |
          $expected = "${{ steps.candidate_commit.outputs.sha }}"
          $found = $null
          for ($i=0; $i -lt 180; $i++) {
            $rows = gh run list --repo $env:TARGET_REPO --workflow "SSQ Windows exact-EXE acceptance" --branch main --limit 20 --json databaseId,headSha,status,conclusion,event | ConvertFrom-Json
            $candidate = @($rows | Where-Object { $_.headSha -eq $expected } | Select-Object -First 1)
            if ($candidate.Count -gt 0) {
              $found = $candidate[0]
              if ($found.status -eq "completed") { break }
            }
            Start-Sleep -Seconds 10
          }
          if ($null -eq $found -or $found.status -ne "completed") {
            throw "candidate Windows Final Gate run did not complete"
          }
          if ($found.conclusion -ne "success") {
            throw "candidate Windows Final Gate run was not SUCCESS; run_id=$($found.databaseId), conclusion=$($found.conclusion)"
          }
          "run_id=$($found.databaseId)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "FINAL_RUN_ID=$($found.databaseId)"

      - name: Verify formal Release and Final artifact
        shell: pwsh
        run: |
          $release = gh release view v8.5.1 --repo $env:TARGET_REPO --json tagName,isDraft,isPrerelease,assets,url | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "v8.5.1 formal release missing" }
          if ($release.isDraft -or $release.isPrerelease) { throw "v8.5.1 was not promoted after Final Gate" }
          $releaseNames = @($release.assets | ForEach-Object { $_.name })
          foreach ($required in @("Geometry_Lotto_Pro_SSQ_Windows_Verified.exe","ssq-8.5.1-manifest.json")) {
            if ($releaseNames -notcontains $required) { throw "formal release missing asset: $required" }
          }

          $runId = "${{ steps.final_run.outputs.run_id }}"
          $artifacts = gh api "repos/$($env:TARGET_REPO)/actions/runs/$runId/artifacts" | ConvertFrom-Json
          $final = @($artifacts.artifacts | Where-Object { $_.name -eq "Geometry-Lotto-Pro-SSQ-FINAL-8.5.1-Windows-x64" })
          $audit = @($artifacts.artifacts | Where-Object { $_.name -like "Geometry-Lotto-Pro-SSQ-RELEASE-GATE-PASS-AUDIT-*" })
          if ($final.Count -ne 1 -or $audit.Count -ne 1) {
            throw "Final EXE or Final Gate audit artifact missing"
          }

          $summary = [ordered]@{
            schema = "ssq-final-production-bootstrap-v1"
            status = "PASS"
            repository = $env:TARGET_REPO
            baseline_version = "8.5.0"
            candidate_version = "8.5.1"
            final_run_id = [int64]$runId
            final_artifact_id = [int64]$final[0].id
            audit_artifact_id = [int64]$audit[0].id
            release_url = [string]$release.url
            completed_at_utc = [DateTime]::UtcNow.ToString("o")
          }
          $summary | ConvertTo-Json -Depth 6 | Set-Content "$env:GITHUB_WORKSPACE/SSQ_FINAL_PRODUCTION_BOOTSTRAP.json" -Encoding utf8
          Write-Host ($summary | ConvertTo-Json -Compress -Depth 6)

      - name: Upload bootstrap audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SSQ-FINAL-PRODUCTION-BOOTSTRAP-${{ github.sha }}
          path: |
            independent-repo-bootstrap-evidence.json
            SSQ_FINAL_PRODUCTION_BOOTSTRAP.json
          if-no-files-found: error
          retention-days: 30
