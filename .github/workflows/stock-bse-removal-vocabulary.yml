name: Stock BSE removal vocabulary diagnostic
on:
  push:
    branches:
      - diagnostic/stock-bse-removal-vocabulary-20261006
  workflow_dispatch:
permissions:
  contents: read
jobs:
  removal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact checkout and unchanged Stock product bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 7a854f9290b41dbd7c13115519985cefa19370ac HEAD
          test -z "$(git diff --name-only 7a854f9290b41dbd7c13115519985cefa19370ac..HEAD -- StockAIPro)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2"
      - name: Query removal vocabulary
        run: python .github/stock_diag/stock_bse_removal_vocabulary.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: STOCK-BSE-REMOVAL-VOCABULARY-${{ github.sha }}
          path: stock_bse_removal_vocabulary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve strict boundary
        if: always()
        run: |
          echo "BSE_REMOVAL_EVENT_HISTORY_COMPLETE=NOT VERIFIED"
          echo "BSE_EFFECTIVE_STATE_RECONSTRUCTION=NOT VERIFIED"
          echo "BSE_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"
