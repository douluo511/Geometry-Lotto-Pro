name: Stock BSE removal vocabulary diagnostic

on:
  push:
    branches:
      - diagnostic/stock-bse-removal-vocabulary-20261006
    paths:
      - ".github/stock_diag/stock_bse_removal_vocabulary.py"
      - ".github/workflows/stock-bse-removal-vocabulary.yml"
  pull_request:
    paths:
      - ".github/stock_diag/stock_bse_removal_vocabulary.py"
      - ".github/workflows/stock-bse-removal-vocabulary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  removal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout and current Stock product bytes
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          authoritative="7f270b9ab58e11fd8129053a65e000c90ff9d8c1"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git diff --name-only "$authoritative"..HEAD -- StockAIPro)"
          echo "STOCK_PRODUCT_TREE_BYTE_IDENTITY=PASS"
          echo "STOCK_PRODUCT_BYTES_CHANGED=FALSE"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false

      - name: Install pinned dependency
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2"

      - name: Query removal vocabulary
        id: removal
        continue-on-error: true
        run: python .github/stock_diag/stock_bse_removal_vocabulary.py

      - name: Upload removal-vocabulary evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-BSE-REMOVAL-VOCABULARY-${{ github.event.pull_request.head.sha || github.sha }}
          path: stock_bse_removal_vocabulary.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve strict boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f stock_bse_removal_vocabulary.json
          python - <<'PY'
          import json
          x=json.load(open("stock_bse_removal_vocabulary.json",encoding="utf-8"))
          a=x["adjudication"]
          assert a["bse_removal_event_history_complete"] == "NOT VERIFIED"
          assert a["bse_effective_state_reconstruction"] == "NOT VERIFIED"
          assert a["bse_historical_st_pit"] == "NOT VERIFIED"
          assert a["full_historical_st_pit"] == "NOT VERIFIED"
          assert a["advanced_business"] == "NOT VERIFIED"
          assert a["final_gate"] == "FAIL"
          print("REMOVAL_VOCABULARY_QUERY_TRANSPORT="+a["removal_vocabulary_query_transport"])
          print("REMOVAL_EVENT_CANDIDATES="+a["removal_event_candidates"])
          print("BSE_REMOVAL_EVENT_HISTORY_COMPLETE=NOT VERIFIED")
          print("BSE_HISTORICAL_ST_PIT=NOT VERIFIED")
          print("FINAL_GATE=FAIL")
          PY
          test "${{ steps.removal.outcome }}" = "success"
