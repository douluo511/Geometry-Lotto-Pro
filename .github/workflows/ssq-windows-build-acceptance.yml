name: SSQ Windows exact-EXE acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'ssq-final-*'
    paths:
      - 'SSQ/**'
      - '.github/workflows/ssq-windows-build-acceptance.yml'
      - '.github/scripts/ssq_physical_gui_click_smoke.ps1'
  pull_request:
    paths:
      - 'SSQ/**'
      - '.github/workflows/ssq-windows-build-acceptance.yml'
      - '.github/scripts/ssq_physical_gui_click_smoke.ps1'

defaults:
  run:
    working-directory: SSQ

jobs:
  build-and-accept:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup pinned Python x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: 'x64'

      - name: Install pinned build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Code completeness compile gate
        run: python -m compileall -q SSQ launcher.py tools

      - name: Architecture mother-template gate
        run: python tools/architecture_gate.py

      - name: Deterministic Unit Gate
        run: python tools/unit_gate.py

      - name: NetClient Contract Gate
        run: python tools/netclient_contract_gate.py

      - name: Business / Scientific Content Gate
        run: python tools/business_gate.py

      - name: Source contract self-test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence\SSQ | Out-Null
          $env:PYTHONPATH = "$PWD\SSQ"
          python launcher.py --check self --result-file evidence\SSQ\source-self.json
          $r = Get-Content evidence\SSQ\source-self.json -Raw | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $r.status -ne 'PASS') { throw "source contract self-test failed" }

      - name: Source fault injection
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\SSQ"
          foreach ($check in @("integrity-tamper","offline-failclosed","corrupt-repair")) {
            $path = "evidence\SSQ\source-$check.json"
            python launcher.py --check $check --result-file $path
            $r = Get-Content $path -Raw | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $r.status -ne 'PASS') { throw "fault injection failed: $check" }
          }

      - name: Temporary Shanghai official datacenter contract probe
        shell: pwsh
        run: |
          @'
          import re, requests
          url = "https://appsh.swlc.net.cn/shfcoc_datachart/datachart/ssq/jbzs/clg.html"
          r = requests.get(url, timeout=(20,30), headers={"User-Agent":"Mozilla/5.0 SSQ-Probe/1.0"})
          print("SH_PROBE_HTTP", r.status_code, r.headers.get("Content-Type"), "bytes", len(r.content))
          r.raise_for_status()
          text = r.text
          print("SH_PROBE_FORMS")
          for i, form in enumerate(re.findall(r"<form\\b[^>]*>.*?</form>", text, re.I|re.S)[:10]):
              print("FORM", i, re.sub(r"\\s+", " ", form)[:16000])
          print("SH_PROBE_INPUTS")
          for tag in re.findall(r"<(?:input|select|option|button)\\b[^>]*>", text, re.I):
              if re.search(r"(name|id|value|onclick)", tag, re.I):
                  print(re.sub(r"\\s+", " ", tag)[:2000])
          print("SH_PROBE_SCRIPTS")
          for src in re.findall(r"<script\\b[^>]*src=[\\\"']([^\\\"']+)", text, re.I):
              print(src)
          '@ | Set-Content tools\\_probe_shanghai.py -Encoding utf8
          python tools\\_probe_shanghai.py

      - name: Source live official-network quorum smoke
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\SSQ"
          python launcher.py --check update --result-file evidence\SSQ\source-live-update.json
          $r = Get-Content evidence\SSQ\source-live-update.json -Raw | ConvertFrom-Json
          if ($r.status -ne 'PASS') {
            Write-Host "SOURCE_LIVE_STATUS=$($r.status)"
            Write-Host "SOURCE_LIVE_ERROR=$($r.error)"
            Write-Host "SOURCE_LIVE_FAILURE_EVIDENCE=$($r.failed_network_evidence | ConvertTo-Json -Compress -Depth 6)"
            foreach ($bundle in $r.failed_network_evidence.bundles) {
              if ($bundle.manifest -notmatch '^failed/[0-9a-f]{24}\.json$') { throw 'unsafe failure manifest path' }
              $manifest = Get-Content (Join-Path 'evidence\SSQ' $bundle.manifest) -Raw | ConvertFrom-Json
              Write-Host "SOURCE_LIVE_SOURCE_ERRORS=$($manifest.source_errors | ConvertTo-Json -Compress -Depth 8)"
              Write-Host "SOURCE_LIVE_RECEIPTS=$($manifest.source_receipts | ConvertTo-Json -Compress -Depth 8)"
              $rawMeta = $manifest.raw_responses | Select-Object source,http_status,sha256,bytes,fetched_at
              Write-Host "SOURCE_LIVE_RAW_METADATA=$($rawMeta | ConvertTo-Json -Compress -Depth 8)"
            }
          }
          if ($LASTEXITCODE -ne 0 -or $r.status -ne 'PASS') { throw "source live official-network quorum failed" }
          if ($r.result.crosscheck_status -ne 'PASS') { throw "source crosscheck_status=$($r.result.crosscheck_status)" }
          Write-Host "SOURCE_LIVE_LATEST=$($r.result.latest_issue)"
          Write-Host "SOURCE_LIVE_VERIFICATION=$($r.result.verification)"

      - name: Native Windows build plus exact-EXE acceptance
        run: python tools/build_windows.py

      - name: Physical GUI Click Smoke
        shell: pwsh
        run: |
          ..\.github\scripts\ssq_physical_gui_click_smoke.ps1 -ExePath ".\dist\Geometry_Lotto_Pro_SSQ_Windows_Verified.exe" -EvidencePath ".\evidence\SSQ\physical_gui_click.json"

      - name: Final evidence-derived release and same-hash proof
        shell: pwsh
        run: |
          $reportPath = "evidence\SSQ\WINDOWS_EXACT_EXE_ACCEPTANCE.json"
          $exePath = "dist\Geometry_Lotto_Pro_SSQ_Windows_Verified.exe"
          if (-not (Test-Path $reportPath)) { throw "acceptance report missing" }
          if (-not (Test-Path $exePath)) { throw "exact EXE missing" }

          python tools/derive_gate_status.py --evidence-dir evidence\SSQ --exe $exePath --report evidence\SSQ\mother-gates.json
          if ($LASTEXITCODE -ne 0) { throw "gate derivation failed" }

          python tools/release_gate_22.py --gate-input evidence\SSQ\mother-gates.json --acceptance $reportPath --exe $exePath --report evidence\SSQ\FINAL_22_GATE.json
          $releaseExit = $LASTEXITCODE

          $final = Get-Content evidence\SSQ\FINAL_22_GATE.json -Raw | ConvertFrom-Json
          if ($releaseExit -ne 0 -or $final.final_gate -ne 'PASS' -or [int]$final.hard_fail_count -ne 0) {
            throw "Evidence-derived Final Gate failed"
          }
          Write-Host "SSQ_FINAL_EXE=$(Resolve-Path $exePath)"
          Write-Host "SSQ_FINAL_SHA256=$($final.exe_sha256)"
          Write-Host "FINAL_RELEASE_GATE=PASS"

      - name: Upload candidate diagnostic evidence when acceptance fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SSQ-CANDIDATE-FAIL-EVIDENCE-${{ github.sha }}
          path: SSQ/evidence/SSQ/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload final EXE only after all hard gates pass
        uses: actions/upload-artifact@v4
        with:
          name: Geometry-Lotto-Pro-SSQ-FINAL-v8.5.0-Windows-x64
          path: |
            SSQ/dist/Geometry_Lotto_Pro_SSQ_Windows_Verified.exe
            SSQ/evidence/SSQ/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

