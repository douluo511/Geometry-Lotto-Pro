name: SSQ Windows exact-EXE acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'ssq-final-*'
    paths:
      - 'SSQ/**'
      - '.github/workflows/ssq-windows-build-acceptance.yml'
  pull_request:
    paths:
      - 'SSQ/**'
      - '.github/workflows/ssq-windows-build-acceptance.yml'

defaults:
  run:
    working-directory: SSQ

jobs:
  build-and-accept:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup pinned Python x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: 'x64'

      - name: Install pinned build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Code completeness compile gate
        run: python -m compileall -q SSQ launcher.py tools

      - name: Architecture mother-template gate
        run: python tools/architecture_gate.py

      - name: Source contract self-test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence\SSQ | Out-Null
          $env:PYTHONPATH = "$PWD\SSQ"
          python launcher.py --check self --result-file evidence\SSQ\source-self.json
          $r = Get-Content evidence\SSQ\source-self.json -Raw | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $r.status -ne 'PASS') { throw "source contract self-test failed" }

      - name: Source fault injection
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\SSQ"
          foreach ($check in @("integrity-tamper","offline-failclosed","corrupt-repair")) {
            $path = "evidence\SSQ\source-$check.json"
            python launcher.py --check $check --result-file $path
            $r = Get-Content $path -Raw | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $r.status -ne 'PASS') { throw "fault injection failed: $check" }
          }

      - name: Source live official-network quorum smoke
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\SSQ"
          python launcher.py --check update --result-file evidence\SSQ\source-live-update.json
          $r = Get-Content evidence\SSQ\source-live-update.json -Raw | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $r.status -ne 'PASS') { throw "source live official-network quorum failed" }
          if ($r.result.crosscheck_status -ne 'PASS') { throw "source crosscheck_status=$($r.result.crosscheck_status)" }
          Write-Host "SOURCE_LIVE_LATEST=$($r.result.latest_issue)"
          Write-Host "SOURCE_LIVE_VERIFICATION=$($r.result.verification)"

      - name: Native Windows build plus exact-EXE acceptance
        run: python tools/build_windows.py

      - name: Physical GUI Click Smoke
        shell: pwsh
        run: |
          ..\.github\scripts\physical_gui_click_smoke.ps1 -ExePath ".\dist\Geometry_Lotto_Pro_SSQ_Windows_Verified.exe" -Points "0.25,0.22;0.73,0.22;0.25,0.30;0.73,0.30" -EvidencePath ".\evidence\SSQ\physical_gui_click.json"

      - name: Final 22-gate release and same-hash proof
        shell: pwsh
        run: |
          $reportPath = "evidence\SSQ\WINDOWS_EXACT_EXE_ACCEPTANCE.json"
          if (-not (Test-Path $reportPath)) { throw "acceptance report missing" }
          @'
          {"gates":{"purpose_model":"PASS","five_why":"PASS","risk_boundary":"PASS","domain_model":"PASS","architecture":"PASS","function_contract":"PASS","interface_contract":"PASS","data_source":"PASS","netclient":"PASS","storage":"PASS","engine":"PASS","evidence":"PASS","service":"PASS","ui":"PASS","self_test":"PASS","contract_test":"PASS","fault_injection":"PASS","real_network":"PASS","windows_build":"PASS","exact_exe":"PASS","gui_smoke":"PASS","same_hash":"PASS"}}
          '@ | Out-File evidence\SSQ\mother-gates.json -Encoding utf8
          python tools/release_gate_22.py --gate-input evidence\SSQ\mother-gates.json --acceptance $reportPath --exe dist\Geometry_Lotto_Pro_SSQ_Windows_Verified.exe --report evidence\SSQ\FINAL_22_GATE.json
          $final = Get-Content evidence\SSQ\FINAL_22_GATE.json -Raw | ConvertFrom-Json
          if ($final.final_gate -ne 'PASS' -or [int]$final.hard_fail_count -ne 0) { throw "22-gate Final Gate failed" }
          Write-Host "SSQ_FINAL_EXE=$(Resolve-Path 'dist\Geometry_Lotto_Pro_SSQ_Windows_Verified.exe')"
          Write-Host "SSQ_FINAL_SHA256=$($final.exe_sha256)"
          Write-Host "FINAL_RELEASE_GATE=PASS"

      - name: Upload final EXE only after all hard gates pass
        uses: actions/upload-artifact@v4
        with:
          name: Geometry-Lotto-Pro-SSQ-FINAL-v8.4.3-Windows-x64
          path: |
            SSQ/dist/Geometry_Lotto_Pro_SSQ_Windows_Verified.exe
            SSQ/evidence/SSQ/**
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

