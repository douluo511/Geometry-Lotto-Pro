name: V4.7 twenty-two real subset and non-subset models
on:
  pull_request:
    paths:
      - 'research/supercompute/v47_hedge.py'
      - 'research/supercompute/v47_joint_filter.py'
      - 'research/supercompute/v47_interval_search.py'
      - 'research/supercompute/tests/test_v47_interval_search.py'
      - 'research/supercompute/tests/test_v47_joint_filter.py'
      - 'research/supercompute/tests/test_v47_hedge.py'
      - '.github/workflows/v47-hedge-44.yml'
  push:
    branches: [main]
    paths:
      - 'research/supercompute/v47_hedge.py'
      - 'research/supercompute/tests/test_v47_hedge.py'
      - '.github/workflows/v47-hedge-44.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove-44:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile twenty-two executable hedge model classes
        run: python -m py_compile research/supercompute/v47_hedge.py
      - name: Prove twenty-two model registry, set algebra, mutation, scoring, no leakage
        run: |
          python -m unittest discover -s research/supercompute/tests -p 'test_v47_interval_search.py' -v
          python -m unittest discover -s research/supercompute/tests -p 'test_v47_joint_filter.py' -v
          python -m unittest discover -s research/supercompute/tests -p 'test_v47_hedge.py' -v
      - name: Reconstruct previously verified issue-continuous as-of input (not live verified)
        run: python -m research.supercompute.v47_merge_history --output-dir "$RUNNER_TEMP/v47-current"
      - name: Execute twenty-two fit/predict/score contracts for BOTH lottery types and freeze 44 tickets
        run: |
          python -m research.supercompute.v47_hedge generate \
            --ssq-data "$RUNNER_TEMP/v47-current/ssq-merged-history.json" \
            --dlt-data "$RUNNER_TEMP/v47-current/dlt-merged-history.json" \
            --ssq-target 2026131 --dlt-target 26130 \
            --seed 20261114 --generations 2 --validation 4 --holdout 3 \
            --mc-trials 80 --physics-steps 6 \
            --output "$RUNNER_TEMP/v47-hedge-44.json" \
            --freeze-dir "$RUNNER_TEMP/v47-hedge-frozen"
      - name: Machine check that 22 plus and minus pairs exist for each game
        run: |
          python - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          raw=(root/'v47-hedge-44.json').read_bytes()
          a=json.loads(raw)
          assert a['ticket_count']==44 and set(a['games'])=={'ssq','dlt'}
          for g,v in a['games'].items():
              assert v['schema']=='SSQDLT_V47_HEDGE22_GAME_V2'
              assert v['model_count']==22 and v['ticket_count']==22
              assert len(v['tickets'])==len(v['models'])==22
              assert len(v['historical_validation']['models'])==22
              assert [t['model_id'] for t in v['tickets']]==[f'M{i:02d}{sign}' for i in range(1,12) for sign in ('+','-')]
              for t in v['tickets']:
                  if t['direction']=='disjoint':
                      assert len(t['excluded_pair'])==2
                      assert not set(t['excluded_pair']) & set(t['front'])
              frozen=root/'v47-hedge-frozen'/f"{g}-{v['target_issue']}-hedge22.json"
              doc=json.loads(frozen.read_bytes())
              assert doc['schema']=='SSQDLT_V47_HEDGE22_FROZEN_V2'
              joint=v['joint_search']
              assert joint['schema']=='SSQDLT_V47_JOINT_HARD_CONSTRAINT_V1'
              assert joint['model_count_used']==22
              assert len(joint['tickets'])==8
              require=set(joint['constraints']['required'])
              exclude=set(joint['constraints']['excluded'])
              assert require.isdisjoint(exclude)
              assert all(require.issubset(t['front']) and exclude.isdisjoint(t['front']) for t in joint['tickets'])
              assert v['historical_validation']['joint']['folds']
              interval=v['interval_search']
              assert interval['schema']=='SSQDLT_V47_FOUR_AREA_INTERVAL_SEARCH_V1'
              assert interval['model_records_used']==22 and interval['ticket_count']==8
              assert set(interval['areas'])=={'front','back'}
              assert set(interval['profile'])=={'front_include','front_exclude','back_include','back_exclude'}
              assert interval['retained_full_ticket_combinations']>0
              assert interval['retained_full_ticket_combinations']<=interval['original_full_ticket_combinations']
              for t in interval['tickets']:
                  for area in ('front','back'):
                      assert set(interval['areas'][area]['required']).issubset(t[area])
                      assert not (set(interval['areas'][area]['excluded']) & set(t[area]))
              assert interval['calibration']['validation_independent_of_selection']
              assert interval['calibration']['edge']=='NO_EDGE'
              assert doc['source']['model_count']==22
              print('V47_HEDGE_FREEZE_SHA256',g,hashlib.sha256(frozen.read_bytes()).hexdigest())
          print('V47_HEDGE_44_ACCEPTANCE_PASS',hashlib.sha256(raw).hexdigest())
          PY
      - name: Validate independently advancing SSQ and DLT 22-model issue contracts
        run: |
          for game in ssq dlt; do
            python -m research.supercompute.v47_hedge generate \
              --game "$game" \
              --"$game"-data "$RUNNER_TEMP/v47-current/$game-merged-history.json" \
              --"$game"-target "$(test "$game" = ssq && echo 2026131 || echo 26130)" \
              --previous "$RUNNER_TEMP/v47-hedge-44.json" \
              --seed 20261115 --generations 2 --validation 4 --holdout 3 \
              --mc-trials 35 --physics-steps 3 \
              --output "$RUNNER_TEMP/v47-single-$game.json" \
              --freeze-dir "$RUNNER_TEMP/v47-single-frozen-$game"
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP'])
          for game in ('ssq','dlt'):
              item=json.loads((temp/f'v47-single-{game}.json').read_bytes())
              assert item['schema']=='SSQDLT_V47_HEDGE22_RUN_V2'
              assert item['ticket_count']==22 and list(item['games'])==[game]
              record=item['games'][game]
              assert len(record['models'])==22
              assert record['joint_search']['ticket_count']==8
              assert record['interval_search']['ticket_count']==8
              assert record['models']['M05+']['fit']['inherited']
              assert all(record['models'][f'M{i:02d}-']['fit']['cell_evolution']['previous_inherited']
                         for i in range(1,12))
          print('V47_ASYNC_DRAW_DATES_TWO_INDEPENDENT_22_MODEL_RUNS_PASS')
          PY
      - name: Execute second generation using actual frozen champions from first 44-row run
        run: |
          python -m research.supercompute.v47_hedge generate \
            --ssq-data "$RUNNER_TEMP/v47-current/ssq-merged-history.json" \
            --dlt-data "$RUNNER_TEMP/v47-current/dlt-merged-history.json" \
            --ssq-target 2026131 --dlt-target 26130 \
            --previous "$RUNNER_TEMP/v47-hedge-44.json" \
            --seed 20261115 --generations 2 --validation 4 --holdout 3 \
            --mc-trials 40 --physics-steps 4 \
            --output "$RUNNER_TEMP/v47-hedge-44-inherited.json" \
            --freeze-dir "$RUNNER_TEMP/v47-hedge-inherited-frozen"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          a=json.loads((root/'v47-hedge-44.json').read_bytes())
          b=json.loads((root/'v47-hedge-44-inherited.json').read_bytes())
          for game in ('ssq','dlt'):
              before=a['games'][game]
              after=b['games'][game]
              assert after['models']['M05+']['fit']['inherited']
              for i in range(1,12):
                  negative=after['models'][f'M{i:02d}-']['fit']['cell_evolution']
                  assert negative['previous_inherited'] and negative['parent_in_generation_one']
                  name=after['models'][f'M{i:02d}-']['base_name']
                  old=before['evolution']['negative_champions'][name]
                  assert any(x['origin']=='inherited' and x['genes']==old
                             for x in negative['lineage'][0]['evaluated'])
              assert after['ticket_count']==22
          assert b['ticket_count']==44
          print('V47_HEDGE_ALL_11_NEGATIVE_CHAMPIONS_INHERITED_BOTH_GAMES_PASS')
          PY
      - name: Upload 44 model calculation, lineages, validation and immutable freezes
        uses: actions/upload-artifact@v4
        with:
          name: v47-subset-hedge-44-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/v47-hedge-44.json
            ${{ runner.temp }}/v47-single-ssq.json
            ${{ runner.temp }}/v47-single-dlt.json
            ${{ runner.temp }}/v47-hedge-44-inherited.json
            ${{ runner.temp }}/v47-hedge-inherited-frozen/
            ${{ runner.temp }}/v47-hedge-frozen/
            ${{ runner.temp }}/v47-current/merge-receipt.json
          if-no-files-found: error
          retention-days: 90
