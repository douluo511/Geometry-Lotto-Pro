name: Stock SSE primary transition semantics sample

on:
  push:
    branches:
      - diagnostic/stock-sse-primary-transition-semantics-sample-20261006
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout and unchanged Stock product bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 635059939ad59e48959d46500427f89dab265081 HEAD
          test -z "$(git diff --name-only 635059939ad59e48959d46500427f89dab265081..HEAD -- StockAIPro)"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false

      - name: Install pinned dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2" "pypdf==5.4.0"

      - name: Sample primary SSE transition documents
        shell: bash
        run: python .github/stock_diag/stock_sse_primary_transition_semantics_sample.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-SSE-PRIMARY-TRANSITION-SEMANTICS-SAMPLE-${{ github.sha }}
          path: stock_sse_primary_transition_semantics_sample.json
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve strict boundary
        if: always()
        shell: bash
        run: |
          echo "PRIMARY_DOCUMENT_SEMANTICS_COMPLETE=NOT VERIFIED"
          echo "EFFECTIVE_STATE_RECONSTRUCTION=NOT VERIFIED"
          echo "SHANGHAI_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "FULL_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "ADVANCED_BUSINESS=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"
