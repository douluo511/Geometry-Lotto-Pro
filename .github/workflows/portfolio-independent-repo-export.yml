name: Portfolio Independent Repository Export Verification

on:
  pull_request:
    paths:
      - "tools/export_independent_project_repo.py"
      - "tests/test_independent_project_repo_export.py"
      - ".github/workflows/portfolio-independent-repo-export.yml"
      - ".github/workflows/dlt-windows-build-acceptance.yml"
      - ".github/workflows/english-root-intelligence-windows.yml"
      - ".github/workflows/guoxue-zhice-windows.yml"
      - ".github/workflows/head-intelligence-windows.yml"
      - ".github/workflows/investment-finance-pro-build.yml"
      - ".github/workflows/psychology-insight-pro-windows.yml"
      - ".github/scripts/**"
      - "DLT/**"
      - "english-root-intelligence/**"
      - "guoxue-zhice/**"
      - "head_intelligence/**"
      - "investment_finance_pro/**"
      - "psychology_insight_pro/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Exact checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "source_sha=$ACTUAL_SHA"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Exporter adversarial regression
        run: python tests/test_independent_project_repo_export.py

  export-and-verify:
    needs: regression
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - dlt
          - english-root
          - guoxue-zhice
          - head-intelligence
          - investment-finance
          - psychology-insight
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Exact checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "source_sha=$ACTUAL_SHA"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Deterministic project-only export
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPORT_DIR: ${{ runner.temp }}/independent-${{ matrix.project }}
        run: |
          set -euo pipefail
          python tools/export_independent_project_repo.py             --project "$PROJECT"             --destination "$EXPORT_DIR"             --source-commit "$SOURCE_SHA"             | tee "$RUNNER_TEMP/EXPORT-${PROJECT}.json"

      - name: Independent verification pass
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
          EXPORT_DIR: ${{ runner.temp }}/independent-${{ matrix.project }}
        run: |
          set -euo pipefail
          python tools/export_independent_project_repo.py             --destination "$EXPORT_DIR"             --verify-only             | tee "$RUNNER_TEMP/VERIFY-${PROJECT}.json"
          grep -q '"status": "PASS"' "$RUNNER_TEMP/VERIFY-${PROJECT}.json"

      - name: Upload reproducible independent-repository export
        uses: actions/upload-artifact@v4
        with:
          name: INDEPENDENT-REPO-EXPORT-${{ matrix.project }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/independent-${{ matrix.project }}
            ${{ runner.temp }}/EXPORT-${{ matrix.project }}.json
            ${{ runner.temp }}/VERIFY-${{ matrix.project }}.json
          if-no-files-found: error
          retention-days: 30
