name: Stock SSE daily-state contract discovery

on:
  push:
    branches:
      - "diagnostic/stock-sse-daily-state-contract-discovery-20261005"
    paths:
      - "StockAIPro/hardening_tests/stock_sse_daily_state_contract_discovery.py"
      - ".github/workflows/stock-sse-daily-state-contract-discovery.yml"
  pull_request:
    paths:
      - "StockAIPro/hardening_tests/stock_sse_daily_state_contract_discovery.py"
      - ".github/workflows/stock-sse-daily-state-contract-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact checkout and unchanged Stock product bytes
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          echo "EXACT_DIAGNOSTIC_HEAD=$actual"
          base="43168d9e75c70ab55be808d8a51f0c0eb14d83d5"
          git merge-base --is-ancestor "$base" HEAD
          changed="$(git diff --name-only "$base..HEAD" -- StockAIPro             | grep -v '^StockAIPro/hardening_tests/stock_sse_suspension_endpoint_discovery.py$'             | grep -v '^StockAIPro/hardening_tests/stock_sse_historical_suspension_query.py$'             | grep -v '^StockAIPro/hardening_tests/stock_sse_daily_state_contract_discovery.py$' || true)"
          test -z "$changed" || { echo "$changed"; exit 1; }
          echo "STOCK_PRODUCT_BYTES_CHANGED=FALSE"
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2"
      - name: Discover first-party SSE daily-state contract
        working-directory: StockAIPro
        run: python hardening_tests/stock_sse_daily_state_contract_discovery.py
      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-SSE-DAILY-STATE-CONTRACT-${{ github.sha }}
          path: StockAIPro/stock_sse_daily_state_contract_discovery.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve non-promotion
        working-directory: StockAIPro
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("stock_sse_daily_state_contract_discovery.json").read_text(encoding="utf-8"))
          a=x["adjudication"]
          assert a["official_sse_suspension_query_contract"] == "PASS"
          assert a["historical_daily_suspension_state"] == "NOT VERIFIED"
          assert a["shanghai_historical_st_pit"] == "NOT VERIFIED"
          assert a["full_historical_st_pit"] == "NOT VERIFIED"
          assert a["advanced_business"] == "NOT VERIFIED"
          assert a["final_gate"] == "FAIL"
          print("GUESSED_TRADEDAY_SQL_CONTRACT="+a["guessed_tradeday_sql_contract"])
          print("HISTORICAL_DAILY_SUSPENSION_STATE=NOT VERIFIED")
          print("FINAL_GATE=FAIL")
          PY
