name: Stock SZSE primary DOM read-only forensic

on:
  push:
    branches:
      - diagnostic/stock-szse-real-dom-20261008
    paths:
      - ".github/stock_diag/inspect_szse_primary_markup.py"
      - ".github/workflows/stock-szse-primary-dom-forensic.yml"
  pull_request:
    paths:
      - ".github/stock_diag/inspect_szse_primary_markup.py"
      - ".github/workflows/stock-szse-primary-dom-forensic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dom-forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify unchanged Stock candidate and diagnostic-only delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor 9969490c89ccb4cc10536f66416976c5bf40caef HEAD
          test -z "$(git diff --name-only 9969490c89ccb4cc10536f66416976c5bf40caef..HEAD -- StockAIPro)"
          echo "STOCK_PRODUCT_BYTES_CHANGED=FALSE"
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2" "beautifulsoup4==4.15.0"
      - name: Inspect official primary DOM without promoting business qualification
        run: python .github/stock_diag/inspect_szse_primary_markup.py
      - name: Preserve primary response and forensic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-SZSE-PRIMARY-DOM-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            stock_szse_dom_probe.json
            stock_szse_dom_probe_primary.html
          if-no-files-found: warn
          retention-days: 30
      - name: Assert PIT and Final remain unqualified
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f stock_szse_dom_probe.json
          python - <<'PY'
          import json
          x=json.load(open("stock_szse_dom_probe.json",encoding="utf-8"))
          assert x["primary_body_qualified"] == "NOT VERIFIED"
          assert x["historical_st_pit"] == "NOT VERIFIED"
          assert x["final_gate"] == "FAIL"
          assert x["diagnostic_only"] is True
          print("DOM_FORENSIC_ONLY=PASS; HISTORICAL_PIT=NOT VERIFIED; FINAL=FAIL")
          PY
