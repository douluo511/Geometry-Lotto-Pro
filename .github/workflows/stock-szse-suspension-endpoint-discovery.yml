name: Stock SZSE suspension endpoint discovery

on:
  push:
    branches:
      - diagnostic/stock-szse-suspension-endpoint-discovery-20261006
    paths:
      - ".github/stock_diag/stock_szse_suspension_endpoint_discovery.py"
      - ".github/workflows/stock-szse-suspension-endpoint-discovery.yml"
  pull_request:
    paths:
      - ".github/stock_diag/stock_szse_suspension_endpoint_discovery.py"
      - ".github/workflows/stock-szse-suspension-endpoint-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout and unchanged Stock product bytes
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          authoritative="7f270b9ab58e11fd8129053a65e000c90ff9d8c1"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git diff --name-only "$authoritative"..HEAD -- StockAIPro)"
          echo "STOCK_PRODUCT_TREE_BYTE_IDENTITY=PASS"
          echo "STOCK_PRODUCT_BYTES_CHANGED=FALSE"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2" "beautifulsoup4==4.15.0"

      - name: Discover official SZSE suspension query contract
        id: discover
        continue-on-error: true
        run: python .github/stock_diag/stock_szse_suspension_endpoint_discovery.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-SZSE-SUSPENSION-ENDPOINT-DISCOVERY-${{ github.event.pull_request.head.sha || github.sha }}
          path: stock_szse_suspension_endpoint_discovery.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve strict boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f stock_szse_suspension_endpoint_discovery.json
          python - <<'PY'
          import json
          x=json.load(open("stock_szse_suspension_endpoint_discovery.json",encoding="utf-8"))
          a=x["adjudication"]
          assert a["shenzhen_historical_suspension_state"] == "NOT VERIFIED"
          assert a["shenzhen_historical_st_pit"] == "NOT VERIFIED"
          assert a["full_historical_st_pit"] == "NOT VERIFIED"
          assert a["advanced_business"] == "NOT VERIFIED"
          assert a["final_gate"] == "FAIL"
          print("OFFICIAL_SZSE_SUSPENSION_SURFACE="+a["official_szse_suspension_surface"])
          print("MACHINE_QUERY_CONTRACT="+a["machine_query_contract"])
          print("SHENZHEN_HISTORICAL_SUSPENSION_STATE=NOT VERIFIED")
          print("FULL_HISTORICAL_ST_PIT=NOT VERIFIED")
          print("FINAL_GATE=FAIL")
          PY
