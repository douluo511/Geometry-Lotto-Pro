name: Stock BSE current 248 aliases - historical as-of NO LOOKAHEAD
on:
  push:
    branches:
      - fix/stock-bse-248-asof-alias-no-lookahead-20261008
    paths:
      - ".github/stock_diag/stock_bse_asof_alias_replay_guard.py"
      - ".github/stock_diag/test_stock_bse_asof_alias_replay_guard.py"
      - ".github/workflows/stock-bse-248-asof-no-lookahead.yml"
  pull_request:
    paths:
      - ".github/stock_diag/stock_bse_asof_alias_replay_guard.py"
      - ".github/stock_diag/test_stock_bse_asof_alias_replay_guard.py"
      - ".github/workflows/stock-bse-248-asof-no-lookahead.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  official-current-alias-asof-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Checkout exact PR current code and first-party source parser
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Exact head, unchanged Stock product and parent parser
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor 91c2dbe0dcb705158c3c8313d93534cef7024870 HEAD
          git merge-base --is-ancestor 9969490c89ccb4cc10536f66416976c5bf40caef HEAD
          test -z "$(git diff --name-only 9969490c89ccb4cc10536f66416976c5bf40caef..HEAD -- StockAIPro)"
          echo "UNCHANGED_STOCK_PRODUCT=PASS"
      - name: Pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - name: Pinned first-party source HTML dependencies
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2" "beautifulsoup4==4.15.0"
      - name: Current alias primary parser counterexamples
        run: python .github/stock_diag/test_stock_bse_code_alias_source.py
      - name: As-of historical NO-LOOKAHEAD anti-forgery counterexamples
        run: python .github/stock_diag/test_stock_bse_asof_alias_replay_guard.py
      - name: Download previously successful BSE official current-mapping raw HTML
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/11534539821/zip" \
            --output bse_code_mapping_original_official.zip
          echo "b3cd87028a7cdb812ca1403fc54bde429a0fc65fe426446cebfe404c95333e43  bse_code_mapping_original_official.zip" | sha256sum --check
          unzip -oq bse_code_mapping_original_official.zip
          test -f stock_bse_current_code_alias_evidence.json
          test -f stock_bse_current_code_alias_raw.html
          echo "PINNED_ACTUAL_BSE_SOURCE_RAW_SHA=PASS"
      - name: Reparse first-party raw BSE HTML and reject historical aliases from future/current data
        run: |
          python .github/stock_diag/stock_bse_asof_alias_replay_guard.py \
            --input stock_bse_current_code_alias_evidence.json \
            --raw stock_bse_current_code_alias_raw.html \
            --source-code .github/stock_diag/stock_bse_code_alias_source.py \
            --output stock_bse_current_alias_asof_failclosed_248.json
      - name: Verify all 248 symbols across historical date slices and production code-class boundary
        run: |
          python - <<'PY'
          import importlib.util,json
          from pathlib import Path
          x=json.load(open("stock_bse_current_alias_asof_failclosed_248.json",encoding="utf-8"))
          assert x["first_party_current_alias_rows"]==248
          assert x["old_selected_tier_listing_before_BSE_open"]==68
          assert len(x["source_checked_issuer_alias_slices"])==1488
          assert x["historical_status_counts"]=={"NOT VERIFIED":992,"NOT_A_BSE_MARKET_DAY":496}
          assert all(row["qualified_historical_PIT"]=="NOT VERIFIED" and
                     row["historical_symbol_code_effective_day"]=="NOT VERIFIED" for row in x["source_checked_issuer_alias_slices"])
          assert x["adjudication"]["BSE_historical_effective_920_code_alias"]=="NOT VERIFIED"
          assert x["adjudication"]["final_gate"]=="FAIL"
          file=Path("StockAIPro/staging/Stock_AI_Pro/versions/4.3.0/stock_ai/historical_pit.py")
          spec=importlib.util.spec_from_file_location("production_code_scope_not_historical_identity",file)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          assert m._market_for_code("920001")=="BSE"
          assert m.MARKET_LIFECYCLE_START["BSE"].isoformat()=="2021-11-15"
          print("ACTUAL_BSE_CODE_PREFIX_NOT_HISTORICAL_IDENTITY=PASS")
          print("SOURCE_NATIVE_248_ASOF_LOOKAHEAD_BARRIER=PASS; HISTORICAL_BSE_PIT=NOT VERIFIED; FINAL_GATE=FAIL")
          PY
      - name: Upload current first-party byte-bound source-to-history invalidity ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-BSE-248-ASOF-ALIAS-FAILCLOSED-${{ github.event.pull_request.head.sha || github.sha }}
          path: stock_bse_current_alias_asof_failclosed_248.json
          if-no-files-found: warn
          retention-days: 30
