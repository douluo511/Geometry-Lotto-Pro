name: SSQ Live Official Next-Issue Research Candidate (READ ONLY)

on:
  push:
    branches:
      - fix/ssq-prospective-replay-provenance-failclosed-20261008
    paths:
      - "SSQ/tools/generate_ssq_predraw_candidate.py"
      - "SSQ/tests/test_generate_ssq_predraw_candidate.py"
      - ".github/workflows/ssq-next-issue-candidate-readonly.yml"

permissions:
  contents: read

jobs:
  real-source-prospective-research-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Exact uncredentialed checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Pinned Python 3.11.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"

      - name: Install pinned offline-cache-independent HTTP closure
        run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: \
            requests==2.34.2 certifi==2026.7.22 charset-normalizer==3.5.2 \
            idna==3.20 urllib3==2.8.0

      - name: Negative regression contract (mock, not live evidence)
        run: python -m unittest SSQ.tests.test_generate_ssq_predraw_candidate -v

      - name: Exact source safety check
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "fix/ssq-prospective-replay-provenance-failclosed-20261008"

      - name: Fetch actual current official SSQ quorum and construct future-only candidate
        shell: bash
        run: |
          set -euo pipefail
          python SSQ/tools/generate_ssq_predraw_candidate.py \
            --source-commit "$GITHUB_SHA" \
            --output-dir SSQ/evidence/prospective-candidate
          echo "SSQ_RESEARCH_STATUS=CANDIDATE_ONLY"
          echo "SSQ_QUALIFIED_REPLAYS=0"
          echo "SSQ_PRODUCTION_RHO=0"

      - name: Upload candidate JSON (not a validated pre-draw GitHub Freeze)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SSQ-LIVE-RESEARCH-CANDIDATE-${{ github.sha }}
          path: SSQ/evidence/prospective-candidate/*.json
          if-no-files-found: error
          retention-days: 30
