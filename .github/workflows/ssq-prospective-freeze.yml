name: SSQ Pre-Draw GitHub Freeze Candidate (READ ONLY)

on:
  push:
    branches:
      - "evidence/ssq-prospective-freezes"
    paths:
      - "SSQ/prospective_ledger/freezes/*.json"

permissions:
  contents: read

concurrency:
  group: ssq-prospective-freeze-receipts
  cancel-in-progress: false

jobs:
  check-one-frozen-prediction:
    name: GitHub server time + exact pre-draw Git SHA (not promotion)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact server-observed head without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Setup pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"

      - name: Install exact requests dependency closure only
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: \
            requests==2.34.2 certifi==2026.7.22 charset-normalizer==3.5.2 \
            idna==3.20 urllib3==2.8.0

      - name: Unit-test frozen GitHub receipt anti-forgery
        env:
          PYTHONPATH: SSQ/SSQ
        run: python -m unittest SSQ.tests.test_prospective_github_receipt -v

      - name: Validate real GitHub server run and one immutable pre-draw Freeze
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python SSQ/tools/ssq_prospective_push_gate.py

      - name: Prohibit pretend source authority or promotion
        shell: bash
        run: |
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF_NAME}" = "evidence/ssq-prospective-freezes"
          echo "SSQ_FREEZE_STATUS=CANDIDATE_ONLY"
          echo "SSQ_QUALIFIED_REPLAYS=0"
          echo "SSQ_PROMOTION_AUTHORIZED=false"
