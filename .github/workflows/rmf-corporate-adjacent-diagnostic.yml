name: RMF corporate-action adjacent diagnostic

on:
  pull_request:
    paths:
      - 'RealMoneyFinance/tests/corporate_action_diagnostic.py'
      - '.github/workflows/rmf-corporate-adjacent-diagnostic.yml'
      - 'RealMoneyFinance/app/source_corporate_actions.py'
      - 'RealMoneyFinance/app/source_tencent_full.py'
      - 'RealMoneyFinance/app/netclient.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corporate-action-diagnostic:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: RealMoneyFinance
    steps:
      - name: Checkout diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
          architecture: 'x64'

      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Diagnostic syntax gate
        run: python -m py_compile tests/corporate_action_diagnostic.py

      - name: Collect exact real-network adjacent-shift evidence
        run: python tests/corporate_action_diagnostic.py

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RMF-Corporate-Adjacent-Diagnostic-${{ github.sha }}
          path: |
            RealMoneyFinance/evidence/corporate_action_adjacent_diagnostic.json
            RealMoneyFinance/evidence/corporate_action_diagnostic_network.jsonl
          if-no-files-found: warn
          retention-days: 30
