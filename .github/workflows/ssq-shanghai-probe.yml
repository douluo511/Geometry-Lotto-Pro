name: SSQ Shanghai official datacenter probe

on:
  push:
    branches:
      - feature/ssq-netclient-fail-closed
    paths:
      - '.github/workflows/ssq-shanghai-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Locate Shanghai HW_LOAD_DATA endpoint contract
        shell: python
        run: |
          import re, urllib.request
          base="https://appsh.swlc.net.cn"
          paths=[
            "/shfcoc_datachart/js/v2.0/commtools/procommon.js?v=20260929",
            "/shfcoc_datachart/js/v2.0/util.js?v=20260929",
            "/shfcoc_datachart/js/v2.0/datachart/zst_common.js?v=20260929",
            "/shfcoc_datachart/js/v2.0/datachart/zdy.js?v=20260929",
            "/shfcoc_datachart/js/v2.0/datachart/ssq/jbzs/clg.js?v=20260929",
          ]
          for path in paths:
              url=base+path
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 SSQ-Probe/1.0","Referer":base+"/shfcoc_datachart/datachart/ssq/jbzs/clg.html"})
              with urllib.request.urlopen(req,timeout=12) as r:
                  raw=r.read()
                  print("JS_HTTP",path,r.status,r.headers.get("Content-Type"),len(raw))
              text=raw.decode("utf-8","replace")
              print("MATCH_BEGIN",path)
              for m in re.finditer(r"HW_LOAD_DATA|query_lottery_zst_data|zst_query_data_conf|[A-Za-z0-9_./-]+\\.(?:php|json|do|action)|\\$\\.ajax|url\\s*[:=]",text,re.I):
                  a=max(0,m.start()-1200); b=min(len(text),m.end()+3000)
                  print(text[a:b])
                  print("---")
              print("MATCH_END",path)
