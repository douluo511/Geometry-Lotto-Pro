name: SSQ Shanghai official datacenter probe

on:
  push:
    branches:
      - feature/ssq-netclient-fail-closed
    paths:
      - '.github/workflows/ssq-shanghai-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Locate Shanghai endpoint configuration fast
        shell: python
        run: |
          import urllib.request
          base="https://appsh.swlc.net.cn"
          ref=base+"/shfcoc_datachart/datachart/ssq/jbzs/clg.html"
          paths=[
            "/shfcoc_datachart/js/v2.0/datachart/iframe.js?v=20260929",
            "/shfcoc_datachart/js/v2.0/commtools/procommon.js?v=20260929",
            "/shfcoc_datachart/js/v2.0/util.js?v=20260929",
            "/shfcoc_datachart/js/v2.0/datachart/datachart_index_common.js?v=20260929",
            "/shfcoc_datachart/js/v2.0/datacenter/datechartcommon.js?v=20260929",
          ]
          keys=("xg_glable_conf","lottery_zst_data","webGlobalService","dowebdata","dowebxmldata")
          for path in paths:
              url=base+path
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 SSQ-Probe/1.0","Referer":ref})
                  with urllib.request.urlopen(req,timeout=8) as r:
                      text=r.read().decode("utf-8","replace")
                      print("HTTP",path,r.status,len(text))
              except Exception as exc:
                  print("ERROR",path,type(exc).__name__,str(exc)); continue
              for key in keys:
                  pos=0
                  while True:
                      i=text.find(key,pos)
                      if i<0: break
                      print("MATCH",path,key)
                      print(text[max(0,i-800):min(len(text),i+1800)])
                      pos=i+len(key)
