name: SSQ Shanghai official datacenter probe

on:
  push:
    branches:
      - feature/ssq-netclient-fail-closed
    paths:
      - '.github/workflows/ssq-shanghai-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Locate Shanghai endpoint configuration
        shell: python
        run: |
          import re, urllib.request, urllib.parse
          base="https://appsh.swlc.net.cn"
          page=base+"/shfcoc_datachart/datachart/ssq/jbzs/clg.html"
          headers={"User-Agent":"Mozilla/5.0 SSQ-Probe/1.0","Referer":page}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=15) as r:
                  raw=r.read()
                  print("HTTP",url,r.status,r.headers.get("Content-Type"),len(raw))
              return raw.decode("utf-8","replace")
          html=get(page)
          scripts=re.findall(r"""<script\b[^>]*src=["']([^"']+)""",html,re.I)
          targets=[page]
          targets += [urllib.parse.urljoin(page,src) for src in scripts]
          seen=set()
          for url in targets:
              if url in seen: continue
              seen.add(url)
              try:
                  text=get(url) if url!=page else html
              except Exception as exc:
                  print("FETCH_ERROR",url,type(exc).__name__,str(exc)); continue
              for key in ("xg_glable_conf","lottery_zst_data","webGlobalService","dowebdata","dowebxmldata"):
                  pos=0
                  while True:
                      i=text.find(key,pos)
                      if i<0: break
                      print("MATCH",key,url)
                      print(text[max(0,i-1800):min(len(text),i+4200)])
                      print("MATCH_END")
                      pos=i+len(key)
