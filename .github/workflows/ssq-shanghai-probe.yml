name: SSQ Shanghai official datacenter probe

on:
  push:
    branches:
      - feature/ssq-netclient-fail-closed
    paths:
      - '.github/workflows/ssq-shanghai-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Shanghai HTTPS modern history page contract
        shell: python
        run: |
          import re, urllib.request, urllib.parse
          url="https://www.swlc.net.cn/lottery/ssq.html?limit=100&view=previous"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 SSQ-Probe/1.0"})
          with urllib.request.urlopen(req,timeout=20) as r:
              raw=r.read()
              print("PAGE_HTTP",r.status,r.geturl(),r.headers.get("Content-Type"),len(raw))
          text=raw.decode("utf-8","replace")
          for key in ("自定义","按期号","issue","limit","previous","query","api","ajax","fetch","axios","start","end"):
              pos=0
              while True:
                  i=text.lower().find(key.lower(),pos)
                  if i<0: break
                  print("MATCH",key)
                  print(text[max(0,i-1000):min(len(text),i+2600)])
                  pos=i+len(key)
          print("SCRIPTS")
          for src in re.findall(r"""<script\b[^>]*src=["']([^"']+)""",text,re.I):
              print(urllib.parse.urljoin(url,src))
