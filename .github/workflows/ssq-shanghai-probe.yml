name: SSQ Shanghai official datacenter probe

on:
  push:
    branches:
      - feature/ssq-netclient-fail-closed
    paths:
      - '.github/workflows/ssq-shanghai-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Shanghai official SSQ page internals
        shell: python
        run: |
          import urllib.request
          url="https://appsh.swlc.net.cn/shfcoc_datachart/datachart/ssq/jbzs/clg.html"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 SSQ-Probe/1.0"})
          with urllib.request.urlopen(req,timeout=12) as r:
              raw=r.read()
              print("APP_SH_HTTP",r.status,r.headers.get("Content-Type"),"bytes",len(raw))
          text=raw.decode("utf-8","replace")
          print("HTML_BEGIN")
          print(text)
          print("HTML_END")
