name: SSQ Shanghai official datacenter probe

on:
  push:
    branches:
      - feature/ssq-netclient-fail-closed
    paths:
      - '.github/workflows/ssq-shanghai-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test Shanghai HTTPS issue-range POST
        shell: python
        run: |
          import json, urllib.request, urllib.parse, hashlib
          url="https://appsh.swlc.net.cn/shfcoc_ldatacenter/aword/execQueryAllAnalysis.ctl"
          referer="https://appsh.swlc.net.cn/shfcoc_datachart/datachart/ssq/jbzs/clg.html"
          headers={
              "User-Agent":"Mozilla/5.0 SSQ-Probe/1.0",
              "Referer":referer,
              "Content-Type":"application/x-www-form-urlencoded; charset=UTF-8",
              "X-Requested-With":"XMLHttpRequest",
          }
          tests=[
              ("recent",{"lottcode":"01","num":"29","ttype":"2","beginnum":"2026109","ebdinnum":"2026113"}),
              ("baseline",{"lottcode":"01","num":"29","ttype":"2","beginnum":"2013001","ebdinnum":"2026113"}),
          ]
          for name,data in tests:
              body=urllib.parse.urlencode(data).encode()
              req=urllib.request.Request(url,data=body,headers=headers,method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      raw=r.read()
                      print("POST",name,"HTTP",r.status,"FINAL",r.geturl(),"CTYPE",r.headers.get("Content-Type"),
                            "BYTES",len(raw),"SHA256",hashlib.sha256(raw).hexdigest())
                  obj=json.loads(raw.decode("utf-8"))
                  result=obj.get("result") if isinstance(obj,dict) else None
                  print("JSON",name,"TYPE",type(obj).__name__,"KEYS",sorted(obj.keys()) if isinstance(obj,dict) else None,
                        "RESULT_COUNT",len(result) if isinstance(result,list) else None)
                  if isinstance(result,list) and result:
                      print("FIRST",json.dumps(result[0],ensure_ascii=False,sort_keys=True))
                      print("LAST",json.dumps(result[-1],ensure_ascii=False,sort_keys=True))
              except Exception as exc:
                  print("POST_ERROR",name,type(exc).__name__,str(exc))
                  raise
