name: SSQ Shanghai official datacenter probe

on:
  push:
    branches:
      - feature/ssq-netclient-fail-closed
    paths:
      - '.github/workflows/ssq-shanghai-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Shanghai official SSQ full-history capabilities
        shell: python
        run: |
          import re, urllib.request
          headers={"User-Agent":"Mozilla/5.0 SSQ-Probe/1.0","Referer":"https://www.swlc.net.cn/"}
          for limit in (100, 500, 3000, 5000):
              url=f"https://www.swlc.net.cn/lottery/ssq.html?limit={limit}&view=previous"
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read()
                      ctype=r.headers.get("Content-Type")
                      status=r.status
                  text=raw.decode("utf-8","replace")
                  rows=re.findall(r"20\\d{5}\\s+20\\d{2}-\\d{2}-\\d{2}",re.sub(r"(?is)<[^>]+>"," ",text))
                  issues=re.findall(r"20\\d{5}",re.sub(r"(?is)<[^>]+>"," ",text))
                  print("SH_HISTORY",limit,status,ctype,len(raw),"rows",len(rows),"issues",len(issues),
                        "first",issues[0] if issues else None,"last",issues[-1] if issues else None)
              except Exception as exc:
                  print("SH_HISTORY_ERROR",limit,type(exc).__name__,str(exc))

          url="https://appsh.swlc.net.cn/shfcoc_datachart/datachart/ssq/jbzs/clg.html"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 SSQ-Probe/1.0"})
          try:
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read()
                  print("APP_SH_HTTP",r.status,r.headers.get("Content-Type"),"bytes",len(raw))
              text=raw.decode("utf-8","replace")
              print("APP_SH_FORM_COUNT",len(re.findall(r"<form\\b[^>]*>.*?</form>",text,flags=re.I|re.S)))
              print("APP_SH_SCRIPTS")
              for src in re.findall(r"""<script\\b[^>]*src=["']([^"']+)""",text,flags=re.I):
                  print(src)
          except Exception as exc:
              print("APP_SH_ERROR",type(exc).__name__,str(exc))
