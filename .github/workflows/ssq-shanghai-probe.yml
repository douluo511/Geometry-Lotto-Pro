name: SSQ Shanghai official datacenter probe

on:
  push:
    branches:
      - feature/ssq-netclient-fail-closed
    paths:
      - '.github/workflows/ssq-shanghai-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test Shanghai HTTPS chunked issue-range GET
        shell: python
        run: |
          import re, urllib.request, urllib.parse, hashlib
          base="https://www.swlc.net.cn/lottery/ssq.html"
          tests=[
            ("2013a","2013001","2013099"),
            ("2013b","2013100","2013999"),
            ("2026a","2026001","2026099"),
            ("2026b","2026100","2026999"),
          ]
          for name,start,end in tests:
              params={"view":"previous","limit":"100","start_issue":start,"end_issue":end}
              url=base+"?"+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 SSQ-Probe/1.0"})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      raw=r.read()
                      print("GET",name,"HTTP",r.status,"FINAL",r.geturl(),"CTYPE",r.headers.get("Content-Type"),
                            "BYTES",len(raw),"SHA256",hashlib.sha256(raw).hexdigest())
                  text=raw.decode("utf-8","replace")
                  tbody=re.search(r"<tbody>(.*?)</tbody>",text,re.I|re.S)
                  body=tbody.group(1) if tbody else ""
                  rows=re.findall(r"<tr>(.*?)</tr>",body,re.I|re.S)
                  issues=[]
                  for row in rows:
                      cells=re.findall(r"<td[^>]*>(.*?)</td>",row,re.I|re.S)
                      if cells:
                          clean=re.sub(r"<[^>]+>","",cells[0]).strip()
                          if re.fullmatch(r"20\d{5}",clean): issues.append(clean)
                  print("ROWS",name,len(rows),"ISSUES",len(issues),
                        "FIRST",issues[0] if issues else None,"LAST",issues[-1] if issues else None)
              except Exception as exc:
                  print("GET_ERROR",name,type(exc).__name__,str(exc))
