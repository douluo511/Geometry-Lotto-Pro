name: Investment Finance Pro - Full Release Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - "investment_finance_pro/**"
      - ".github/workflows/investment-finance-pro-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-release-gate:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install builder
        run: python -m pip install --upgrade pip pyinstaller

      - name: Source Self-Test
        shell: pwsh
        run: |
          python investment_finance_pro/app.py --self-test --report source_self_test.json
          $code = $LASTEXITCODE
          Get-Content source_self_test.json
          if ($code -ne 0) { exit $code }

      - name: Contract Test
        shell: pwsh
        run: |
          python investment_finance_pro/verification.py --contract-test --report contract_test.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fault Injection
        shell: pwsh
        run: |
          python investment_finance_pro/verification.py --fault-injection --report fault_injection.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Source Real Network
        shell: pwsh
        run: |
          python investment_finance_pro/app.py --network-smoke --report source_network_smoke.json
          $code = $LASTEXITCODE
          if (Test-Path source_network_smoke.json) { Get-Content source_network_smoke.json }
          if ($code -ne 0) { exit $code }

      - name: Windows Build
        shell: pwsh
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name InvestmentFinancePro
          investment_finance_pro/app.py

      - name: Exact EXE Self-Test
        shell: pwsh
        run: |
          & .\dist\InvestmentFinancePro.exe --self-test --report exe_self_test.json
          $code = $LASTEXITCODE
          if (Test-Path exe_self_test.json) { Get-Content exe_self_test.json }
          if ($code -ne 0) { exit $code }

      - name: Exact EXE Real Network
        shell: pwsh
        run: |
          & .\dist\InvestmentFinancePro.exe --network-smoke --report exe_network_smoke.json
          $code = $LASTEXITCODE
          if (Test-Path exe_network_smoke.json) { Get-Content exe_network_smoke.json }
          if ($code -ne 0) { exit $code }

      - name: GUI Smoke
        shell: pwsh
        run: |
          $status = "FAIL"
          $detail = ""
          try {
            $p = Start-Process -FilePath ".\dist\InvestmentFinancePro.exe" -PassThru
            Start-Sleep -Seconds 5
            if ($p.HasExited) {
              $detail = "GUI process exited during smoke interval with code $($p.ExitCode)"
            } else {
              $status = "PASS"
              $detail = "Exact EXE remained alive for 5-second GUI smoke interval"
              Stop-Process -Id $p.Id -Force
            }
          } catch {
            $detail = $_.Exception.Message
          }
          @{ type="gui_smoke"; status=$status; detail=$detail } | ConvertTo-Json | Out-File -Encoding utf8 gui_smoke.json
          Get-Content gui_smoke.json
          if ($status -ne "PASS") { exit 1 }

      - name: Bind Unique Final EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force final | Out-Null
          Copy-Item .\dist\InvestmentFinancePro.exe .\final\InvestmentFinancePro.exe

      - name: Same Hash + Final Gate
        shell: pwsh
        run: |
          python investment_finance_pro/release_gate.py --tested-exe dist/InvestmentFinancePro.exe --final-exe final/InvestmentFinancePro.exe --report final_gate.json --evidence source_self_test.json contract_test.json fault_injection.json source_network_smoke.json exe_self_test.json exe_network_smoke.json gui_smoke.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record Exact EXE SHA256
        shell: pwsh
        run: |
          $h = (Get-FileHash .\final\InvestmentFinancePro.exe -Algorithm SHA256).Hash
          "sha256=$h" | Out-File -Encoding utf8 exact_exe_sha256.txt
          Get-Content exact_exe_sha256.txt
          Get-Content final_gate.json

      - name: Upload Unique Final Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Investment-Finance-Pro-FINAL
          path: |
            final/InvestmentFinancePro.exe
            exact_exe_sha256.txt
            source_self_test.json
            contract_test.json
            fault_injection.json
            source_network_smoke.json
            exe_self_test.json
            exe_network_smoke.json
            gui_smoke.json
            final_gate.json
            investment_finance_pro/ENGINEERING_FREEZE.md
          if-no-files-found: error
          retention-days: 14
