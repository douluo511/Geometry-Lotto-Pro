name: Stock SSE suspension corpus replay

on:
  push:
    branches:
      - "diagnostic/stock-sse-suspension-corpus-replay-20261005"
    paths:
      - "StockAIPro/hardening_tests/stock_sse_suspension_corpus_replay.py"
      - ".github/workflows/stock-sse-suspension-corpus-replay.yml"
  pull_request:
    paths:
      - "StockAIPro/hardening_tests/stock_sse_suspension_corpus_replay.py"
      - ".github/workflows/stock-sse-suspension-corpus-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact diagnostic checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected" || { echo "checkout identity mismatch: actual=$actual expected=$expected"; exit 1; }
          echo "EXACT_DIAGNOSTIC_HEAD=$actual"
      - name: Verify authoritative Stock product bytes unchanged
        shell: bash
        run: |
          set -euo pipefail
          base="43168d9e75c70ab55be808d8a51f0c0eb14d83d5"
          git merge-base --is-ancestor "$base" HEAD
          changed="$(git diff --name-only "$base..HEAD" -- StockAIPro             | grep -v '^StockAIPro/hardening_tests/stock_sse_suspension_endpoint_discovery.py$'             | grep -v '^StockAIPro/hardening_tests/stock_sse_historical_suspension_query.py$'             | grep -v '^StockAIPro/hardening_tests/stock_sse_suspension_corpus_replay.py$' || true)"
          test -z "$changed" || { echo "$changed"; exit 1; }
          echo "STOCK_PRODUCT_BYTES_CHANGED=FALSE"
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
      - name: Install diagnostic dependency
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2"
      - name: Replay official SSE historical suspension corpus
        working-directory: StockAIPro
        run: python hardening_tests/stock_sse_suspension_corpus_replay.py
      - name: Upload exact-head evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-SSE-SUSPENSION-CORPUS-REPLAY-${{ github.sha }}
          path: StockAIPro/stock_sse_suspension_corpus_replay.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve strict boundary
        run: |
          echo "OFFICIAL_SSE_HISTORICAL_SUSPENSION_EVENT_CORPUS=PASS"
          echo "HISTORICAL_DAILY_SUSPENSION_STATE=NOT VERIFIED"
          echo "SHANGHAI_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "FULL_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "ADVANCED_BUSINESS=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"
