name: Stock BSE removal primary semantics
on:
  push:
    branches:
      - diagnostic/stock-bse-removal-primary-semantics-20261006
  workflow_dispatch:
permissions:
  contents: read
jobs:
  primary-semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact checkout and unchanged Stock product bytes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 76d33c8e91d6fff0ead35a053a099908fb34c0ef HEAD
          test -z "$(git diff --name-only 76d33c8e91d6fff0ead35a053a099908fb34c0ef..HEAD -- StockAIPro)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
      - run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2" "pypdf==5.4.0"
      - name: Filter BSE removal candidates by primary PDF semantics
        run: python .github/stock_diag/stock_bse_removal_primary_semantics.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: STOCK-BSE-REMOVAL-PRIMARY-SEMANTICS-${{ github.sha }}
          path: |
            stock_bse_removal_primary_semantics.json
            stock_bse_removal_action_vocabulary.json
            stock_bse_risk_warning_marketwide_corpus.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve strict boundary
        if: always()
        run: |
          echo "UNIQUE_REMOVAL_EFFECTIVE_DATE_MAPPING=NOT VERIFIED"
          echo "BSE_REMOVAL_EVENT_HISTORY_COMPLETE=NOT VERIFIED"
          echo "BSE_EFFECTIVE_STATE_RECONSTRUCTION=NOT VERIFIED"
          echo "BSE_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "FULL_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"
