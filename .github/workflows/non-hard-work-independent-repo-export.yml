name: Non-Hard-Work Independent Repository Export Verification
on:
  pull_request:
    paths:
      - '.github/scripts/export_non_hard_work_independent_repo.py'
      - '.github/workflows/non-hard-work-independent-repo-export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Export and verify
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPORT_DIR: ${{ runner.temp }}/nhw-independent
        run: |
          set -euo pipefail
          python .github/scripts/export_non_hard_work_independent_repo.py --destination "$EXPORT_DIR" --source-commit "$SOURCE_SHA" | tee "$RUNNER_TEMP/NHW_EXPORT.json"
          python .github/scripts/export_non_hard_work_independent_repo.py --destination "$EXPORT_DIR" --verify-only | tee "$RUNNER_TEMP/NHW_VERIFY.json"
          grep -q '"status": "PASS"' "$RUNNER_TEMP/NHW_VERIFY.json"
      - name: Mutation must fail closed
        env:
          EXPORT_DIR: ${{ runner.temp }}/nhw-independent
        run: |
          set -euo pipefail
          cp -a "$EXPORT_DIR" "$RUNNER_TEMP/nhw-tampered"
          printf '\n# tampered\n' >> "$RUNNER_TEMP/nhw-tampered/NonHardWorkOS/README.md"
          set +e
          python .github/scripts/export_non_hard_work_independent_repo.py --destination "$RUNNER_TEMP/nhw-tampered" --verify-only > "$RUNNER_TEMP/NHW_TAMPER.json"
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q '"status": "FAIL"' "$RUNNER_TEMP/NHW_TAMPER.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NHW-INDEPENDENT-REPO-EXPORT-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/nhw-independent
            ${{ runner.temp }}/NHW_EXPORT.json
            ${{ runner.temp }}/NHW_VERIFY.json
            ${{ runner.temp }}/NHW_TAMPER.json
          retention-days: 30
      - run: |
          echo "PROJECT_ONLY_EXPORT=PASS"
          echo "REPOSITORY_INDEPENDENCE=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"
