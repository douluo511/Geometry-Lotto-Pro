name: SSQ Current-Main Independent Repository Export

on:
  push:
    branches:
      - 'migration/ssq-independent-current-main-*'
    paths:
      - 'SSQ/**'
      - '.github/workflows/ssq-current-main-independent-export.yml'
      - '.github/workflows/ssq-windows-build-acceptance.yml'
      - '.github/scripts/ssq_physical_gui_click_smoke.ps1'
  pull_request:
    paths:
      - 'SSQ/**'
      - '.github/workflows/ssq-current-main-independent-export.yml'
      - '.github/workflows/ssq-windows-build-acceptance.yml'
      - '.github/scripts/ssq_physical_gui_click_smoke.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "SOURCE_SHA=$ACTUAL_SHA"

      - name: Setup pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'

      - name: Exporter adversarial regression
        run: python SSQ/tests/test_independent_repo_export.py

      - name: Deterministic SSQ-only export
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPORT_DIR: ${{ runner.temp }}/ssq-independent-repo
        run: |
          set -euo pipefail
          rm -rf "$EXPORT_DIR"
          python SSQ/tools/export_independent_repo.py             --destination "$EXPORT_DIR"             --source-commit "$SOURCE_SHA"             | tee "$RUNNER_TEMP/SSQ_INDEPENDENT_REPO_EXPORT_PROOF.json"

      - name: Independent verification pass
        shell: bash
        env:
          EXPORT_DIR: ${{ runner.temp }}/ssq-independent-repo
        run: |
          set -euo pipefail
          python SSQ/tools/export_independent_repo.py             --destination "$EXPORT_DIR"             --verify-only             | tee "$RUNNER_TEMP/SSQ_INDEPENDENT_REPO_VERIFY_PROOF.json"
          grep -q '"status": "PASS"' "$RUNNER_TEMP/SSQ_INDEPENDENT_REPO_VERIFY_PROOF.json"

      - name: Prove no other portfolio product leaked
        shell: bash
        env:
          EXPORT_DIR: ${{ runner.temp }}/ssq-independent-repo
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["EXPORT_DIR"])
          manifest=json.loads((root/"MIGRATION_MANIFEST.json").read_text(encoding="utf-8"))
          tops={row["path"].split("/",1)[0] for row in manifest["files"]}
          forbidden={
              "DLT","Happy8","Human-Nature-Pro","TalkCraft-Pro",
              "english-root-intelligence","guoxue-zhice","head_intelligence",
              "investment_finance_pro","psychology_insight_pro",
              "EarthOnlineLifeBase","LegalPhilosophy","PassiveIncomePipelineOS",
              "RealMoneyFinance",
          }
          leaked=sorted(tops & forbidden)
          if leaked:
              raise SystemExit("cross-product leakage: "+",".join(leaked))
          print("SSQ_ONLY_EXPORT=PASS")
          print("FILE_COUNT="+str(len(manifest["files"])))
          print("SOURCE_COMMIT="+str(manifest["source_commit"]))
          PY

      - name: Upload reproducible independent-repository seed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SSQ-CURRENT-MAIN-INDEPENDENT-REPO-EXPORT-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ssq-independent-repo
            ${{ runner.temp }}/SSQ_INDEPENDENT_REPO_EXPORT_PROOF.json
            ${{ runner.temp }}/SSQ_INDEPENDENT_REPO_VERIFY_PROOF.json
          if-no-files-found: error
          retention-days: 30
