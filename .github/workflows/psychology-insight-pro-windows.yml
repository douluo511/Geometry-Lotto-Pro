name: Psychology Insight Pro - Full Release Gate

on:
  push:
    branches: [main]
    paths:
      - 'psychology_insight_pro/**'
      - '.github/workflows/psychology-insight-pro-windows.yml'
  pull_request:
    paths:
      - 'psychology_insight_pro/**'
      - '.github/workflows/psychology-insight-pro-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-release-gate:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Python x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests

      - name: Compile gate
        run: |
          python -m compileall -q psychology_insight_pro
          if ($LASTEXITCODE -ne 0) { throw "Compile gate failed" }

      - name: Architecture gate
        run: |
          python psychology_insight_pro/architecture_gate.py
          if ($LASTEXITCODE -ne 0) { throw "Architecture gate failed" }

      - name: Business Content Gate
        run: |
          python psychology_insight_pro/business_gate.py
          if ($LASTEXITCODE -ne 0) { throw "Business Content Gate failed" }

      - name: Unit Gate
        run: |
          python psychology_insight_pro/validation_gate.py --mode unit
          if ($LASTEXITCODE -ne 0) { throw "Unit Gate failed" }

      - name: Contract Gate
        run: |
          python psychology_insight_pro/validation_gate.py --mode contract
          if ($LASTEXITCODE -ne 0) { throw "Contract Gate failed" }

      - name: Fault Injection Gate
        run: |
          python psychology_insight_pro/validation_gate.py --mode fault
          if ($LASTEXITCODE -ne 0) { throw "Fault Injection Gate failed" }

      - name: Integration Gate
        run: |
          python psychology_insight_pro/validation_gate.py --mode integration
          if ($LASTEXITCODE -ne 0) { throw "Integration Gate failed" }

      - name: Full regression
        run: |
          python -m unittest discover -s psychology_insight_pro/tests -v
          if ($LASTEXITCODE -ne 0) { throw "Full regression failed" }

      - name: Business Counterexample Reversal Gate
        run: |
          python psychology_insight_pro/business_validation_gate.py
          if ($LASTEXITCODE -ne 0) { throw "Business validation failed" }

      - name: Real Network through production update path
        run: |
          python psychology_insight_pro/real_network_check.py
          if ($LASTEXITCODE -ne 0) { throw "Real Network failed" }

      - name: Native Windows Build
        run: |
          pyinstaller --noconfirm --clean --noupx --onefile --windowed --name Psychology_Insight_Pro --add-data "psychology_insight_pro/knowledge.json;." psychology_insight_pro/app.py
          if (-not (Test-Path ".\dist\Psychology_Insight_Pro.exe")) { throw "EXE missing" }

      - name: Exact Candidate Gate
        run: |
          python psychology_insight_pro/exact_candidate_gate.py --exe ".\dist\Psychology_Insight_Pro.exe" --output ".\psychology_insight_pro\exact_candidate_gate.json"
          if ($LASTEXITCODE -ne 0) { throw "Exact Candidate Gate failed" }

      - name: Physical GUI Click Smoke
        run: |
          .\.github\scripts\physical_gui_click_smoke.ps1 -ExePath ".\dist\Psychology_Insight_Pro.exe" -Points "0.45,0.43;0.90,0.43;0.45,0.79;0.90,0.79" -EvidencePath ".\psychology_insight_pro\physical_gui_click.json"
          if ($LASTEXITCODE -ne 0) { throw "Physical GUI Click failed" }
          python psychology_insight_pro/bind_physical_gui.py --exe ".\dist\Psychology_Insight_Pro.exe" --evidence ".\psychology_insight_pro\physical_gui_click.json"
          if ($LASTEXITCODE -ne 0) { throw "Physical GUI evidence binding failed" }

      - name: Freeze final bytes
        run: |
          New-Item -ItemType Directory -Force ".\dist\final" | Out-Null
          Copy-Item ".\dist\Psychology_Insight_Pro.exe" ".\dist\final\Psychology_Insight_Pro.exe" -Force

      - name: Evidence-derived Final Gate and Same Hash
        run: |
          python psychology_insight_pro/collect_final_gates.py --exe ".\dist\Psychology_Insight_Pro.exe" --final-exe ".\dist\final\Psychology_Insight_Pro.exe" --physical-gui ".\psychology_insight_pro\physical_gui_click.json" --output ".\dist\mother_gates.json"
          $collectorExit = $LASTEXITCODE

          python psychology_insight_pro/release_gate.py --input ".\dist\mother_gates.json" --output ".\dist\final_gate.json"
          $releaseExit = $LASTEXITCODE

          $mother = Get-Content ".\dist\mother_gates.json" -Raw | ConvertFrom-Json
          $final = Get-Content ".\dist\final_gate.json" -Raw | ConvertFrom-Json
          if ($collectorExit -ne 0 -or $releaseExit -ne 0 -or $mother.status -ne "PASS" -or $final.final_gate -ne "PASS" -or [int]$final.hard_fail_count -ne 0) {
            throw "Evidence-derived Final Gate failed"
          }
          Write-Host "PSYCHOLOGY_FINAL_SHA256=$($final.exe_sha256)"
          Write-Host "FINAL_RELEASE_GATE=PASS"

      - name: Acceptance Evidence
        run: |
          $final = Get-Content ".\dist\final_gate.json" -Raw | ConvertFrom-Json
          $mother = Get-Content ".\dist\mother_gates.json" -Raw | ConvertFrom-Json
          @(
            "artifact=Psychology_Insight_Pro.exe"
            "app_version=0.4.0"
            "source_commit=$env:GITHUB_SHA"
            "final_gate=$($final.final_gate)"
            "hard_fail_count=$($final.hard_fail_count)"
            "sha256=$($final.exe_sha256)"
            "real_network=$($mother.gates.real_network)"
            "physical_gui=$($mother.gates.gui_smoke)"
            "same_hash=$($mother.gates.same_hash)"
            "business_content=$($mother.gates.business_content)"
            "counterexample_validation=$($mother.gates.counterexample_validation)"
            "reversal_validation=$($mother.gates.reversal_validation)"
          ) | Out-File ".\dist\acceptance.txt" -Encoding utf8
          Get-Content ".\dist\acceptance.txt"

      - name: Upload Unique Final Product
        uses: actions/upload-artifact@v4
        with:
          name: Psychology_Insight_Pro_FINAL_v0.4.0
          path: dist/final/Psychology_Insight_Pro.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload Audit Evidence
        uses: actions/upload-artifact@v4
        with:
          name: Psychology_Insight_Pro_AUDIT_v0.4.0
          path: |
            dist/acceptance.txt
            dist/final_gate.json
            dist/mother_gates.json
            psychology_insight_pro/architecture_gate.json
            psychology_insight_pro/business_gate.json
            psychology_insight_pro/unit_gate.json
            psychology_insight_pro/contract_gate.json
            psychology_insight_pro/fault_gate.json
            psychology_insight_pro/integration_gate.json
            psychology_insight_pro/business_validation_gate.json
            psychology_insight_pro/real_network_evidence.json
            psychology_insight_pro/exact_candidate_gate.json
            psychology_insight_pro/physical_gui_click.json
          if-no-files-found: error
          retention-days: 30
