name: Psychology Insight Pro - Full Release Gate

on:
  push:
    branches: [main]
    paths:
      - 'psychology_insight_pro/**'
      - '.github/workflows/psychology-insight-pro-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-release-gate:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Architecture and code completeness
        shell: pwsh
        run: |
          python -m compileall -q psychology_insight_pro
          python psychology_insight_pro/architecture_gate.py
          if ($LASTEXITCODE -ne 0) { throw "Architecture Gate failed" }

      - name: Self-Test
        shell: pwsh
        run: |
          python psychology_insight_pro/app.py --self-test
          if ($LASTEXITCODE -ne 0) { throw "Self-Test failed" }

      - name: Contract Test
        shell: pwsh
        run: |
          python psychology_insight_pro/tests/test_contracts.py
          if ($LASTEXITCODE -ne 0) { throw "Contract Test failed" }

      - name: Fault Injection
        shell: pwsh
        run: |
          python psychology_insight_pro/tests/test_fault_injection.py
          if ($LASTEXITCODE -ne 0) { throw "Fault Injection failed" }

      - name: Full Regression
        shell: pwsh
        run: |
          python -m unittest discover -s psychology_insight_pro/tests -v

      - name: Real Network
        shell: pwsh
        run: |
          python psychology_insight_pro/real_network_check.py
          if ($LASTEXITCODE -ne 0) { throw "Real Network failed" }

      - name: Windows Build
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --noupx --onefile --windowed --name Psychology_Insight_Pro --add-data "psychology_insight_pro/knowledge.json;." psychology_insight_pro/app.py
          if (-not (Test-Path ".\dist\Psychology_Insight_Pro.exe")) { throw "EXE missing" }

      - name: Exact EXE Self-Test
        shell: pwsh
        run: |
          $exe = Resolve-Path ".\dist\Psychology_Insight_Pro.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Exact EXE self-test failed: $($p.ExitCode)" }

      - name: GUI Smoke
        shell: pwsh
        run: |
          $exe = Resolve-Path ".\dist\Psychology_Insight_Pro.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--gui-smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "GUI smoke failed: $($p.ExitCode)" }

      - name: Physical GUI Click Smoke
        shell: pwsh
        run: |
          .\.github\scripts\physical_gui_click_smoke.ps1 -ExePath ".\dist\Psychology_Insight_Pro.exe" -Points "0.45,0.43;0.90,0.43;0.45,0.79;0.90,0.79" -EvidencePath ".\dist\physical_gui_click.json"

      - name: Same Hash
        shell: pwsh
        run: |
          $source = ".\dist\Psychology_Insight_Pro.exe"
          $pre = (Get-FileHash $source -Algorithm SHA256).Hash.ToLower()
          New-Item -ItemType Directory -Force ".\dist\final" | Out-Null
          Copy-Item $source ".\dist\final\Psychology_Insight_Pro.exe" -Force
          $post = (Get-FileHash ".\dist\final\Psychology_Insight_Pro.exe" -Algorithm SHA256).Hash.ToLower()
          if ($pre -ne $post) { throw "Same Hash failed: $pre != $post" }
          $pre | Out-File ".\dist\pre.sha256.txt" -Encoding ascii
          $post | Out-File ".\dist\final.sha256.txt" -Encoding ascii

      - name: Final Gate
        shell: pwsh
        run: |
          @'
          {"gates":{"purpose_model":"PASS","five_why":"PASS","risk_boundary":"PASS","domain_model":"PASS","architecture":"PASS","function_contract":"PASS","interface_contract":"PASS","data_source":"PASS","netclient":"PASS","storage":"PASS","engine":"PASS","evidence":"PASS","service":"PASS","ui":"PASS","self_test":"PASS","contract_test":"PASS","fault_injection":"PASS","real_network":"PASS","windows_build":"PASS","exact_exe":"PASS","gui_smoke":"PASS","same_hash":"PASS"}}
          '@ | Out-File ".\dist\gate_input.json" -Encoding utf8

          python psychology_insight_pro/release_gate.py --input ".\dist\gate_input.json" --output ".\dist\final_gate.json"
          if ($LASTEXITCODE -ne 0) { throw "Final Gate failed" }

          $gate = Get-Content ".\dist\final_gate.json" -Raw | ConvertFrom-Json
          if ($gate.final_gate -ne "PASS") { throw "Final Gate is not PASS" }

      - name: Acceptance Evidence
        shell: pwsh
        run: |
          $hash = (Get-FileHash ".\dist\final\Psychology_Insight_Pro.exe" -Algorithm SHA256).Hash.ToLower()
          "artifact=Psychology_Insight_Pro.exe" | Out-File ".\dist\acceptance.txt" -Encoding utf8
          "app_version=0.2.1" | Out-File ".\dist\acceptance.txt" -Append -Encoding utf8
          "source_commit=$env:GITHUB_SHA" | Out-File ".\dist\acceptance.txt" -Append -Encoding utf8
          "self_test=PASS" | Out-File ".\dist\acceptance.txt" -Append -Encoding utf8
          "contract_test=PASS" | Out-File ".\dist\acceptance.txt" -Append -Encoding utf8
          "fault_injection=PASS" | Out-File ".\dist\acceptance.txt" -Append -Encoding utf8
          "real_network=PASS" | Out-File ".\dist\acceptance.txt" -Append -Encoding utf8
          "windows_build=PASS" | Out-File ".\dist\acceptance.txt" -Append -Encoding utf8
          "exact_exe=PASS" | Out-File ".\dist\acceptance.txt" -Append -Encoding utf8
          "gui_smoke=PASS" | Out-File ".\dist\acceptance.txt" -Append -Encoding utf8
          "same_hash=PASS" | Out-File ".\dist\acceptance.txt" -Append -Encoding utf8
          "final_gate=PASS" | Out-File ".\dist\acceptance.txt" -Append -Encoding utf8
          "sha256=$hash" | Out-File ".\dist\acceptance.txt" -Append -Encoding utf8
          Get-Content ".\dist\acceptance.txt"

      - name: Upload Unique Final Product
        uses: actions/upload-artifact@v4
        with:
          name: Psychology_Insight_Pro_FINAL_v0.2.1
          path: dist/final/Psychology_Insight_Pro.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload Audit Evidence
        uses: actions/upload-artifact@v4
        with:
          name: Psychology_Insight_Pro_AUDIT_v0.2.1
          path: |
            dist/acceptance.txt
            dist/final_gate.json
            dist/pre.sha256.txt
            dist/final.sha256.txt
            dist/physical_gui_click.json
          if-no-files-found: error
          retention-days: 30

