name: Stock SZSE suspension primary sample
on:
  push:
    branches:
      - diagnostic/stock-szse-suspension-primary-sample-20261006
  pull_request:
    paths:
      - ".github/stock_diag/stock_szse_suspension_primary_sample.py"
      - ".github/workflows/stock-szse-suspension-primary-sample.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify current Stock product byte identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          authoritative="7f270b9ab58e11fd8129053a65e000c90ff9d8c1"
          test -z "$(git diff --name-only "$authoritative"..HEAD -- StockAIPro)"
          echo "STOCK_PRODUCT_TREE_BYTE_IDENTITY=PASS"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2" "beautifulsoup4==4.14.2"
      - name: Sample official primary suspension articles
        run: python .github/stock_diag/stock_szse_suspension_primary_sample.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: STOCK-SZSE-SUSPENSION-PRIMARY-SAMPLE-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            stock_szse_suspension_static_archive.json
            stock_szse_suspension_primary_sample.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve strict boundary
        if: always()
        run: |
          echo "ARCHIVE_TITLE_SEMANTICS_COMPLETE=NOT VERIFIED"
          echo "SHENZHEN_HISTORICAL_SUSPENSION_STATE=NOT VERIFIED"
          echo "SHENZHEN_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"
