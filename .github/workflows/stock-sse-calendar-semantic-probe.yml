name: Stock SSE calendar and suspension semantic probe

on:
  push:
    branches:
      - "diagnostic/stock-sse-calendar-semantic-probe-20261005"
    paths:
      - "StockAIPro/hardening_tests/stock_sse_calendar_semantic_probe.py"
      - ".github/workflows/stock-sse-calendar-semantic-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact diagnostic checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected" || { echo "checkout identity mismatch: actual=$actual expected=$expected"; exit 1; }
          echo "EXACT_DIAGNOSTIC_HEAD=$actual"
      - name: Verify authoritative Stock product bytes unchanged
        shell: bash
        run: |
          set -euo pipefail
          base="43168d9e75c70ab55be808d8a51f0c0eb14d83d5"
          git merge-base --is-ancestor "$base" HEAD
          changed="$(git diff --name-only "$base..HEAD" -- StockAIPro | grep -v '^StockAIPro/hardening_tests/stock_sse_suspension_endpoint_discovery.py$' | grep -v '^StockAIPro/hardening_tests/stock_sse_historical_suspension_query.py$' | grep -v '^StockAIPro/hardening_tests/stock_sse_calendar_semantic_probe.py$' || true)"
          test -z "$changed" || { echo "$changed"; exit 1; }
          echo "STOCK_PRODUCT_BYTES_CHANGED=FALSE"
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
      - name: Install diagnostic dependency
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2"
      - name: Probe official SSE calendar and suspension semantics
        working-directory: StockAIPro
        run: python hardening_tests/stock_sse_calendar_semantic_probe.py
      - name: Upload probe evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-SSE-CALENDAR-SEMANTIC-PROBE-${{ github.sha }}
          path: StockAIPro/stock_sse_calendar_semantic_probe.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve strict non-promotion boundary
        working-directory: StockAIPro
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("stock_sse_calendar_semantic_probe.json").read_text(encoding="utf-8"))
          a=x["adjudication"]
          assert a["historical_daily_suspension_state"] == "NOT VERIFIED"
          assert a["shanghai_historical_st_pit"] == "NOT VERIFIED"
          assert a["full_historical_st_pit"] == "NOT VERIFIED"
          assert a["advanced_business"] == "NOT VERIFIED"
          assert a["final_gate"] == "FAIL"
          assert a["product_bytes_changed"] is False
          print("HISTORICAL_DAILY_SUSPENSION_STATE=NOT VERIFIED")
          print("SHANGHAI_HISTORICAL_ST_PIT=NOT VERIFIED")
          print("FULL_HISTORICAL_ST_PIT=NOT VERIFIED")
          print("ADVANCED_BUSINESS=NOT VERIFIED")
          print("FINAL_GATE=FAIL")
          PY
