name: DLT V2 Feature Utility Shadow Audit

on:
  pull_request:
    paths:
      - "DLT/src/glp/research_v2.py"
      - "DLT/src/glp/research_v2_audit.py"
      - "DLT/scripts/research_v2_feature_audit.py"
      - "DLT/tests/test_research_v2*.py"
      - ".github/workflows/dlt-research-v2-shadow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: DLT
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Exact checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "EXACT_HEAD=$EXPECTED_SHA"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile research modules
        run: python -m compileall -q src/glp/research_v2.py src/glp/research_v2_audit.py scripts/research_v2_feature_audit.py

      - name: Research V2 regression tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_research_v2 tests.test_research_v2_audit -v

      - name: Execute live-canonical 360-draw OOS feature utility audit
        run: python scripts/research_v2_feature_audit.py

      - name: Fail-closed evidence schema check
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/research_v2_feature_audit.json")
          x=json.loads(p.read_text(encoding="utf-8"))
          assert x["data_source"]=="LIVE_OFFICIAL_CANONICAL"
          assert x["network_gate"]=="PASS"
          assert x["freshness_gate"]=="PASS"
          assert x["crosscheck_status"]=="PASS"
          assert x["predictive_edge_claim"]=="NOT_VERIFIED"
          assert x["production_rho"]==0.0
          assert x["promotion_authorized"] is False
          assert "gap" not in x["feature_names"]
          allowed={"KEEP_CANDIDATE","DEAD_PATH","NOT_VERIFIED"}
          assert all(v["overall"] in allowed for v in x["combined"].values())
          print("LIVE_FEATURE_UTILITY_EVIDENCE_SCHEMA=PASS")
          PY

      - name: Upload shadow evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DLT-V2-LIVE-FEATURE-UTILITY-${{ github.event.pull_request.head.sha || github.sha }}
          path: DLT/artifacts/research_v2_feature_audit.json
          if-no-files-found: error
          retention-days: 30
