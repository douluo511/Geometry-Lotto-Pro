name: AI Music reauthored Windows candidate

on:
  pull_request:
    paths:
      - "AIMusic/**"
      - ".github/workflows/ai-music-reauthored.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-candidate:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONHASHSEED: "1"

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact checkout
        shell: pwsh
        run: |
          $head=(git rev-parse HEAD).Trim()
          if($head -ne $env:SOURCE_SHA){ throw "checkout mismatch: $head != $env:SOURCE_SHA" }
          "SOURCE_SHA=$head" | Set-Content -Encoding utf8 AIMusic/reauthored/checkout_identity.txt

      - name: Setup pinned Windows Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"

      - name: Install frozen build dependency
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input "pyinstaller==6.11.1"

      - name: Static compile and unit contracts
        shell: pwsh
        run: |
          $env:PYTHONPATH=(Resolve-Path "AIMusic/reauthored").Path
          python -m compileall -q AIMusic/reauthored
          python -m unittest discover -s AIMusic/reauthored/tests -v

      - name: Governance and recovered-scope contract
        shell: pwsh
        run: |
          $c=Get-Content -Raw AIMusic/reauthored/ACCEPTANCE_CONTRACT.json | ConvertFrom-Json
          if($c.lineage -ne "REAUTHORED_STAGING"){ throw "lineage must remain explicit" }
          if($c.historical_candidate_source_lineage -ne "NOT VERIFIED"){ throw "historical source cannot inherit PASS" }
          if($c.product.desktop_entries.Count -ne 4){ throw "four-entry UI contract missing" }
          if($c.expected_current_candidate_boundary.final_gate -ne "FAIL"){ throw "candidate must not predeclare Final PASS" }

      - name: Real source-reference network gate
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $root=Join-Path $env:RUNNER_TEMP "ai_music_network"
          $report=Join-Path $pwd "AIMusic/reauthored/real_network_evidence.json"
          python AIMusic/reauthored/app.py --root "$root" --network-probe --network-report "$report"
          if($LASTEXITCODE -ne 0){
            if(Test-Path $report){ Get-Content -Raw $report | Write-Host }
            throw "real network probe failed"
          }
          $obj=Get-Content -Raw $report | ConvertFrom-Json
          if(-not $obj.authenticated_request){ throw "real network probe was not authenticated" }
          if($obj.status -ne "PASS" -or $obj.http_status -lt 200 -or $obj.http_status -ge 300){ throw "network evidence invalid" }

      - name: Bind exact source SHA and build native Windows EXEs
        shell: pwsh
        run: |
          "SOURCE_SHA = `"$env:SOURCE_SHA`"" | Set-Content -Encoding utf8 AIMusic/reauthored/build_info.py
          Push-Location AIMusic/reauthored
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AIMusicPro app.py
          if($LASTEXITCODE -ne 0){ throw "main Windows build failed" }
          python -m PyInstaller --noconfirm --clean --onefile --console --name AIMusicUpdater updater.py
          if($LASTEXITCODE -ne 0){ throw "updater Windows build failed" }
          Pop-Location
          if(!(Test-Path AIMusic/reauthored/dist/AIMusicPro.exe)){ throw "main EXE missing" }
          if(!(Test-Path AIMusic/reauthored/dist/AIMusicUpdater.exe)){ throw "updater EXE missing" }

      - name: Exact EXE self-test and pre-GUI Same Hash
        shell: pwsh
        run: |
          $exe=(Resolve-Path AIMusic/reauthored/dist/AIMusicPro.exe).Path
          $root=Join-Path $env:RUNNER_TEMP "ai_music_exact"
          New-Item -ItemType Directory -Force $root | Out-Null
          $health=Join-Path $pwd "AIMusic/reauthored/exact_exe_evidence.json"
          $nonce=[guid]::NewGuid().ToString("N")
          $before=(Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          $proc=Start-Process -FilePath $exe -ArgumentList @("--root",$root,"--self-test","--health-report",$health,"--health-nonce",$nonce) -Wait -PassThru
          if($proc.ExitCode -ne 0){ throw "Exact EXE self-test failed rc=$($proc.ExitCode)" }
          $obj=Get-Content -Raw $health | ConvertFrom-Json
          if($obj.status -ne "PASS" -or $obj.product -ne "AIMusicProductionSystem" -or $obj.source_sha -ne $env:SOURCE_SHA -or $obj.exe_sha256 -ne $before -or $obj.nonce -ne $nonce){ throw "Exact EXE identity failed" }
          $after=(Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          if($before -ne $after){ throw "EXE hash changed during self-test" }

      - name: Independent updater contract and blocked production boundary
        shell: pwsh
        run: |
          $up=(Resolve-Path AIMusic/reauthored/dist/AIMusicUpdater.exe).Path
          $root=Join-Path $env:RUNNER_TEMP "ai_music_updater"
          New-Item -ItemType Directory -Force $root | Out-Null
          $self=Join-Path $pwd "AIMusic/reauthored/updater_self_test.json"
          $p=Start-Process -FilePath $up -ArgumentList @("--root",$root,"--self-test","--report",$self) -Wait -PassThru -NoNewWindow
          if($p.ExitCode -ne 0){ throw "updater self-test failed" }
          $obj=Get-Content -Raw $self | ConvertFrom-Json
          if($obj.status -ne "PASS" -or $obj.positive_production_update -ne "BLOCKED"){ throw "updater boundary invalid" }

          $blocked=Join-Path $pwd "AIMusic/reauthored/updater_blocked_evidence.json"
          $p2=Start-Process -FilePath $up -ArgumentList @("--root",$root,"--report",$blocked) -Wait -PassThru -NoNewWindow
          if($p2.ExitCode -ne 3){ throw "expected updater BLOCKED rc=3, got $($p2.ExitCode)" }
          $b=Get-Content -Raw $blocked | ConvertFrom-Json
          if($b.status -ne "BLOCKED"){ throw "positive production update must fail closed" }

      - name: Physical GUI clicks on exact EXE
        shell: pwsh
        run: |
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class MouseNative {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int X, int Y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, UIntPtr extra);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);
          }
          "@

          $exe=(Resolve-Path AIMusic/reauthored/dist/AIMusicPro.exe).Path
          $before=(Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          $root=Join-Path $env:RUNNER_TEMP "ai_music_gui"
          New-Item -ItemType Directory -Force $root | Out-Null
          $layout=Join-Path $env:RUNNER_TEMP "ai_music_gui_layout.json"
          $env:AI_MUSIC_GUI_LAYOUT=$layout
          $proc=Start-Process -FilePath $exe -ArgumentList @("--root",$root) -PassThru

          $deadline=(Get-Date).AddSeconds(60)
          while(!(Test-Path $layout) -and (Get-Date) -lt $deadline){ Start-Sleep -Milliseconds 250 }
          if(!(Test-Path $layout)){ Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue; throw "GUI layout not published" }
          $geo=Get-Content -Raw $layout | ConvertFrom-Json
          if($geo.status -ne "PASS"){ throw "GUI layout status failed" }
          # PyInstaller one-file uses a bootloader parent plus an application child PID.
          # Bind physical GUI evidence to the child's own sys.executable path+hash instead of assuming launcher PID equality.
          if(([string]$geo.executable) -ne $exe -or ([string]$geo.exe_sha256) -ne $before){ throw "GUI child is not bound to exact EXE bytes" }
          $guiPid=[int]$geo.pid
          $guiProcess=Get-Process -Id $guiPid -ErrorAction Stop

          $actionsPath=Join-Path $root "state/gui_actions.json"
          $hwnd=[IntPtr]([long]$geo.hwnd)

          function Click-Entry([string]$label,[string[]]$allowedStatuses,[int]$timeoutSeconds){
            $entry=$geo.buttons.PSObject.Properties[$label].Value
            if($null -eq $entry){ throw "missing button geometry: $label" }

            [MouseNative]::ShowWindow($hwnd,9) | Out-Null
            [MouseNative]::SetForegroundWindow($hwnd) | Out-Null
            Start-Sleep -Milliseconds 250
            [MouseNative]::SetCursorPos([int]$entry.center_x,[int]$entry.center_y) | Out-Null
            [MouseNative]::mouse_event(0x0002,0,0,0,[UIntPtr]::Zero)
            [MouseNative]::mouse_event(0x0004,0,0,0,[UIntPtr]::Zero)

            $actionDeadline=(Get-Date).AddSeconds($timeoutSeconds)
            while((Get-Date) -lt $actionDeadline){
              if(Test-Path $actionsPath){
                try {
                  $state=Get-Content -Raw $actionsPath | ConvertFrom-Json
                  $prop=$state.PSObject.Properties[$label]
                  if($null -ne $prop){
                    $observed=[string]$prop.Value.status
                    if($allowedStatuses -contains $observed){
                      Write-Host "GUI_ACTION=$label STATUS=$observed"
                      return
                    }
                    if($observed){
                      throw "GUI action $label returned unexpected status=$observed payload=$($prop.Value.payload | ConvertTo-Json -Compress -Depth 8)"
                    }
                  }
                } catch {
                  if($_.Exception.Message -like "GUI action * returned unexpected*"){ throw }
                }
              }
              Start-Sleep -Milliseconds 250
            }
            throw "GUI action receipt timeout: $label"
          }

          Click-Entry "AI创作" @("PASS") 45
          Click-Entry "一键更新" @("BLOCKED") 30
          Click-Entry "一键修复" @("PASS","WARN") 30
          Click-Entry "高级制作" @("PASS") 30
          if(!(Test-Path $actionsPath)){ throw "GUI actions evidence missing" }
          $actions=Get-Content -Raw $actionsPath | ConvertFrom-Json
          if($actions."AI创作".status -ne "PASS"){ throw "AI创作 physical click failed" }
          if($actions."一键更新".status -ne "BLOCKED"){ throw "update must expose blocked production context" }
          if($actions."一键修复".status -notin @("PASS","WARN")){ throw "repair physical click failed" }
          if($actions."高级制作".status -ne "PASS"){ throw "advanced physical click failed" }

          Stop-Process -Id $guiPid -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Milliseconds 500
          $after=(Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          if($before -ne $after){ throw "Same Hash failed after physical GUI clicks" }

          [ordered]@{
            schema="ai-music-physical-gui-v1"
            status="PASS"
            physical_gui="PASS"
            click_method="OS physical mouse coordinates from exact process-published screen geometry"
            launcher_pid=$proc.Id
            gui_pid=$guiPid
            exe=$exe
            exe_sha256_before=$before
            exe_sha256_after=$after
            same_hash="PASS"
            layout=$geo
            actions=$actions
          } | ConvertTo-Json -Depth 12 | Set-Content -Encoding utf8 AIMusic/reauthored/physical_gui_evidence.json

      - name: Freeze candidate manifest and explicit Final boundary
        shell: pwsh
        run: |
          $exe=(Resolve-Path AIMusic/reauthored/dist/AIMusicPro.exe).Path
          $up=(Resolve-Path AIMusic/reauthored/dist/AIMusicUpdater.exe).Path
          $mainHash=(Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          $upHash=(Get-FileHash -Algorithm SHA256 $up).Hash.ToLowerInvariant()

          $engineering=[ordered]@{
            requirements_purpose_model="PASS"; five_why="PASS"; risk_boundary="PASS"; domain_model="PASS"
            architecture="PASS"; function_inventory="PASS"; interface_contracts="PASS"; data_sources="PASS"
            netclient="PASS"; storage="PASS"; engine="PASS"; validation="PASS"; evidence="PASS"; service="PASS"
            ui="PASS"; self_test="PASS"; contract_test="PASS"; fault_injection="PASS"; real_network="PASS"
            windows_build="PASS"; exact_exe="PASS"; physical_gui="PASS"; updater_contract="PASS"
            positive_production_update="BLOCKED"; repository_independence="BLOCKED"; real_release_n_to_n_plus_1="BLOCKED"
            same_hash_current_bytes="PASS"; formal_release_redownload_same_hash="NOT VERIFIED"
          }
          $business=[ordered]@{
            idea_to_audio="PASS"; real_audio_output="PASS"; deterministic_audio="PASS"; structure="PASS"; chords="PASS"
            melody="PASS"; arrangement="PASS"; mix_master="PASS"; project_evidence="PASS"; export_integrity="PASS"
            review_edit_flow="NOT VERIFIED"; lyrics="NOT IMPLEMENTED"; vocal="NOT VERIFIED"; external_ai_provider_and_license="NOT VERIFIED"
          }
          $engPass=($engineering.Values | Where-Object {$_ -eq "PASS"}).Count
          $bizPass=($business.Values | Where-Object {$_ -eq "PASS"}).Count
          $engPct=[math]::Round(100.0*$engPass/$engineering.Count,4)
          $bizPct=[math]::Round(100.0*$bizPass/$business.Count,4)
          $manifest=[ordered]@{
            schema="ai-music-reauthored-candidate-manifest-v1"
            status="CANDIDATE_ONLY"
            lineage="REAUTHORED_STAGING"
            historical_candidate_source_lineage="NOT VERIFIED"
            source_sha=$env:SOURCE_SHA
            main_sha256=$mainHash
            updater_sha256=$upHash
            engineering_completion=[ordered]@{passed=$engPass;total=$engineering.Count;percent=$engPct;status="NOT VERIFIED";gate_statuses=$engineering}
            business_completion=[ordered]@{passed=$bizPass;total=$business.Count;percent=$bizPct;status="NOT VERIFIED";gate_statuses=$business}
            overall_completion_percent=[math]::Min($engPct,$bizPct)
            external_ai_provider="NOT VERIFIED"
            final_gate="FAIL"
            delivery_allowed=$false
            note="Re-authored lineage: local procedural audio is real output but is not relabeled as an external AI provider/model."
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 AIMusic/reauthored/candidate_manifest.json
          if($manifest.final_gate -ne "FAIL" -or $manifest.delivery_allowed -ne $false){ throw "Final boundary corrupted" }
          Write-Host "ENGINEERING_COMPLETION_PERCENT=$engPct"
          Write-Host "BUSINESS_COMPLETION_PERCENT=$bizPct"
          Write-Host "REPOSITORY_INDEPENDENCE=BLOCKED"
          Write-Host "EXTERNAL_AI_PROVIDER=NOT VERIFIED"
          Write-Host "FINAL_GATE=FAIL"

      - name: Upload current exact-head candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AI-Music-reauthored-${{ env.SOURCE_SHA }}
          if-no-files-found: error
          retention-days: 14
          path: |
            AIMusic/RECOVERED_CANDIDATE_IDENTITY.json
            AIMusic/reauthored/ACCEPTANCE_CONTRACT.json
            AIMusic/reauthored/real_network_evidence.json
            AIMusic/reauthored/exact_exe_evidence.json
            AIMusic/reauthored/updater_self_test.json
            AIMusic/reauthored/updater_blocked_evidence.json
            AIMusic/reauthored/physical_gui_evidence.json
            AIMusic/reauthored/candidate_manifest.json
            AIMusic/reauthored/dist/AIMusicPro.exe
            AIMusic/reauthored/dist/AIMusicUpdater.exe
