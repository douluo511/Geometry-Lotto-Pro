name: SSQ V2 Joint Ridge Shadow Audit

on:
  pull_request:
    paths:
      - "SSQ/SSQ/glp/research_v2.py"
      - "SSQ/SSQ/glp/research_v2_model_audit.py"
      - "SSQ/scripts/research_v2_joint_ridge_audit.py"
      - "SSQ/tests/test_research_v2_model_audit.py"
      - ".github/workflows/ssq-research-v2-joint-shadow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  joint-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: SSQ
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Exact checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "EXACT_HEAD=$EXPECTED_SHA"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"

      - name: Install pinned network dependency
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2"

      - name: Compile joint audit
        run: python -m compileall -q SSQ/glp/research_v2.py SSQ/glp/research_v2_model_audit.py scripts/research_v2_joint_ridge_audit.py

      - name: Joint audit regression test
        env:
          PYTHONPATH: SSQ
        run: python -m unittest tests.test_research_v2_model_audit -v

      - name: Execute live-official 120-draw SSQ joint Ridge shadow audit
        run: python scripts/research_v2_joint_ridge_audit.py

      - name: Fail-closed evidence schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("artifacts/research_v2_joint_ridge_audit.json").read_text(encoding="utf-8"))
          assert x["data_source"]=="LIVE_OFFICIAL_CANONICAL"
          assert x["network_gate"]=="PASS"
          assert x["freshness_gate"]=="PASS"
          assert x["crosscheck_status"]=="PASS"
          assert x["predictive_edge_claim"]=="NOT_VERIFIED"
          assert x["production_rho"]==0.0
          assert x["promotion_authorized"] is False
          assert x["shadow_decision"] in {"NO_EDGE","SHADOW_EDGE_CANDIDATE"}
          assert set(x["exact_null"]["two_dan_hits"])=={"0","1","2","at_least_one"}
          print("SSQ_JOINT_RIDGE_SHADOW_SCHEMA=PASS")
          PY

      - name: Upload joint shadow evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SSQ-V2-JOINT-RIDGE-${{ github.event.pull_request.head.sha || github.sha }}
          path: SSQ/artifacts/research_v2_joint_ridge_audit.json
          if-no-files-found: error
          retention-days: 30
