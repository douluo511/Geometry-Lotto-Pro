name: Stock SSE risk-warning transition inventory

on:
  push:
    branches:
      - diagnostic/stock-sse-risk-warning-transition-inventory-20261006
  pull_request:
    paths:
      - ".github/stock_diag/stock_sse_risk_warning_transition_inventory.py"
      - ".github/workflows/stock-sse-risk-warning-transition-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout and unchanged Stock product bytes
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${GITHUB_SHA}"
          git merge-base --is-ancestor c9336a30a34e3d556858a2ddf3b165164c975315 HEAD
          changed="$(git diff --name-only c9336a30a34e3d556858a2ddf3b165164c975315..HEAD -- StockAIPro || true)"
          test -z "$changed" || { echo "$changed"; exit 1; }
          echo "STOCK_PRODUCT_BYTES_CHANGED=FALSE"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
          check-latest: false

      - name: Install pinned dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2"

      - name: Build market-wide title-transition inventory
        shell: bash
        run: python .github/stock_diag/stock_sse_risk_warning_transition_inventory.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-SSE-RISK-WARNING-TRANSITION-INVENTORY-${{ github.sha }}
          path: stock_sse_risk_warning_transition_inventory.json
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve strict boundary
        if: always()
        shell: bash
        run: |
          echo "TITLE_TRANSITION_INVENTORY=DIAGNOSTIC_ONLY"
          echo "SHANGHAI_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "FULL_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "ADVANCED_BUSINESS=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"
