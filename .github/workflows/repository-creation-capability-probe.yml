name: Repository creation capability probe

on:
  pull_request:
    paths:
      - '.github/workflows/repository-creation-capability-probe.yml'
      - '.github/scripts/probe_repository_creation.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: Geometry-Lotto-Pro-SSQ
      OWNER: ${{ github.repository_owner }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact probe head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Probe account-level repository creation
        run: python .github/scripts/probe_repository_creation.py
      - name: Upload sanitized capability evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-creation-capability-probe-${{ github.event.pull_request.head.sha || github.sha }}
          path: repository_creation_probe.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve capability boundary
        run: |
          python - <<'PY'
          import json
          x=json.load(open("repository_creation_probe.json",encoding="utf-8"))
          print("REPOSITORY_CREATION_CAPABILITY="+x["capability_status"])
          print("TARGET_REPOSITORY_AVAILABLE="+("YES" if x["capability_status"]=="PASS" else "NO"))
          PY
