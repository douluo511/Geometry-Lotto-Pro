name: Stock AI SSE suspension surface diagnostic

on:
  push:
    branches:
      - "diagnostic/stock-sse-suspension-surface-20261005"
    paths:
      - "StockAIPro/hardening_tests/stock_sse_suspension_surface_probe.py"
      - ".github/workflows/stock-ai-sse-suspension-surface-diagnostic.yml"
  pull_request:
    paths:
      - "StockAIPro/hardening_tests/stock_sse_suspension_surface_probe.py"
      - ".github/workflows/stock-ai-sse-suspension-surface-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact diagnostic checkout
        shell: pwsh
        run: |
          $actual = (& git rev-parse HEAD).Trim()
          $expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          if ($actual -ne $expected) { throw "checkout identity mismatch: actual=$actual expected=$expected" }
          Write-Host "EXACT_DIAGNOSTIC_HEAD=$actual"

      - name: Verify Stock product bytes unchanged
        shell: pwsh
        run: |
          $base = "43168d9e75c70ab55be808d8a51f0c0eb14d83d5"
          git merge-base --is-ancestor $base HEAD
          $allowed = @(
            'StockAIPro/hardening_tests/stock_historical_st_pit_probe.py',
            'StockAIPro/hardening_tests/stock_sse_suspension_surface_probe.py'
          )
          $changed = @(git diff --name-only "$base..HEAD" -- StockAIPro)
          $unexpected = @($changed | Where-Object { $allowed -notcontains $_ })
          if ($unexpected.Count -gt 0) {
            throw "diagnostic changed StockAIPro product/runtime bytes: $($unexpected -join ', ')"
          }
          Write-Host "PRODUCT_BYTES_CHANGED=FALSE"

      - name: Setup pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"

      - name: Install pinned diagnostic dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.32.5"

      - name: Probe official SSE suspension public surface
        working-directory: StockAIPro
        shell: pwsh
        run: python hardening_tests/stock_sse_suspension_surface_probe.py

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-SSE-SUSPENSION-SURFACE-${{ github.sha }}
          path: StockAIPro/stock_sse_suspension_surface_diagnostic.json
          if-no-files-found: error
          retention-days: 30

      - name: Explicit fail-closed boundary
        run: |
          echo "SSE_PUBLIC_SUSPENSION_SURFACE=PROBED"
          echo "STABLE_PUBLIC_BULK_HISTORICAL_SUSPENSION_ENDPOINT=NOT VERIFIED"
          echo "HISTORICAL_DAILY_SUSPENSION_STATE=NOT VERIFIED"
          echo "SHANGHAI_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "FULL_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"
