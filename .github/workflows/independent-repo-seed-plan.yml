name: Independent Repository Seed Plan Validation

on:
  pull_request:
    paths:
      - "tools/bootstrap_independent_repo.ps1"
      - ".github/workflows/independent-repo-seed-plan.yml"
      - ".github/workflows/independent-repo-bootstrap-contract.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  plan-verified-seeds:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact bootstrap head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download verified SSQ seed
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'ssq-seed'
          gh run download 37455426086 --repo douluo511/Geometry-Lotto-Pro --name "SSQ-INDEPENDENT-REPO-EXPORT-31db6a81681fe1676a1d2c65949dcc6b633614b1" --dir $out
          if($LASTEXITCODE -ne 0){ throw 'SSQ seed artifact download failed' }
          $manifest=Get-ChildItem -LiteralPath $out -Recurse -Filter MIGRATION_MANIFEST.json | Select-Object -First 1
          if(-not $manifest){ throw 'SSQ seed manifest missing after artifact download' }
          "SSQ_EXPORT_DIR=$($manifest.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Plan-only validate exact SSQ seed
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\tools\bootstrap_independent_repo.ps1 `
            -ExportDir "$env:SSQ_EXPORT_DIR" `
            -TargetRepo "douluo511/Geometry-Lotto-Pro-SSQ" `
            -Visibility private `
            -ExpectedSourceCommit "31db6a81681fe1676a1d2c65949dcc6b633614b1" `
            -PlanOnly `
            -EvidencePath "$env:RUNNER_TEMP\ssq-bootstrap-plan.json"
          $e=Get-Content "$env:RUNNER_TEMP\ssq-bootstrap-plan.json" -Raw | ConvertFrom-Json
          if($e.status -ne 'PASS'){ throw 'SSQ bootstrap plan did not PASS' }
          if($e.remote_verification -ne 'NOT_RUN_PLAN_ONLY'){ throw 'SSQ plan unexpectedly performed remote verification' }
          if($e.source.schema -ne 'ssq-independent-repo-export-v1'){ throw 'SSQ schema mismatch' }
          if($e.source.source_commit -ne '31db6a81681fe1676a1d2c65949dcc6b633614b1'){ throw 'SSQ source SHA mismatch' }
          if($e.source.manifest_sha256 -ne 'cb960c323b65f2653b1dc0e0bc3abf2cfe8ce2cb40918905400fa478432fa542'){ throw 'SSQ manifest SHA mismatch' }
          if([int]$e.source.file_count -ne 47){ throw 'SSQ file_count mismatch' }
          Get-Content "$env:RUNNER_TEMP\ssq-bootstrap-plan.json"

      - name: Download verified DLT seed
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'dlt-seed'
          gh run download 37732205211 --repo douluo511/Geometry-Lotto-Pro --name "dlt-independent-repo-seed-c889dc307ed70a2d3bcbc356da99cea75d0f9c28" --dir $out
          if($LASTEXITCODE -ne 0){ throw 'DLT seed artifact download failed' }
          $manifest=Get-ChildItem -LiteralPath $out -Recurse -Filter MIGRATION_MANIFEST.json | Select-Object -First 1
          if(-not $manifest){ throw 'DLT seed manifest missing after artifact download' }
          "DLT_EXPORT_DIR=$($manifest.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Plan-only validate exact DLT seed
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\tools\bootstrap_independent_repo.ps1 `
            -ExportDir "$env:DLT_EXPORT_DIR" `
            -TargetRepo "douluo511/Geometry-Lotto-Pro-DLT" `
            -Visibility private `
            -ExpectedSourceCommit "c2b0db6876d2aae874f8cf4d08f52455c8eaf152" `
            -PlanOnly `
            -EvidencePath "$env:RUNNER_TEMP\dlt-bootstrap-plan.json"
          $e=Get-Content "$env:RUNNER_TEMP\dlt-bootstrap-plan.json" -Raw | ConvertFrom-Json
          if($e.status -ne 'PASS'){ throw 'DLT bootstrap plan did not PASS' }
          if($e.remote_verification -ne 'NOT_RUN_PLAN_ONLY'){ throw 'DLT plan unexpectedly performed remote verification' }
          if($e.source.schema -ne 'dlt-independent-export-v4'){ throw 'DLT schema mismatch' }
          if($e.source.source_commit -ne 'c2b0db6876d2aae874f8cf4d08f52455c8eaf152'){ throw 'DLT source SHA mismatch' }
          if($e.source.manifest_sha256 -ne 'e53373a56bd8da1948f26aaf7fae6a18a7bbfd65e44a1b1bf9d651ab72a9c87f'){ throw 'DLT manifest SHA mismatch' }
          if($e.source.sums_sha256 -ne '5ea3de9d08962e57f677882441b51de6f7022019979aa5db87888bae7422cc11'){ throw 'DLT checksum-list SHA mismatch' }
          if([int]$e.source.file_count -ne 38){ throw 'DLT file_count mismatch' }
          Get-Content "$env:RUNNER_TEMP\dlt-bootstrap-plan.json"

      - name: Download verified DLT v2.1.1 current-main baseline
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'dlt-baseline-artifact'
          gh run download 37759795496 --repo douluo511/Geometry-Lotto-Pro --name "DLT-v2.1.1-CURRENT-MAIN-BASELINE-NOT-FINAL-59d1537de23a5ea4eb8de1d9db15e530a773d85b" --dir $out
          if($LASTEXITCODE -ne 0){ throw 'DLT baseline artifact download failed' }

          $zip=Get-ChildItem -LiteralPath $out -Recurse -Filter 'dlt-v2.1.1-current-main-baseline.zip' | Select-Object -First 1
          $shaFile=Get-ChildItem -LiteralPath $out -Recurse -Filter 'dlt-v2.1.1-current-main-baseline.sha256' | Select-Object -First 1
          if(-not $zip -or -not $shaFile){ throw 'DLT baseline inner ZIP/SHA evidence missing' }

          $expected=((Get-Content -LiteralPath $shaFile.FullName -Raw).Trim().Split()[0]).ToLowerInvariant()
          $actual=(Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if($expected -ne $actual){ throw "DLT baseline inner ZIP SHA mismatch: expected=$expected actual=$actual" }
          if($actual -ne 'ed67e8227a7768be76f109247c1737f3effad7b2a319bb56e80fa73ba59f6cd3'){
            throw 'DLT baseline inner ZIP is not the verified current-main artifact'
          }

          $expanded=Join-Path $env:RUNNER_TEMP 'dlt-baseline-expanded'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $expanded -Force
          $manifest=Get-ChildItem -LiteralPath $expanded -Recurse -Filter BASELINE_MANIFEST.json | Select-Object -First 1
          if(-not $manifest){ throw 'DLT baseline manifest missing after ZIP expansion' }
          "DLT_BASELINE_EXPORT_DIR=$($manifest.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "DLT_BASELINE_ARTIFACT_DOWNLOAD=PASS"
          Write-Host "DLT_BASELINE_INNER_ZIP_SHA256=$actual"

      - name: Plan-only validate exact DLT v2.1.1 baseline seed
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\tools\bootstrap_independent_repo.ps1 `
            -ExportDir "$env:DLT_BASELINE_EXPORT_DIR" `
            -TargetRepo "douluo511/Geometry-Lotto-Pro-DLT" `
            -Visibility private `
            -ExpectedSourceCommit "c2b0db6876d2aae874f8cf4d08f52455c8eaf152" `
            -PlanOnly `
            -EvidencePath "$env:RUNNER_TEMP\dlt-baseline-bootstrap-plan.json"
          $e=Get-Content "$env:RUNNER_TEMP\dlt-baseline-bootstrap-plan.json" -Raw | ConvertFrom-Json
          if($e.status -ne 'PASS'){ throw 'DLT baseline bootstrap plan did not PASS' }
          if($e.remote_verification -ne 'NOT_RUN_PLAN_ONLY'){ throw 'DLT baseline plan unexpectedly performed remote verification' }
          if($e.source.schema -ne 'dlt-current-main-release-baseline-v2'){ throw 'DLT baseline schema mismatch' }
          if($e.source.source_commit -ne 'c2b0db6876d2aae874f8cf4d08f52455c8eaf152'){ throw 'DLT baseline source product SHA mismatch' }
          if($e.source.manifest_name -ne 'BASELINE_MANIFEST.json'){ throw 'DLT baseline manifest authority mismatch' }
          if($e.source.sums_name -ne 'BASELINE_SHA256SUMS.txt'){ throw 'DLT baseline checksum authority mismatch' }
          if($e.source.manifest_sha256 -ne 'b026ce858f1a6c4d6983cc678beb40ce091837a2bb6e8ecd85808b32da5edf8a'){ throw 'DLT baseline manifest SHA mismatch' }
          if($e.source.sums_sha256 -ne '15e337393f71ce08ef13b22f350cba9491bbe5611de18b931c1c4ee3c88ae30b'){ throw 'DLT baseline checksum-list SHA mismatch' }
          if([int]$e.source.file_count -ne 38){ throw 'DLT baseline file_count mismatch' }
          Get-Content "$env:RUNNER_TEMP\dlt-baseline-bootstrap-plan.json"

      - name: Upload plan-only bootstrap evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-seed-bootstrap-plan-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/ssq-bootstrap-plan.json
            ${{ runner.temp }}/dlt-bootstrap-plan.json
            ${{ runner.temp }}/dlt-baseline-bootstrap-plan.json
          if-no-files-found: error
          retention-days: 30
