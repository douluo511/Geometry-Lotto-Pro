name: Stock PIT impossible BSE dates - PRODUCT fail first
on:
  push:
    branches: [fix/stock-pit-bse-impossible-historical-dates-20261008, fix/stock-bse-new-ipo-920-before-2025-20261008]
    paths:
      - "StockAIPro/staging/Stock_AI_Pro/versions/4.3.0/stock_ai/historical_pit.py"
      - "StockAIPro/hardening_tests/historical_bse_market_date_boundary_test.py"
      - ".github/workflows/stock-bse-early-market-boundary-product.yml"
  pull_request:
    paths:
      - "StockAIPro/staging/Stock_AI_Pro/versions/4.3.0/stock_ai/historical_pit.py"
      - "StockAIPro/hardening_tests/historical_bse_market_date_boundary_test.py"
      - ".github/workflows/stock-bse-early-market-boundary-product.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  product-bse-impossible-day-failfirst:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout EXACT source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Bind original product authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor 9969490c89ccb4cc10536f66416976c5bf40caef HEAD
          echo "STOCK_PRODUCTION_CODE_CHANGE_REQUIRES_NEW_FULL_RELEASE_VALIDATION"
      - name: Python 3.11.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - name: Check source compilation
        run: python -m py_compile StockAIPro/staging/Stock_AI_Pro/versions/4.3.0/stock_ai/historical_pit.py StockAIPro/hardening_tests/historical_bse_market_date_boundary_test.py
      - name: Determine exact two-stage candidate manifest SHA plan without touching recovered archive
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          base=Path("StockAIPro/staging/Stock_AI_Pro")
          code=base/"versions/4.3.0/stock_ai/historical_pit.py"
          inner=base/"versions/4.3.0/PACKAGE_MANIFEST.json"
          outer=base/"PACKAGE_MANIFEST.json"
          H=lambda b:hashlib.sha256(b).hexdigest()
          old="668b93bcbe55181b0c84268464768031cc66bb3410c98b47e531cec619bc9063"
          current=H(code.read_bytes())
          print("CURRENT_BSE_NEW_ISSUE_STAGED_CODE_SHA256="+current, flush=True)
          inner_text=inner.read_text(encoding="utf-8")
          outer_text=outer.read_text(encoding="utf-8")
          old_inner=H(inner.read_bytes())
          print("CURRENT_BSE_NEW_ISSUE_NESTED_MANIFEST_SHA256="+old_inner, flush=True)
          expected_outer_hash='5d82e07a2ec6915427bda880b2fd8e1a5596e45f5713ae36f10253496cc27612'
          if old_inner!=expected_outer_hash and old_inner not in outer_text:
              raise RuntimeError("nested staging manifest is not bound to root manifest")
          projected=inner_text.replace('"stock_ai/historical_pit.py": "'+old+'"',
              '"stock_ai/historical_pit.py": "'+current+'"')
          if projected==inner_text and current!=old:
              # After the candidate manifest has been explicitly committed,
              # verify it already binds the changed source rather than
              # demanding the obsolete previous manifest entry.
              if '"stock_ai/historical_pit.py": "'+current+'"' not in inner_text:
                  raise RuntimeError("staging manifest neither old nor re-bound")
          projected_hash=H(projected.encode("utf-8"))
          print("STOCK_STAGED_CODE_SHA256="+current)
          print("STOCK_STAGED_NESTED_MANIFEST_AFTER_PROPOSED_UPDATE_SHA256="+projected_hash)
          print("STOCK_STAGED_NESTED_CURRENT_SHA256="+old_inner)
          print("STOCK_ORIGINAL_IMMUTABLE_ARCHIVE_UNTOUCHED=true")
          PY
      - name: Verify first-party BSE 2024 new-issue code authority and original 920002 listing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,html,json,re,urllib.request
          from pathlib import Path
          from urllib.parse import urlparse
          original={
              "first_new_issue_920_rule":"https://www.bse.cn/important_news/200021617.html",
              "real_2024_920002_listing":"https://www.bse.cn/issue_report_meeting/200021986.html",
          }
          required={
              "first_new_issue_920_rule":("2024年4月22日","920","发行人"),
              "real_2024_920002_listing":("2024年5月30日","920002","万达轴承"),
          }
          out=Path("stock_bse_official_2024_new_920_source");out.mkdir(exist_ok=True)
          ledger={}
          for key,url in original.items():
              request=urllib.request.Request(url,headers={
                  "User-Agent":"Mozilla/5.0","Accept":"text/html"})
              with urllib.request.urlopen(request,timeout=35) as reply:
                  raw=reply.read(3000001)
                  resolved=reply.geturl()
                  if reply.status!=200 or resolved!=url or len(raw)==0 or len(raw)>3000000:
                      raise RuntimeError("first-party 2024 source not authentic: "+key)
              page=html.unescape(re.sub(r"<[^>]*>","",raw.decode("utf-8","strict")))
              compact=re.sub(r"\s+","",page)
              for phrase in required[key]:
                  if phrase not in compact:
                      raise RuntimeError("missing exact original BSE rule/listed issuer: "+key+" "+phrase)
              out.joinpath(key+".html").write_bytes(raw)
              ledger[key]={"url":url,"http_status":200,"raw_sha256":hashlib.sha256(raw).hexdigest(),
                           "required_native_phrases":required[key],"scope":"FIRST_PARTY_EXCHANGE_TEXT_ONLY"}
          ledger["historic_full_daily_PIT"]="NOT VERIFIED"
          ledger["final_gate"]="FAIL"
          out.joinpath("source_ledger.json").write_text(
              json.dumps(ledger,ensure_ascii=False,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          print("BSE_2024_ACTUAL_FIRST_PARTY_NEW_920_AND_920002_LISTING=PASS")
          PY
      - name: Verify staging SHA256 bindings for changed product and nested candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          base=Path("StockAIPro/staging/Stock_AI_Pro")
          nested=base/"versions/4.3.0/PACKAGE_MANIFEST.json"
          source=base/"versions/4.3.0/stock_ai/historical_pit.py"
          outer=json.loads((base/"PACKAGE_MANIFEST.json").read_text(encoding="utf-8"))
          inner=json.loads(nested.read_text(encoding="utf-8"))
          digest=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          actual=digest(source)
          assert inner["files"]["stock_ai/historical_pit.py"]==actual
          assert outer["files"]["versions/4.3.0/stock_ai/historical_pit.py"]==actual
          assert outer["files"]["versions/4.3.0/PACKAGE_MANIFEST.json"]==digest(nested)
          print("STOCK_STAGED_PRODUCT_SOURCE_AND_TWO_MANIFEST_SHA_BINDINGS=PASS")
          PY
      - name: Run thirteen actual false-PASS business counterexamples
        run: python StockAIPro/hardening_tests/historical_bse_market_date_boundary_test.py
      - name: Run existing full historical PIT contract
        run: python StockAIPro/hardening_tests/historical_st_pit_contract_test.py
      - name: Preserve strict product Final nonqualification until full chain
        if: always()
        run: |
          echo "BSE_DATE_BOUNDARY_TEST_STATUS=PER_EXACT_HEAD_CI"
          echo "BSE_ACTUAL_HISTORICAL_SOURCE_BYTES=NOT VERIFIED"
          echo "SSE_SZSE_BSE_COMPLETE_BUSINESS=NOT VERIFIED"
          echo "WINDOWS_EXACT_EXE_GUI_SAME_HASH=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"

      - name: Preserve exact first-party 2024 source bytes, but no historic PIT
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-BSE-REAL-2024-NEW-ISSUE-SOURCE-${{ github.event.pull_request.head.sha || github.sha }}
          path: stock_bse_official_2024_new_920_source/
          if-no-files-found: warn
          retention-days: 30
