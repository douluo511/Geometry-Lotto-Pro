name: Head Intelligence Hard-Gate Windows Release

on:
  push:
    branches:
      - head-intelligence-prototype
      - main
    paths:
      - "head_intelligence/**"
      - ".github/workflows/head-intelligence-windows.yml"
      - ".github/scripts/physical_gui_click_smoke.ps1"
      - ".github/scripts/head_physical_gui_click_smoke.ps1"
      - ".github/scripts/tk_button_points.py"
  pull_request:
    branches:
      - main
    paths:
      - "head_intelligence/**"
      - ".github/workflows/head-intelligence-windows.yml"
      - ".github/scripts/physical_gui_click_smoke.ps1"
      - ".github/scripts/head_physical_gui_click_smoke.ps1"
      - ".github/scripts/tk_button_points.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hard-gate:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      HEAD_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      HEAD_INTELLIGENCE_DATA_DIR: ${{ github.workspace }}/evidence/gui-data
      PYTHONHASHSEED: '1'
      SOURCE_DATE_EPOCH: '946684800'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SOURCE_SHA }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          architecture: x64
          cache: pip
          cache-dependency-path: head_intelligence/requirements-build.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r head_intelligence/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw "dependency install failed" }
          $actual=(& git rev-parse HEAD).Trim()
          if ($actual -ne $env:HEAD_SOURCE_SHA) { throw "source checkout mismatch" }
          New-Item -ItemType Directory -Force evidence | Out-Null
          New-Item -ItemType Directory -Force final | Out-Null

      - name: Dedicated repository inventory evidence
        shell: pwsh
        run: |
          python -m head_intelligence.repository_independence_gate --out evidence/repository_independence.json
          if ($LASTEXITCODE -ne 0) { throw "repository inventory invalid" }

      - name: Architecture and code completeness
        shell: pwsh
        run: |
          python -m compileall -q head_intelligence
          if ($LASTEXITCODE -ne 0) { throw "compile gate failed" }
          python -m head_intelligence.gate_evidence --gate architecture --out evidence/process-gates/architecture.json --proof-json head_intelligence/architecture_gate.json -- python head_intelligence/architecture_gate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Business Content Gate
        shell: pwsh
        run: |
          python -m head_intelligence.gate_evidence --gate business_content --out evidence/process-gates/business_content.json --proof-json head_intelligence/business_gate.json -- python -m head_intelligence.business_gate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Unit Test
        shell: pwsh
        run: |
          python -m head_intelligence.gate_evidence --gate unit_test --out evidence/process-gates/unit_test.json -- python -m pytest -q head_intelligence/tests/test_engine.py head_intelligence/tests/test_release_gate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Contract Test
        shell: pwsh
        run: |
          python -m head_intelligence.gate_evidence --gate contract_test --out evidence/process-gates/contract_test.json -- python -m pytest -q head_intelligence/tests/test_contracts.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Integration Test
        shell: pwsh
        run: |
          python -m head_intelligence.gate_evidence --gate integration_test --out evidence/process-gates/integration_test.json -- python -m pytest -q head_intelligence/tests/test_integration.py head_intelligence/tests/test_software_update.py head_intelligence/tests/test_repair_update_gui.py head_intelligence/tests/test_gui_evidence.py head_intelligence/tests/test_official_release.py head_intelligence/tests/test_gate_evidence.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fault Injection
        shell: pwsh
        run: |
          python -m head_intelligence.gate_evidence --gate fault_injection --out evidence/process-gates/fault_injection.json -- python -m pytest -q head_intelligence/tests/test_fault_injection.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Independent Updater integration rollback and restart recovery
        shell: pwsh
        run: |
          python -m head_intelligence.updater_gate --output evidence/updater_gate.json
          if ($LASTEXITCODE -ne 0) { throw "updater rollback gate failed" }

      - name: Business Validation
        shell: pwsh
        run: |
          python -m head_intelligence.gate_evidence --gate business_validation --out evidence/process-gates/business_validation.json -- python -m pytest -q head_intelligence/tests/test_business_validation.py -k business_core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Counterexample Validation
        shell: pwsh
        run: |
          python -m head_intelligence.gate_evidence --gate counterexample_validation --out evidence/process-gates/counterexample_validation.json -- python -m pytest -q head_intelligence/tests/test_business_validation.py -k counterexample
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Reversal Validation
        shell: pwsh
        run: |
          python -m head_intelligence.gate_evidence --gate reversal_validation --out evidence/process-gates/reversal_validation.json -- python -m pytest -q head_intelligence/tests/test_business_validation.py -k reversal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Python Self-Test
        shell: pwsh
        run: |
          python -m head_intelligence.gate_evidence --gate self_test --out evidence/process-gates/self_test.json -- python -m head_intelligence.app --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Real Network
        shell: pwsh
        run: |
          python -m head_intelligence.gate_evidence --gate real_network --out evidence/process-gates/real_network.json -- python -m head_intelligence.app --network-smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows Build
        shell: pwsh
        run: |
          python -c "import tkinter; interpreter=tkinter.Tcl(); assert interpreter.eval('info patchlevel')"
          if ($LASTEXITCODE -ne 0) { throw "Tcl runtime is broken; Tk main EXE cannot be built" }
          python -m head_intelligence.gate_evidence --gate windows_build --out evidence/process-gates/windows_build.json --artifact dist/HeadIntelligence.exe -- pyinstaller --noconfirm --clean --noupx --onefile --windowed --paths . --name HeadIntelligence head_intelligence/app.py
          if ($LASTEXITCODE -ne 0) { throw "main build failed" }
          python -m head_intelligence.gate_evidence --gate updater_build --out evidence/process-gates/updater_build.json --artifact dist/HeadIntelligence_Updater.exe -- pyinstaller --noconfirm --clean --noupx --onefile --windowed --paths . --name HeadIntelligence_Updater head_intelligence/updater_entry.py
          if ($LASTEXITCODE -ne 0) { throw "Updater build failed" }
          if (-not (Test-Path .\dist\HeadIntelligence_Updater.exe)) { throw "Updater EXE missing" }
          if (-not (Test-Path .\dist\HeadIntelligence.exe)) { throw "EXE not produced" }

      - name: Exact EXE Self-Test
        shell: pwsh
        run: |
          python -m head_intelligence.gate_evidence --gate exact_exe --out evidence/process-gates/exact_exe.json --artifact dist/HeadIntelligence.exe --proof-json evidence/main_exe_self_test.json -- .\dist\HeadIntelligence.exe --self-test --result-file evidence/main_exe_self_test.json
          if ($LASTEXITCODE -ne 0) { throw "exact main self-test failed" }
          $self=Get-Content evidence/main_exe_self_test.json -Raw | ConvertFrom-Json
          if ($self.schema -ne 'head-intelligence-main-self-test-v1' -or $self.application -ne 'HeadIntelligence' -or $self.version -ne '0.4.0') { throw "main self-test type/version invalid" }

      - name: Exact independent Updater self-test
        shell: pwsh
        run: |
          python -m head_intelligence.gate_evidence --gate updater_exact_exe --out evidence/process-gates/updater_exact_exe.json --artifact dist/HeadIntelligence_Updater.exe --proof-json evidence/updater_exe_self_test.json -- .\dist\HeadIntelligence_Updater.exe --self-test --evidence-file evidence/updater_exe_self_test.json
          if ($LASTEXITCODE -ne 0) { throw "exact independent Updater self-test failed" }
          $self=Get-Content evidence/updater_exe_self_test.json -Raw | ConvertFrom-Json
          if ($self.schema -ne 'head-intelligence-updater-self-test-v1') { throw "Updater self-test type invalid" }

      - name: Exact main EXE real network evidence
        shell: pwsh
        run: |
          $p=Start-Process -FilePath .\dist\HeadIntelligence.exe -ArgumentList @('--network-smoke-test','--result-file','evidence/main_exe_network.json') -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw "exact main EXE real network failed" }
          $network=Get-Content evidence/main_exe_network.json -Raw | ConvertFrom-Json
          $main=(Get-FileHash dist/HeadIntelligence.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($network.schema -ne 'head-intelligence-exact-network-v1' -or $network.status -ne 'PASS' -or $network.main_exe_sha256 -ne $main -or $network.deduped_count -lt 1) { throw "exact network evidence invalid" }

      - name: GUI Smoke
        shell: pwsh
        run: |
          python -m head_intelligence.gate_evidence --gate gui_smoke --out evidence/process-gates/gui_smoke.json --artifact dist/HeadIntelligence.exe -- .\dist\HeadIntelligence.exe --gui-smoke
          if ($LASTEXITCODE -ne 0) { throw "exact GUI construction smoke failed" }

      - name: Stage unique final EXE
        shell: pwsh
        run: |
          Copy-Item .\dist\HeadIntelligence.exe .\final\HeadIntelligence.exe -Force
          Copy-Item .\dist\HeadIntelligence_Updater.exe .\final\HeadIntelligence_Updater.exe -Force

      - name: Same Hash
        shell: pwsh
        run: |
          $candidate = (Get-FileHash .\dist\HeadIntelligence.exe -Algorithm SHA256).Hash.ToLower()
          $final = (Get-FileHash .\final\HeadIntelligence.exe -Algorithm SHA256).Hash.ToLower()
          if ($candidate -ne $final) { throw "Same-hash gate failed" }
          python -m head_intelligence.gate_evidence --gate same_hash --out evidence/process-gates/same_hash.json --artifact dist/HeadIntelligence.exe --compare final/HeadIntelligence.exe
          if ($LASTEXITCODE -ne 0) { throw "typed Same Hash receipt failed" }
          "sha256=$final" | Out-File .\final\BUILD_HASH.txt -Encoding ascii
          "commit=$env:HEAD_SOURCE_SHA" | Add-Content .\final\BUILD_HASH.txt
          "workflow_run=${{ github.run_id }}" | Add-Content .\final\BUILD_HASH.txt

      - name: Final EXE Self-Test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\final\HeadIntelligence.exe -ArgumentList "--self-test" -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: Final GUI Smoke
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\final\HeadIntelligence.exe -ArgumentList "--gui-smoke" -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: Physical GUI Click Smoke
        shell: pwsh
        run: |
          $operationPath=Join-Path $env:HEAD_INTELLIGENCE_DATA_DIR 'physical_gui_operations.json'
          if (Test-Path -LiteralPath $operationPath) { Remove-Item -LiteralPath $operationPath -Force }
          python .\.github\scripts\tk_button_points.py --project-path . --module head_intelligence.app --entry HeadIntelligenceApp --labels "信息判断;一键更新;一键修复;高级分析" --out ".\evidence\gui_points.txt"
          $points=(Get-Content ".\evidence\gui_points.txt" -Raw).Trim()
          .\.github\scripts\head_physical_gui_click_smoke.ps1 -DataDirectory "$env:HEAD_INTELLIGENCE_DATA_DIR" -ExePath ".\final\HeadIntelligence.exe" -Points $points -PreconditionIndex 3 -EvidencePath ".\evidence\physical_gui_click.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m head_intelligence.gate_evidence --gate physical_gui_click --out evidence/process-gates/physical_gui_click.json --artifact final/HeadIntelligence.exe -- python -m head_intelligence.bind_physical_gui --exe ".\final\HeadIntelligence.exe" --evidence ".\evidence\physical_gui_click.json" --marker ".\evidence\physical_gui_click.pass" --operation-evidence "$env:HEAD_INTELLIGENCE_DATA_DIR/physical_gui_operations.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Post-physical-GUI main and Updater Same Hash
        shell: pwsh
        run: |
          $main=(Get-FileHash dist/HeadIntelligence.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $mainFinal=(Get-FileHash final/HeadIntelligence.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $updater=(Get-FileHash dist/HeadIntelligence_Updater.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $updaterFinal=(Get-FileHash final/HeadIntelligence_Updater.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($main -ne $mainFinal -or $updater -ne $updaterFinal) { throw "post-GUI Same Hash failed" }
          $self=Get-Content evidence/updater_exe_self_test.json -Raw | ConvertFrom-Json
          if ($self.status -ne 'PASS') { throw "Updater self-test is not PASS" }
          @{schema='head-intelligence-updater-windows-gate-v1';status='PASS';github_sha=$env:HEAD_SOURCE_SHA;workflow_run=$env:GITHUB_RUN_ID;updater_exact_exe='PASS';updater_exe_sha256=$updater;final_updater_sha256=$updaterFinal;same_hash=$true;self_test=$self} | ConvertTo-Json -Depth 8 | Set-Content evidence/updater_windows_gate.json -Encoding utf8

      - name: Real independent software Release N to N+1 evidence
        shell: pwsh
        run: |
          $args=@('-m','head_intelligence.software_release_gate','--repository','${{ github.repository }}','--source-sha',$env:HEAD_SOURCE_SHA,'--output','evidence/software_release_validation.json')
          if (Test-Path 'evidence/real_software_update.json') { $args += @('--input','evidence/real_software_update.json') }
          python @args
          if ($LASTEXITCODE -ne 0) { throw "invalid real release evidence" }

      - name: Evidence-derived Final Gate
        shell: pwsh
        run: |
          python -m head_intelligence.collect_final_gates --evidence-dir evidence --architecture head_intelligence/architecture_gate.json --business head_intelligence/business_gate.json --candidate-exe dist/HeadIntelligence.exe --final-exe final/HeadIntelligence.exe --physical-gui evidence/physical_gui_click.json --source-sha "$env:HEAD_SOURCE_SHA" --out evidence/gate_input.json
          $collectorExit=$LASTEXITCODE
          python -m head_intelligence.release_gate --evidence-dir evidence --candidate-exe dist/HeadIntelligence.exe --final-exe final/HeadIntelligence.exe --gate-input evidence/gate_input.json --out evidence/final_gate.json
          $releaseExit=$LASTEXITCODE
          $final=Get-Content evidence/final_gate.json -Raw | ConvertFrom-Json
          if ($collectorExit -ne 0 -or $releaseExit -ne 0 -or $final.final_gate -ne "PASS" -or [int]$final.hard_fail_count -ne 0) { throw "Final Gate blocked: independent repository is mandatory" }

      - name: Upload unique passing artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeadIntelligence-FINAL-v0.4.0
          path: |
            final/HeadIntelligence.exe
            final/HeadIntelligence_Updater.exe
            final/BUILD_HASH.txt
            evidence/final_gate.json
            evidence/gate_input.json
            evidence/physical_gui_click.json
            evidence/physical-gui-screens/*.png
            head_intelligence/architecture_gate.json
            head_intelligence/business_gate.json
            head_intelligence/ARCHITECTURE.md
            head_intelligence/ENGINEERING_SPEC.md
            head_intelligence/BUSINESS_SPEC.md
          if-no-files-found: error
          retention-days: 30


      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HeadIntelligence-AUDIT-updater-hardening
          path: |
            evidence/process-gates/*.json
            evidence/repository_independence.json
            evidence/updater_gate.json
            evidence/updater_exe_self_test.json
            evidence/main_exe_self_test.json
            evidence/main_exe_network.json
            evidence/updater_windows_gate.json
            evidence/software_release_validation.json
            evidence/gui-data/repair_evidence.json
            evidence/gui-data/physical_gui_operations.json
            evidence/physical-gui-screens/*.png
            evidence/gate_input.json
            evidence/final_gate.json
            evidence/physical_gui_click.json
            head_intelligence/architecture_gate.json
            head_intelligence/business_gate.json
          if-no-files-found: warn
          retention-days: 90
