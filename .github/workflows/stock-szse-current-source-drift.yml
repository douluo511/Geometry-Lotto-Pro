name: Stock SZSE current-vs-historical raw bytes - fail closed
on:
  push:
    branches:
      - diagnostic/stock-pit-current-source-drift-20261008
    paths:
      - ".github/stock_diag/stock_szse_current_source_drift.py"
      - ".github/stock_diag/test_stock_szse_current_source_drift.py"
      - ".github/workflows/stock-szse-current-source-drift.yml"
  pull_request:
    paths:
      - ".github/stock_diag/stock_szse_current_source_drift.py"
      - ".github/stock_diag/test_stock_szse_current_source_drift.py"
      - ".github/workflows/stock-szse-current-source-drift.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare-current-official-bytes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source diagnostic
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Prove no Stock product-byte changes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor 9969490c89ccb4cc10536f66416976c5bf40caef HEAD
          test -z "$(git diff --name-only 9969490c89ccb4cc10536f66416976c5bf40caef..HEAD -- StockAIPro)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - name: Falsify stale source promotion and denominator drift
        run: python .github/stock_diag/test_stock_szse_current_source_drift.py
      - name: Pin historical date claims exact old first-party artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/11533993962/zip" \
            -o previous_claims.zip
          echo "4f388eaa85739faa764dba554f1883756b17a3136a39f955183a4c325ffb82d4  previous_claims.zip" | sha256sum -c
          unzip -oq previous_claims.zip
          test -f stock_szse_effective_event_candidates.json
      - name: Pin real current 19-shard full raw-source merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/11534340886/zip" \
            -o current_source.zip
          echo "90d25b1d9fd81c02f6aa04764303fd8128bca4def01f0859f0099a4c3ad6dbac  current_source.zip" | sha256sum -c
          unzip -oq current_source.zip
          test -f szse_1849_merged_source.json
      - name: Reject stale historical source snapshots if current raw bytes differ
        run: |
          python .github/stock_diag/stock_szse_current_source_drift.py \
            --historical stock_szse_effective_event_candidates.json \
            --fresh szse_1849_merged_source.json \
            --out stock_szse_source_drift_evidence.json
      - name: Store drift ledger, even if exact raw equivalence fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-SZSE-CURRENT-SOURCE-BYTE-DRIFT-${{ github.event.pull_request.head.sha || github.sha }}
          path: stock_szse_source_drift_evidence.json
          if-no-files-found: warn
          retention-days: 30
