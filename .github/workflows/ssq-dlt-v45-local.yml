name: SSQ DLT V4.5 local research acceptance
on:
  pull_request:
    paths: ["research/ssq_dlt_v45/**", ".github/workflows/ssq-dlt-v45-local.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-component-tests:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r research/ssq_dlt_d2_v44/requirements-test.txt
      - run: python -m research.ssq_dlt_v45.acceptance --output acceptance-v45
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v45-local-component-evidence
          path: acceptance-v45
