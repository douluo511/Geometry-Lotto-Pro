name: V4.7 eleven-model research checks
on:
  pull_request:
    paths:
      - 'research/supercompute/v47_*.py'
      - 'research/supercompute/tests/test_v47_models.py'
      - 'research/supercompute/tests/test_v47_integrated.py'
      - 'research/supercompute/tests/test_v47_registry.py'
      - 'research/supercompute/tests/test_v47_merge_history.py'
      - 'research/supercompute/data/v47_20261114_draw_delta.json'
      - '.github/workflows/v47-model-lab-ci.yml'
      - 'research/supercompute/automation/v47_schedule.py'
      - 'research/supercompute/tests/test_v47_schedule.py'
      - '.github/workflows/v47-model-lab-scheduled.yml'
      - '.github/workflows/v47-model-lab-audit.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/v47-model-lab-ci.yml'
      - 'research/supercompute/v47_execution_evidence.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile research modules
        run: python -m compileall -q research/supercompute/v47_models.py research/supercompute/v47_cli.py
      - name: Run synthetic acceptance tests
        run: python -m unittest discover -s research/supercompute/tests -p 'test_v47_models.py' -v
      - name: Run existing independent CPU research tests
        run: python -m unittest discover -s research/supercompute/tests -p 'test_supercompute.py' -v
      - name: Validate unattended schedule evidence logic
        run: python -m unittest discover -s research/supercompute/tests -p 'test_v47_schedule.py' -v
      - name: Eleven independently fitted model object contracts
        run: python -m unittest discover -s research/supercompute/tests -p 'test_v47_registry.py' -v
      - name: Verify current provenance-aware history merger
        run: python -m unittest discover -s research/supercompute/tests -p 'test_v47_merge_history.py' -v
      - name: Unified 11-stage integration acceptance
        run: python -m unittest discover -s research/supercompute/tests -p 'test_v47_integrated.py' -v
      - name: Historical repository snapshot end-to-end smoke
        run: |
          python -m research.supercompute.v47_cli run --game both --periods 2 --trials 100 --seed 2026 --output /tmp/v47-historical-smoke.json
          python -c "import json; x=json.load(open('/tmp/v47-historical-smoke.json')); assert x['edge']=='NO_EDGE' and set(x['games'])=={'ssq','dlt'}; assert all(g['models']['strictly_past_only'] and g['models']['edge']=='NO_EDGE' for g in x['games'].values()); print('Historical snapshots smoke PASS; NO_EDGE')"

      - name: Next-candidate unified historical snapshot smoke
        run: |
          python -m research.supercompute.v47_forecast generate --game both --ssq-target UNVERIFIED_RESEARCH_NEXT_SSQ --dlt-target UNVERIFIED_RESEARCH_NEXT_DLT --generations 1 --validation 3 --holdout 2 --mc-trials 30 --physics-steps 3 --seed 2026 --output /tmp/v47-unified-11.json
          python -c "import json; p=json.load(open('/tmp/v47-unified-11.json')); assert all(len(v['requirement_modules']) == 11 and len(v['proposed_tickets']) == 11 and v['ticket_count'] == 11 and v['edge'] == 'NO_EDGE' and v['independent_11']['model_count'] == 11 and all(x['status'] == 'EXECUTED' for x in v['independent_11']['models'].values()) for v in p['games'].values()); assert sum(g['ticket_count'] for g in p['games'].values()) == 22; print('Twenty-two model tickets smoke PASS')"

      - name: Rebuild gap-free research snapshot through currently published issues
        run: python -m research.supercompute.v47_merge_history --output-dir "$RUNNER_TEMP/v47-current"
      - name: Execute eleven independent models for issue targets and create frozen receipts
        shell: bash
        run: |
          set -euo pipefail
          python -m research.supercompute.v47_forecast generate \
            --game both \
            --ssq-data "$RUNNER_TEMP/v47-current/ssq-merged-history.json" \
            --dlt-data "$RUNNER_TEMP/v47-current/dlt-merged-history.json" \
            --ssq-target 2026131 \
            --dlt-target 26130 \
            --seed 20261114 --generations 2 --validation 6 \
            --holdout 3 --mc-trials 1000 --physics-steps 80 \
            --output "$RUNNER_TEMP/v47-executed-11.json" \
            --freeze-dir "$RUNNER_TEMP/v47-frozen"
          python -m research.supercompute.v47_execution_evidence \
            --report "$RUNNER_TEMP/v47-executed-11.json" \
            --frozen-dir "$RUNNER_TEMP/v47-frozen" \
            --ssq-target 2026131 --dlt-target 26130 \
            --ssq-public-latest 2026130 \
            --dlt-public-latest 26129 \
            --output "$RUNNER_TEMP/v47-execution-evidence.json"
      - name: Verify cross-run inherited champion with two actual completed computations
        shell: bash
        run: |
          set -euo pipefail
          python -m research.supercompute.v47_forecast generate \
            --game both \
            --ssq-data "$RUNNER_TEMP/v47-current/ssq-merged-history.json" \
            --dlt-data "$RUNNER_TEMP/v47-current/dlt-merged-history.json" \
            --previous "$RUNNER_TEMP/v47-executed-11.json" \
            --ssq-target 2026131 --dlt-target 26130 \
            --seed 20261115 --generations 1 --validation 3 \
            --holdout 2 --mc-trials 30 --physics-steps 3 \
            --output "$RUNNER_TEMP/v47-cross-run-inherited.json"
          python -c "import json,sys; a=json.load(open(sys.argv[1])); b=json.load(open(sys.argv[2])); assert all(b['games'][g]['independent_11']['models']['Challenger']['fit']['inherited'] and b['games'][g]['evolution']['inherited_parent_present_in_initial_population'] and b['games'][g]['evolution']['inherited_champion_id']==a['games'][g]['evolution']['champion_id'] for g in ('ssq','dlt')); print('CROSS_RUN_GENOME_INHERITANCE_PASS')" "$RUNNER_TEMP/v47-executed-11.json" "$RUNNER_TEMP/v47-cross-run-inherited.json"
      - name: Persist complete research output, eleven-model traces, and frozen SHA256 receipts
        uses: actions/upload-artifact@v4
        with:
          name: v47-twenty-two-model-tickets-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/v47-executed-11.json
            ${{ runner.temp }}/v47-execution-evidence.json
            ${{ runner.temp }}/v47-current/merge-receipt.json
            ${{ runner.temp }}/v47-cross-run-inherited.json
            ${{ runner.temp }}/v47-frozen/
          retention-days: 90
          if-no-files-found: error
