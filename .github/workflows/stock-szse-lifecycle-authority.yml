name: Stock SZSE native lifecycle authority diagnostic

on:
  push:
    branches:
      - diagnostic/stock-szse-lifecycle-authority-20261006-v1
  pull_request:
    paths:
      - ".github/stock_diag/szse_lifecycle_authority_probe.py"
      - ".github/workflows/stock-szse-lifecycle-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  szse-lifecycle-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout and unchanged Stock product bytes
        shell: bash
        run: |
          set -euo pipefail
          exact="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$exact"
          authority="e67eaa9cabc34728fee3549262a2f1535d7e8383"
          test -z "$(git diff --name-only "$authority"..HEAD -- StockAIPro)"
          echo "STOCK_PRODUCT_TREE_BYTE_IDENTITY=PASS"

      - name: Setup pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false

      - name: Install pinned XLSX parser
        run: python -m pip install --disable-pip-version-check --no-input "openpyxl==3.1.5"

      - name: Run first-party SZSE lifecycle authority diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stock_szse_raw"
          python .github/stock_diag/szse_lifecycle_authority_probe.py \
            --output "$RUNNER_TEMP/stock_szse_lifecycle_authority.json" \
            --raw-dir "$RUNNER_TEMP/stock_szse_raw"

      - name: Upload exact raw/evidence bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-SZSE-LIFECYCLE-AUTHORITY-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/stock_szse_lifecycle_authority.json
            ${{ runner.temp }}/stock_szse_raw/**
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve strict boundary
        if: always()
        shell: bash
        run: |
          echo "SZSE_HISTORICAL_PIT_AVAILABILITY=NOT VERIFIED"
          echo "BSE_NATIVE_LIFECYCLE_AUTHORITY=NOT VERIFIED"
          echo "FULL_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "ADVANCED_BUSINESS=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"
