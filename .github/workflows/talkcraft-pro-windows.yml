name: TalkCraft Pro Staging Full Hard-Gate Windows Release

on:
  workflow_dispatch:
  push:
    branches: [recover/talkcraft-fullcandidate-20260929, main]
    paths:
      - 'talkcraft_pro/**'
      - '.github/workflows/talkcraft-pro-windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'talkcraft_pro/**'
      - '.github/workflows/talkcraft-pro-windows.yml'

permissions:
  contents: read

jobs:
  full-release-gate:
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Python x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: 'x64'

      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r talkcraft_pro/requirements-dev.txt
          New-Item -ItemType Directory -Force evidence | Out-Null
          New-Item -ItemType Directory -Force talkcraft_pro\dist\final | Out-Null

      - name: Compile gate
        run: python -m compileall -q talkcraft_pro

      - name: Architecture mother gate
        run: python talkcraft_pro/architecture_gate.py

      - name: Business Content Gate
        run: python talkcraft_pro/business_gate.py

      - name: Source Self-Test
        shell: pwsh
        run: |
          python talkcraft_pro/app.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item evidence\self_test.pass -ItemType File | Out-Null

      - name: Unit Test
        shell: pwsh
        run: |
          python -m unittest discover -s talkcraft_pro/tests -p "test_release_gate.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item evidence\unit_tests.pass -ItemType File | Out-Null

      - name: Contract Test
        shell: pwsh
        run: |
          python -m unittest discover -s talkcraft_pro/tests -p "test_contracts.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s talkcraft_pro/tests -p "test_network_contracts.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item evidence\contract_tests.pass -ItemType File | Out-Null

      - name: Integration Test
        shell: pwsh
        run: |
          python -m unittest discover -s talkcraft_pro/tests -p "test_integration.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item evidence\integration_tests.pass -ItemType File | Out-Null

      - name: Fault Injection
        shell: pwsh
        run: |
          python -m unittest discover -s talkcraft_pro/tests -p "test_fault_injection.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item evidence\fault_injection.pass -ItemType File | Out-Null

      - name: Business Validation
        shell: pwsh
        run: |
          python -m unittest discover -s talkcraft_pro/tests -p "test_business_validation.py" -k business_core -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item evidence\business_validation.pass -ItemType File | Out-Null

      - name: Counterexample Validation
        shell: pwsh
        run: |
          python -m unittest discover -s talkcraft_pro/tests -p "test_business_validation.py" -k counterexample -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item evidence\counterexample_validation.pass -ItemType File | Out-Null

      - name: Reversal Validation
        shell: pwsh
        run: |
          python -m unittest discover -s talkcraft_pro/tests -p "test_business_validation.py" -k reversal -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item evidence\reversal_validation.pass -ItemType File | Out-Null

      - name: Source Real Network
        shell: pwsh
        run: |
          python talkcraft_pro/real_network_check.py | Tee-Object -FilePath talkcraft_pro\real_network.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item evidence\real_network.pass -ItemType File | Out-Null

      - name: Windows Build
        shell: pwsh
        run: |
          Set-Location talkcraft_pro
          pyinstaller --noconfirm --clean TalkCraftPro.spec
          if (-not (Test-Path dist\TalkCraftPro.exe)) { throw "EXE missing" }
          Set-Location ..
          New-Item evidence\windows_build.pass -ItemType File | Out-Null

      - name: Exact EXE Self-Test
        shell: pwsh
        run: |
          $p=Start-Process talkcraft_pro\dist\TalkCraftPro.exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Exact EXE self-test failed" }
          New-Item evidence\exact_exe_self_test.pass -ItemType File | Out-Null

      - name: Exact EXE Real Network
        shell: pwsh
        run: |
          $p=Start-Process talkcraft_pro\dist\TalkCraftPro.exe -ArgumentList "--update" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Exact EXE real-network update failed" }
          New-Item evidence\exact_exe_network.pass -ItemType File | Out-Null

      - name: GUI Smoke
        shell: pwsh
        run: |
          $p=Start-Process talkcraft_pro\dist\TalkCraftPro.exe -ArgumentList "--gui-smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "GUI Smoke failed" }
          New-Item evidence\gui_smoke.pass -ItemType File | Out-Null

      - name: Freeze candidate bytes
        shell: pwsh
        run: Copy-Item talkcraft_pro\dist\TalkCraftPro.exe talkcraft_pro\dist\final\TalkCraftPro.exe -Force

      - name: Same Hash
        shell: pwsh
        run: |
          $pre=(Get-FileHash talkcraft_pro\dist\TalkCraftPro.exe -Algorithm SHA256).Hash.ToLower()
          $post=(Get-FileHash talkcraft_pro\dist\final\TalkCraftPro.exe -Algorithm SHA256).Hash.ToLower()
          if ($pre -ne $post) { throw "Same Hash failed" }
          New-Item evidence\same_hash.pass -ItemType File | Out-Null
          $post | Out-File talkcraft_pro\sha256.txt -Encoding ascii

      - name: Final EXE Self-Test
        shell: pwsh
        run: |
          $p=Start-Process talkcraft_pro\dist\final\TalkCraftPro.exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Final EXE self-test failed" }

      - name: Physical GUI Click Smoke
        shell: pwsh
        run: |
          python .\.github\scripts\tk_button_points.py --project-path talkcraft_pro --module app --entry run_gui --labels "今日训练;一键更新;一键修复;高级分析" --out ".\talkcraft_pro\gui_points.txt"
          $points=(Get-Content ".\talkcraft_pro\gui_points.txt" -Raw).Trim()
          .\.github\scripts\physical_gui_click_smoke.ps1 -ExePath ".\talkcraft_pro\dist\final\TalkCraftPro.exe" -Points $points -EvidencePath ".\talkcraft_pro\physical_gui_click.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python talkcraft_pro\bind_physical_gui.py --exe ".\talkcraft_pro\dist\final\TalkCraftPro.exe" --evidence ".\talkcraft_pro\physical_gui_click.json" --marker ".\evidence\physical_gui_click.pass"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Evidence-derived Final Gate
        shell: pwsh
        run: |
          python talkcraft_pro\collect_final_gates.py --evidence-dir evidence --architecture talkcraft_pro\architecture_gate.json --business talkcraft_pro\business_gate.json --candidate-exe talkcraft_pro\dist\TalkCraftPro.exe --final-exe talkcraft_pro\dist\final\TalkCraftPro.exe --physical-gui talkcraft_pro\physical_gui_click.json --repository-independent FAIL --out talkcraft_pro\gate_input.json
          $collector=$LASTEXITCODE
          python talkcraft_pro\release_gate.py --gate-input talkcraft_pro\gate_input.json --candidate-exe talkcraft_pro\dist\TalkCraftPro.exe --final-exe talkcraft_pro\dist\final\TalkCraftPro.exe --out talkcraft_pro\final_gate.json
          $release=$LASTEXITCODE
          if (Test-Path talkcraft_pro\final_gate.json) { Get-Content talkcraft_pro\final_gate.json }
          if ($collector -ne 0 -or $release -ne 0) { throw "Final Gate blocked: independent repository is mandatory" }

      - name: Acceptance Evidence
        if: always()
        shell: pwsh
        run: |
          $hash=""
          if (Test-Path talkcraft_pro\dist\final\TalkCraftPro.exe) { $hash=(Get-FileHash talkcraft_pro\dist\final\TalkCraftPro.exe -Algorithm SHA256).Hash.ToLower() }
          $fg="FAIL"
          if (Test-Path talkcraft_pro\final_gate.json) { $r=Get-Content talkcraft_pro\final_gate.json -Raw | ConvertFrom-Json; $fg=$r.final_gate }
          @{project='TalkCraft Pro';version='1.1-reauthored-staging';artifact='TalkCraftPro.exe';sha256=$hash;source_commit=$env:GITHUB_SHA;final_gate=$fg;repository_independence='FAIL';note='Monorepo staging only; not portfolio FINAL'} | ConvertTo-Json | Set-Content talkcraft_pro\FINAL_ACCEPTANCE.json -Encoding utf8

      - name: Upload Unique Final Product
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TalkCraft_Pro_FINAL
          path: talkcraft_pro/dist/final/TalkCraftPro.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload Audit Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TalkCraft_Pro_STAGING_AUDIT
          path: |
            talkcraft_pro/final_gate.json
            talkcraft_pro/gate_input.json
            talkcraft_pro/FINAL_ACCEPTANCE.json
            talkcraft_pro/sha256.txt
            talkcraft_pro/physical_gui_click.json
            talkcraft_pro/business_gate.json
            talkcraft_pro/architecture_gate.json
            talkcraft_pro/real_network.json
            talkcraft_pro/real_network.log
          if-no-files-found: warn
          retention-days: 90
