name: Stock BSE 2024 original 920 IPO first-party witness
on:
  push:
    branches: [diagnostic/stock-bse-2024-ipo-920002-primary-witness-20261008]
  pull_request:
    paths:
      - ".github/workflows/stock-bse-2024-new-ipo-firstparty-witness.yml"
      - "StockAIPro/hardening_tests/historical_bse_market_date_boundary_test.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firstparty-2024-new-ipo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify latest product parent remains untouched
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor aed7a628119d846fcc8b8c732c291a8e741e5027 HEAD
          test -z "$(git diff --name-only aed7a628119d846fcc8b8c732c291a8e741e5027..HEAD -- StockAIPro/staging)"
      - name: Pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - name: Pin real HTTPS BSE client
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2"
      - name: Witness first-party exchange IPO rule and 920002 real listing
        run: |
          python - <<'PY'
          import hashlib,html,json,re,requests
          from pathlib import Path
          sources={
            "2024_new_920_issuance_rule":("https://www.bse.cn/important_news/200021617.html",
                                         ("2024年4月22日","920","发行人")),
            "920002_original_listed_2024":("https://www.bse.cn/issue_report_meeting/200021986.html",
                                           ("2024年5月30日","920002","万达轴承")),
          }
          out=Path("original_BSE_2024_first_party");out.mkdir(exist_ok=True)
          ledger={}
          for key,(url,phrases) in sources.items():
              response=requests.get(url,headers={"User-Agent":"Mozilla/5.0","Accept":"text/html"},
                                    timeout=(8,25),allow_redirects=True)
              raw=response.content
              if response.status_code!=200 or response.url!=url or not raw or len(raw)>3000000:
                  raise RuntimeError("ORIGINAL_SOURCE_FAIL:"+key+
                                     ":HTTP="+str(response.status_code)+":"+response.url)
              plain=html.unescape(re.sub(r"<[^>]*>","",raw.decode("utf-8","strict")))
              compact=re.sub(r"\s+","",plain)
              for phrase in phrases:
                  if phrase not in compact:
                      raise RuntimeError("FIRST_PARTY_NATIVE_PHRASE_MISSING:"+key+":"+phrase)
              out.joinpath(key+".html").write_bytes(raw)
              ledger[key]={"status":"FIRST_PARTY_SOURCE_PASS","url":url,
                  "raw_sha256":hashlib.sha256(raw).hexdigest(),
                  "first_party_terms":phrases}
          ledger["source_publication_intraday_availability"]="NOT VERIFIED"
          ledger["historical_security_master_and_daily_ST"]="NOT VERIFIED"
          ledger["final_gate"]="FAIL"
          out.joinpath("evidence.json").write_text(
              json.dumps(ledger,sort_keys=True,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8")
          print("ACTUAL_BSE_FIRST_PARTY_2024_NEW_920_AND_920002_LISTING=PASS")
          PY
      - name: Fourteen live-bounded product structural regressions
        run: python StockAIPro/hardening_tests/historical_bse_market_date_boundary_test.py
      - name: Existing PIT evidence byte/hash contract
        run: python StockAIPro/hardening_tests/historical_st_pit_contract_test.py
      - name: Exact product nested and outer manifest integrity
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          base=Path("StockAIPro/staging/Stock_AI_Pro")
          nested=base/"versions/4.3.0/PACKAGE_MANIFEST.json"
          source=base/"versions/4.3.0/stock_ai/historical_pit.py"
          outer=json.loads((base/"PACKAGE_MANIFEST.json").read_text(encoding="utf-8"))
          inner=json.loads(nested.read_text(encoding="utf-8"))
          h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert inner["files"]["stock_ai/historical_pit.py"]==h(source)
          assert outer["files"]["versions/4.3.0/stock_ai/historical_pit.py"]==h(source)
          assert outer["files"]["versions/4.3.0/PACKAGE_MANIFEST.json"]==h(nested)
          print("LATEST_PARENT_PRODUCT_TWO_MANIFEST_HASH_BINDINGS=PASS")
          print("COMPLETE_BSE_HISTORICAL_PIT=NOT VERIFIED; FINAL_GATE=FAIL")
          PY
      - name: Retain actual first-party original HTML and SHA ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-BSE-2024-IPO-PRIMARY-${{ github.event.pull_request.head.sha || github.sha }}
          path: original_BSE_2024_first_party/
          if-no-files-found: warn
          retention-days: 30
