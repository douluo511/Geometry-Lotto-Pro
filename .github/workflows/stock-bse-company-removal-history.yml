name: Stock BSE company removal-history diagnostic

on:
  push:
    branches:
      - diagnostic/stock-bse-company-removal-history-20261006
  pull_request:
    paths:
      - ".github/stock_diag/stock_bse_company_removal_history.py"
      - ".github/workflows/stock-bse-company-removal-history.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  company-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout and unchanged Stock product bytes
        shell: bash
        run: |
          set -euo pipefail
          exact="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$exact"
          authoritative="7f270b9ab58e11fd8129053a65e000c90ff9d8c1"
          git merge-base --is-ancestor "$authoritative" HEAD
          test -z "$(git diff --name-only "$authoritative"..HEAD -- StockAIPro)"
          echo "STOCK_PRODUCT_TREE_BYTE_IDENTITY=PASS"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false

      - run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2"

      - name: Exhaust known BSE warning-company type5 announcement history
        run: python .github/stock_diag/stock_bse_company_removal_history.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: STOCK-BSE-COMPANY-REMOVAL-HISTORY-${{ github.event.pull_request.head.sha || github.sha }}
          path: stock_bse_company_removal_history.json
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve strict boundary
        if: always()
        run: |
          echo "BSE_REMOVAL_EVENT_HISTORY_COMPLETE=NOT VERIFIED"
          echo "BSE_EFFECTIVE_STATE_RECONSTRUCTION=NOT VERIFIED"
          echo "BSE_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "FULL_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"
