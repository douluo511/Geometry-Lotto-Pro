name: Stock SZSE primary article DOM layout probe
on:
  push:
    branches:
      - diagnostic/stock-szse-primary-dom-layout-20261008
    paths:
      - ".github/stock_diag/stock_szse_primary_layout_probe.py"
      - ".github/workflows/stock-szse-primary-layout-probe.yml"
  pull_request:
    paths:
      - ".github/stock_diag/stock_szse_primary_layout_probe.py"
      - ".github/workflows/stock-szse-primary-layout-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-party-dom:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify Stock source byte identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor 9969490c89ccb4cc10536f66416976c5bf40caef HEAD
          test -z "$(git diff --name-only 9969490c89ccb4cc10536f66416976c5bf40caef..HEAD -- StockAIPro)"
          echo "STOCK_PRODUCT_BYTES_UNCHANGED=PASS"
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2" "beautifulsoup4==4.15.0"
      - name: Probe three frozen real official pages
        run: python .github/stock_diag/stock_szse_primary_layout_probe.py
      - name: Preserve HTML-layout diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-SZSE-PRIMARY-LAYOUT-${{ github.event.pull_request.head.sha || github.sha }}
          path: stock_szse_primary_layout_probe.json
          if-no-files-found: warn
          retention-days: 30
      - name: Keep full PIT fail-closed
        if: always()
        run: |
          echo "PRIMARY_DOM_DIAGNOSTIC_ONLY=NOT VERIFIED"
          echo "HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"
