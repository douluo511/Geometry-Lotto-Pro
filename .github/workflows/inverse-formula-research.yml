name: Inverse Formula Falsification (research only)

on:
  pull_request:
    paths:
      - 'research/inverse_formula/**'
      - 'tests/test_inverse_probe.py'
      - 'docs/superpowers/**/2026-11-11-inverse-formula-probe.md'
      - '.github/workflows/inverse-formula-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-reproduction-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Verify inverse search, past-only selection, isolation and corruption guards
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_inverse_probe.py
      - name: Emit research report (never formal V4.7 forecast)
        env:
          PYTHONPATH: .
        run: python -m research.inverse_formula.probe

      - name: Emit multi-family reverse-search and past-only walk-forward audit
        env:
          PYTHONPATH: .
        run: python -m research.inverse_formula.reverse_search
