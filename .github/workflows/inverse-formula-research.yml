name: Inverse Formula Falsification (research only)

on:
  pull_request:
    paths:
      - 'research/inverse_formula/**'
      - 'tests/test_inverse_probe.py'
      - 'tests/test_inverse_committee.py'
      - 'tests/test_inverse_experts.py'
      - 'tests/test_inverse_edge_gate.py'
      - 'tests/test_inverse_live_models.py'
      - 'tests/test_inverse_closure.py'
      - 'tests/test_one_click_council.py'
      - 'tests/test_neural_audit.py'
      - 'tests/test_tiered_budget.py'
      - 'docs/superpowers/**/2026-11-11-inverse-formula-probe.md'
      - '.github/workflows/inverse-formula-research.yml'
  workflow_dispatch:
    inputs:
      live_models:
        description: "Explicitly opt in to 12 paid OpenAI GPT model calls"
        required: true
        type: boolean
        default: false
      game:
        description: "Research game (historical fixture only)"
        required: true
        type: choice
        default: ssq
        options:
          - ssq
          - dlt

permissions:
  contents: read

jobs:
  local-reproduction-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Verify inverse search, past-only selection, isolation and corruption guards
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_inverse_probe.py tests/test_inverse_committee.py tests/test_inverse_experts.py tests/test_inverse_edge_gate.py tests/test_inverse_live_models.py tests/test_inverse_closure.py tests/test_one_click_council.py tests/test_neural_audit.py tests/test_tiered_budget.py
      - name: Emit research report (never formal V4.7 forecast)
        env:
          PYTHONPATH: .
        run: python -m research.inverse_formula.probe

      - name: Emit multi-family reverse-search and past-only walk-forward audit
        env:
          PYTHONPATH: .
        run: python -m research.inverse_formula.reverse_search

      - name: Build reusable formula catalogue and auditable ensemble replay
        env:
          PYTHONPATH: .
        run: python -m research.inverse_formula.formula_bank --out reverse-formula-audit.json

      - name: Archive research-only formula bank and decision audits
        uses: actions/upload-artifact@v4
        with:
          name: reverse-formula-bank-${{ matrix.os }}
          path: reverse-formula-audit.json
          if-no-files-found: error

      - name: Independently audit complete wins and D2 against research NULL
        env:
          PYTHONPATH: .
        run: python -m research.inverse_formula.edge_gate --out exploratory-edge-audit.json

      - name: Preserve complete-ticket and D2 falsification evidence
        uses: actions/upload-artifact@v4
        with:
          name: exploratory-edge-audit-${{ matrix.os }}
          path: exploratory-edge-audit.json
          if-no-files-found: error

      - name: Convene research-only six-role committee and output receipt
        env:
          PYTHONPATH: .
        run: python -m research.inverse_formula.committee --out inverse-committee-receipt.json

      - name: Independently invoke six pure expert functions and seal linked evidence
        env:
          PYTHONPATH: .
        run: python -m research.inverse_formula.independent_experts --limit 34 --out independent-experts-receipt.json

      - name: Archive offline independent expert receipt
        uses: actions/upload-artifact@v4
        with:
          name: independent-experts-${{ matrix.os }}
          path: independent-experts-receipt.json
          if-no-files-found: error

      - name: Research-only offline preflight and seal (zero API calls)
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          for game in ssq dlt; do
            python -m research.inverse_formula.closure preflight \
              --game "$game" \
              --history "research/inverse_formula/${game}_2026.txt" \
              --out "research-preflight-${game}.json"
            python -m research.inverse_formula.closure freeze \
              --game "$game" \
              --preflight "research-preflight-${game}.json" \
              --candidate inverse-committee-receipt.json \
              --out "research-content-seal-${game}.json"
          done

      - name: Archive offline preflight and research content seal
        uses: actions/upload-artifact@v4
        with:
          name: research-offline-closure-${{ matrix.os }}
          path: |
            research-preflight-*.json
            research-content-seal-*.json
          if-no-files-found: error

      - name: Archive committee receipts
        uses: actions/upload-artifact@v4
        with:
          name: inverse-committee-${{ matrix.os }}
          path: inverse-committee-receipt.json
          if-no-files-found: error

  cross-os-seal-integrity:
    needs: local-reproduction-only
    runs-on: ubuntu-latest
    steps:
      - name: Download Ubuntu research closure
        uses: actions/download-artifact@v4
        with:
          name: research-offline-closure-ubuntu-latest
          path: closure-ubuntu
      - name: Download Windows research closure
        uses: actions/download-artifact@v4
        with:
          name: research-offline-closure-windows-latest
          path: closure-windows
      - name: Download Ubuntu independent expert receipt
        uses: actions/download-artifact@v4
        with:
          name: independent-experts-ubuntu-latest
          path: experts-ubuntu
      - name: Download Windows independent expert receipt
        uses: actions/download-artifact@v4
        with:
          name: independent-experts-windows-latest
          path: experts-windows
      - name: Check independent expert evidence matches across operating systems
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ubuntu = json.loads((Path("experts-ubuntu") / "independent-experts-receipt.json").read_text())
          windows = json.loads((Path("experts-windows") / "independent-experts-receipt.json").read_text())
          if ubuntu != windows:
              raise SystemExit("FAIL: cross-OS independent expert evidence mismatch")
          for game in ("SSQ", "DLT"):
              summary = ubuntu[game]["simulation"]
              assert len(summary["records"]) == 6
              assert summary["research_status"] == "NO_EDGE"
              assert summary["formal_promotion_allowed"] is False
              assert summary["records"][-1]["payload"]["paid_model_calls"] == 0
              print(f"PASS {game} six-expert cross-OS receipt sha256={summary['receipt_sha256']}")
          PY

      - name: Download independent game edge audits
        uses: actions/download-artifact@v4
        with:
          pattern: exploratory-edge-audit-*
          path: edge-audits
          merge-multiple: false
      - name: Verify full-ticket and D2 edge audit is cross-OS identical
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          parent = Path("edge-audits")
          audits = [
            json.loads((parent / f"exploratory-edge-audit-{os}" /
                        "exploratory-edge-audit.json").read_text())
            for os in ("ubuntu-latest", "windows-latest")
          ]
          if audits[0] != audits[1]:
              raise SystemExit("FAIL: exploratory complete/D2 audit differs across OS")
          for game, doc in audits[0].items():
              r = doc["audit"]
              assert r["status"] == "NO_EDGE"
              assert r["independent_prospective_draws"] == 0
              assert r["formal_promotion_allowed"] is False
              assert r["research_null"]["research_null_only_not_fixed_v47"] is True
              print(f"PASS {game}: full={r['full_ticket']['hits']}/{r['evaluated_issues']} "
                    f"D2={r['d2']['hits']}/{r['evaluated_issues']} "
                    f"researchNULL={r['research_null']['d2_hits']}/{r['evaluated_issues']} "
                    f"audit_sha256={r['report_sha256']}")
          PY

      - name: Compare all canonical offline receipts across OS
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for game in ("ssq", "dlt"):
              for prefix in ("research-preflight", "research-content-seal"):
                  filename = f"{prefix}-{game}.json"
                  ubuntu = json.loads((Path("closure-ubuntu") / filename).read_text())
                  windows = json.loads((Path("closure-windows") / filename).read_text())
                  if ubuntu != windows:
                      raise SystemExit(f"FAIL cross-OS content mismatch: {filename}")
                  print(f"PASS cross-OS content: {filename} sha256={ubuntu['sha256']}")
          PY

  real-model-council:
    if: github.event_name == 'workflow_dispatch' && inputs.live_models == true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check keys without printing their values
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "::error::Missing required Actions secret: OPENAI_API_KEY"
            exit 1
          fi
      - name: Execute independently billed model calls (research only)
        env:
          PYTHONPATH: .
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SELECTED_GAME: ${{ inputs.game }}
        run: >
          python -m research.inverse_formula.live_models
          --live
          --game "$SELECTED_GAME"
          --agents research/inverse_formula/multi_provider_agents.example.json
          --out multi-model-live-receipt.json
      - name: Upload authenticated multi-model research receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: actual-multi-model-research-receipt
          path: multi-model-live-receipt.json
          if-no-files-found: error
