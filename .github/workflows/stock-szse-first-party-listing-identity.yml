name: Stock SZSE native issuer listing date first-party verification — single code
on:
  push:
    branches:
      - diagnostic/stock-szse-official-listing-dated-evidence-20261008
    paths:
      - ".github/stock_diag/stock_szse_native_listing_probe.py"
      - ".github/stock_diag/test_stock_szse_native_listing_probe.py"
      - ".github/workflows/stock-szse-first-party-listing-identity.yml"
  pull_request:
    paths:
      - ".github/stock_diag/stock_szse_native_listing_probe.py"
      - ".github/stock_diag/test_stock_szse_native_listing_probe.py"
      - ".github/workflows/stock-szse-first-party-listing-identity.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  official-dated-listing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact GitHub diagnostic commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify no Stock product bytes modified
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor 9969490c89ccb4cc10536f66416976c5bf40caef HEAD
          test -z "$(git diff --name-only 9969490c89ccb4cc10536f66416976c5bf40caef..HEAD -- StockAIPro)"
          echo "STOCK_PRODUCT_UNCHANGED=PASS"
      - name: Setup Python 3.11.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - name: Install pinned source parser
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2" "beautifulsoup4==4.15.0" "pymupdf==1.24.14"
      - name: Check 19 first-party issuer/month source and future-state counterexamples
        run: python .github/stock_diag/test_stock_szse_native_listing_probe.py
      - name: Download pinned independent 967 A+B notice candidates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/11533509405/zip" \
            -o exact_967_source_candidates.zip
          echo "450947b110c55edfcfd3a3da6b23f15020a9cc585c198a64a379c9668fe2d490  exact_967_source_candidates.zip" | sha256sum --check
          unzip -oq exact_967_source_candidates.zip
          test -f stock_szse_ashare_dated_candidate_join.json
      - name: Fetch exact SZSE issuer pre-listing PDF plus later monthly listing table
        shell: bash
        run: |
          set -euo pipefail
          python .github/stock_diag/stock_szse_native_listing_probe.py \
            --candidates stock_szse_ashare_dated_candidate_join.json \
            --out szse_001399_official_listing_source.json
      - name: Reject inferred whole-market or realized trading claims
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          test -f szse_001399_official_listing_source.json
          python - <<'PY'
          import json
          x=json.load(open("szse_001399_official_listing_source.json",encoding="utf-8"))
          assert x["issuer_claim"]["code"] == "001399"
          assert x["issuer_claim"]["listing_date_in_issuer_announcement"] == "2026-06-26"
          assert x["later_monthly_corroboration"]["listing_date"] == "2026-06-26"
          for gate in ("historical_issuer_actual_exchange_master",
                       "page_publication_timestamp_pre_signal", "realized_first_trading_session",
                       "listed_security_universe_2018_to_2026",
                       "historical_day_security_st_suspension_sse_szse_bse",
                       "production_historical_st_pit","advanced_business"):
              assert x["adjudication"][gate] == "NOT VERIFIED",gate
          assert x["adjudication"]["final_gate"]=="FAIL"
          print("ONE_OFFICIAL_ISSUER_DATED_SOURCE=PASS; MARKET_HISTORY_PIT=NOT VERIFIED; FINAL_GATE=FAIL")
          PY
      - name: Upload first-party exact raw PDF, HTML, and audit manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-SZSE-001399-SINGLE-LISTING-NOT-PIT-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            szse_001399_official_listing_source.json
            szse_001399_pdf_raw.pdf
            szse_001399_html_raw.html
          if-no-files-found: warn
          retention-days: 30
