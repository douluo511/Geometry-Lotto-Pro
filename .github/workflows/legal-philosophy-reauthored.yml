name: Legal Philosophy reauthored Windows candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'LegalPhilosophy/**'
      - '.github/workflows/legal-philosophy-reauthored.yml'

concurrency:
  group: legal-philosophy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-candidate:
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: LegalPhilosophy

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact checkout
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim()
          if($actual -ne $env:SOURCE_SHA){throw "stale checkout: $actual != $env:SOURCE_SHA"}

      - name: Setup pinned Windows Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
          architecture: 'x64'

      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Static compile
        run: python -m compileall -q app tests main.py updater_main.py

      - name: Governance architecture and denominator gate
        run: python -m tests.governance_gate

      - name: Domain interface and study-contract gate
        run: python -m tests.contract_gate

      - name: Fault injection and repair gate
        run: python -m tests.fault_injection_gate

      - name: Independent updater contract gate
        run: python -m tests.updater_contract_gate

      - name: Real authoritative network source gate
        run: python -m tests.real_network_gate

      - name: Business content qualification gate
        run: python -m tests.business_qualification_gate

      - name: Native Windows candidate build
        shell: pwsh
        run: ./build_windows.ps1

      - name: Exact EXE self-test and same-hash pre-GUI
        shell: pwsh
        run: |
          $exe=Resolve-Path ./dist/LegalPhilosophy.exe
          $before=(Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          $root=Join-Path $env:RUNNER_TEMP "legal-philosophy-selftest"
          $health=Join-Path $env:RUNNER_TEMP "legal-philosophy-health.json"
          $nonce=[guid]::NewGuid().ToString('N')
          $proc=Start-Process -FilePath $exe -ArgumentList @('--root',"$root",'--self-test','--health-report',"$health",'--health-nonce',$nonce) -Wait -PassThru
          if($proc.ExitCode -ne 0){throw "Exact EXE self-test failed rc=$($proc.ExitCode)"}
          $obj=Get-Content -Raw -LiteralPath $health|ConvertFrom-Json
          if($obj.status -ne 'PASS' -or $obj.product -ne 'LegalPhilosophy' -or $obj.source_sha -ne $env:SOURCE_SHA -or $obj.exe_sha256 -ne $before -or $obj.nonce -ne $nonce -or $obj.storage_integrity -ne 'ok'){throw "Exact EXE health identity failed"}
          $after=(Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          if($before -ne $after){throw "Exact EXE changed after self-test"}
          [ordered]@{
            status='PASS'
            source_sha=$env:SOURCE_SHA
            exe_sha256_before=$before
            exe_sha256_after=$after
            same_hash_pre_gui='PASS'
            health=$obj
          }|ConvertTo-Json -Depth 5|Set-Content -Encoding utf8 exact_exe_evidence.json

      - name: Exact independent Updater fail-closed production-context gate
        shell: pwsh
        run: |
          $updater=Resolve-Path ./dist/LegalPhilosophyUpdater.exe
          $root=Join-Path $env:RUNNER_TEMP "legal-philosophy-updater"
          New-Item -ItemType Directory -Force $root|Out-Null
          $proc=Start-Process -FilePath $updater -ArgumentList @('--root',"$root",'--self-test') -Wait -PassThru -NoNewWindow
          if($proc.ExitCode -ne 0){throw "Updater self-test failed rc=$($proc.ExitCode)"}
          $obj=Get-Content -Raw -LiteralPath (Join-Path $root 'updater_result.json')|ConvertFrom-Json
          if($obj.status -ne 'BLOCKED'){throw "missing production release context must be explicit BLOCKED"}
          [ordered]@{
            status='PASS'
            exact_updater='PASS'
            updater_sha256=(Get-FileHash -Algorithm SHA256 $updater).Hash.ToLowerInvariant()
            production_context='BLOCKED'
            reason=$obj.reason
          }|ConvertTo-Json|Set-Content -Encoding utf8 exact_updater_evidence.json

      - name: Physical GUI mouse-click gate on exact EXE
        shell: pwsh
        run: |
          $exe=Resolve-Path ./dist/LegalPhilosophy.exe
          $root=Join-Path $env:RUNNER_TEMP "legal-philosophy-gui"
          python -m tests.gui_physical_click_gate --exe $exe --root $root --evidence gui_click_evidence.json

      - name: Freeze exact-head candidate manifest
        if: always()
        run: python -m tests.collect_candidate_evidence

      - name: Upload diagnostic candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Legal-Philosophy-reauthored-${{ env.SOURCE_SHA }}
          path: |
            LegalPhilosophy/dist/LegalPhilosophy.exe
            LegalPhilosophy/dist/LegalPhilosophyUpdater.exe
            LegalPhilosophy/ACCEPTANCE_CONTRACT.json
            LegalPhilosophy/GOVERNANCE_SPEC.json
            LegalPhilosophy/governance_evidence.json
            LegalPhilosophy/contract_evidence.json
            LegalPhilosophy/fault_injection_evidence.json
            LegalPhilosophy/updater_contract_evidence.json
            LegalPhilosophy/real_network_evidence.json
            LegalPhilosophy/business_qualification_evidence.json
            LegalPhilosophy/windows_build_evidence.json
            LegalPhilosophy/exact_exe_evidence.json
            LegalPhilosophy/exact_updater_evidence.json
            LegalPhilosophy/gui_click_evidence.json
            LegalPhilosophy/gui_click_evidence.png
            LegalPhilosophy/candidate_manifest.json
          if-no-files-found: warn

      - name: Explicit non-final production boundary
        if: success()
        shell: pwsh
        run: |
          Write-Host "NEW_REAUTHORED_LINEAGE=TRUE"
          Write-Host "HISTORICAL_EXE_ACCEPTANCE_INHERITED=FALSE"
          Write-Host "PRIMARY_SOURCE_LINEAGE=NOT_VERIFIED"
          Write-Host "REPOSITORY_INDEPENDENCE=BLOCKED"
          Write-Host "REAL_RELEASE_N_TO_N_PLUS_1=BLOCKED"
          Write-Host "FINAL_GATE=FAIL"
