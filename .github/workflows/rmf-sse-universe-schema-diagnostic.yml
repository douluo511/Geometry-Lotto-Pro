name: RMF SSE universe schema diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/rmf-sse-universe-schema-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe official SSE universe schema without promoting any product gate
        shell: python
        run: |
          import hashlib
          import json
          import re
          import sys
          import urllib.parse
          import urllib.request

          URL = "https://query.sse.com.cn/sseQuery/commonQuery.do"
          headers = {
              "Host": "query.sse.com.cn",
              "Pragma": "no-cache",
              "Referer": "https://www.sse.com.cn/assortment/stock/list/share/",
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36",
              "Accept": "application/json,text/plain,*/*",
          }

          def request(stock_type):
              params = {
                  "STOCK_TYPE": stock_type,
                  "REG_PROVINCE": "",
                  "CSRC_CODE": "",
                  "STOCK_CODE": "",
                  "sqlId": "COMMON_SSE_CP_GPJCTPZ_GPLB_GP_L",
                  "COMPANY_STATUS": "2,4,5,7,8",
                  "type": "inParams",
                  "isPagination": "true",
                  "pageHelp.cacheSize": "1",
                  "pageHelp.beginPage": "1",
                  "pageHelp.pageSize": "10000",
                  "pageHelp.pageNo": "1",
                  "pageHelp.endPage": "1",
              }
              url = URL + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw = resp.read()
                  status = resp.status
                  ctype = resp.headers.get("Content-Type", "")
              if status != 200:
                  raise RuntimeError(f"HTTP {status}")
              if "json" not in ctype.lower() and not raw.lstrip().startswith((b"{", b"[")):
                  raise RuntimeError(f"unexpected content type: {ctype}")
              obj = json.loads(raw.decode("utf-8-sig"))
              rows = obj.get("result")
              if not isinstance(rows, list) or not rows:
                  raise RuntimeError("SSE result is empty or malformed")
              keys = sorted({str(k) for row in rows if isinstance(row, dict) for k in row})
              date_like = [k for k in keys if re.search(r"DATE|TIME|LIST|DELIST|STATUS|BEGIN|END", k, re.I)]
              identity_like = [k for k in keys if re.search(r"CODE|SEC_NAME|COMPANY|STATUS", k, re.I)]
              interesting = sorted(set(date_like + identity_like))
              samples = []
              for row in rows[:5]:
                  samples.append({k: row.get(k) for k in interesting if k in row})

              def clean(value):
                  return str(value or "").strip()

              delisted = [
                  row for row in rows
                  if re.fullmatch(r"\d{8}", clean(row.get("DELIST_DATE")))
              ]
              listed_dates = sorted(
                  clean(row.get("LIST_DATE")) for row in rows
                  if re.fullmatch(r"\d{8}", clean(row.get("LIST_DATE")))
              )
              delist_dates = sorted(
                  clean(row.get("DELIST_DATE")) for row in delisted
              )
              status_counts = {}
              for key in ("STATE_CODE", "STATE_CODE_STOCK", "PRODUCT_STATUS"):
                  counts = {}
                  for row in rows:
                      value = clean(row.get(key))
                      counts[value] = counts.get(value, 0) + 1
                  status_counts[key] = dict(sorted(counts.items()))

              historical_anchor = "20240906"
              members_at_anchor = [
                  row for row in rows
                  if re.fullmatch(r"\d{8}", clean(row.get("LIST_DATE")))
                  and clean(row.get("LIST_DATE")) <= historical_anchor
                  and (
                      not re.fullmatch(r"\d{8}", clean(row.get("DELIST_DATE")))
                      or clean(row.get("DELIST_DATE")) >= historical_anchor
                  )
              ]
              delisted_samples = [
                  {k: row.get(k) for k in interesting if k in row}
                  for row in delisted[:10]
              ]
              return {
                  "stock_type": stock_type,
                  "http_status": status,
                  "content_type": ctype,
                  "payload_sha256": hashlib.sha256(raw).hexdigest(),
                  "row_count": len(rows),
                  "all_keys": keys,
                  "date_status_identity_keys": interesting,
                  "sample_rows": samples,
                  "valid_list_date_count": len(listed_dates),
                  "list_date_range": [listed_dates[0], listed_dates[-1]] if listed_dates else None,
                  "valid_delist_date_count": len(delist_dates),
                  "delist_date_range": [delist_dates[0], delist_dates[-1]] if delist_dates else None,
                  "delisted_samples": delisted_samples,
                  "status_counts": status_counts,
                  "historical_anchor": historical_anchor,
                  "membership_count_at_anchor_from_returned_rows": len(members_at_anchor),
              }

          result = {
              "status": "DIAGNOSTIC_ONLY_NOT_A_BUSINESS_PASS",
              "source": URL,
              "queries": [request("1"), request("8")],
              "decision_rule": {
                  "historical_survivorship_can_be_considered_for_implementation_only_if": [
                      "security identity is present",
                      "listing start date is present",
                      "termination/delisting or equivalent membership end is present for historical members",
                      "status semantics are explicit enough to reconstruct membership as-of a past date",
                  ],
                  "otherwise": "KEEP_HISTORICAL_SURVIVORSHIP_NOT_VERIFIED",
              },
          }
          encoded = json.dumps(result, ensure_ascii=False, sort_keys=True)
          print(encoded)
          with open("rmf_sse_schema_probe.json", "w", encoding="utf-8") as fh:
              json.dump(result, fh, ensure_ascii=False, indent=2, sort_keys=True)

          # Never convert diagnostic schema visibility into a business PASS.
          print("RMF_SSE_SCHEMA_PROBE_COMPLETE")

      - name: Discover official SSE delisting data endpoint references
        shell: python
        run: |
          import json
          import re
          import urllib.parse
          import urllib.request

          pages = [
              "https://www.sse.com.cn/assortment/stock/list/delisting/",
              "https://www.sse.com.cn/services/information/delisting/",
          ]
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36",
              "Accept": "text/html,application/javascript,text/javascript,*/*",
          }
          patterns = [
              r"sqlId", r"commonQuery", r"DELIST", r"delist",
              r"暂停", r"终止", r"退市", r"COMPANY_STATUS",
          ]

          def fetch(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as resp:
                  raw = resp.read()
                  ctype = resp.headers.get("Content-Type", "")
                  status = resp.status
              text = raw.decode("utf-8", errors="replace")
              return status, ctype, text

          discovered = {"status": "DIAGNOSTIC_ONLY", "pages": [], "script_hits": []}
          scripts = []
          for page in pages:
              try:
                  status, ctype, html = fetch(page)
                  srcs = re.findall(r'''<script[^>]+src=["']([^"']+)["']''', html, flags=re.I)
                  resolved = []
                  for src in srcs:
                      url = urllib.parse.urljoin(page, src)
                      if "sse.com.cn" in urllib.parse.urlparse(url).netloc:
                          resolved.append(url)
                  resolved = list(dict.fromkeys(resolved))
                  scripts.extend(resolved)
                  page_hits = []
                  for pat in patterns:
                      for m in re.finditer(pat, html, flags=re.I):
                          page_hits.append(html[max(0,m.start()-250):m.start()+500])
                          if len(page_hits) >= 10:
                              break
                      if len(page_hits) >= 10:
                          break
                  discovered["pages"].append({
                      "url": page,
                      "http_status": status,
                      "content_type": ctype,
                      "script_count": len(resolved),
                      "scripts": resolved,
                      "html_hits": page_hits,
                  })
              except Exception as exc:
                  discovered["pages"].append({"url": page, "error": repr(exc)})

          for url in list(dict.fromkeys(scripts))[:80]:
              try:
                  status, ctype, text = fetch(url)
                  if len(text) > 4_000_000:
                      continue
                  hits = []
                  for pat in patterns:
                      for m in re.finditer(pat, text, flags=re.I):
                          hits.append(text[max(0,m.start()-350):m.start()+900])
                          if len(hits) >= 8:
                              break
                      if len(hits) >= 8:
                          break
                  if hits:
                      discovered["script_hits"].append({
                          "url": url,
                          "http_status": status,
                          "content_type": ctype,
                          "hits": hits,
                      })
                  if len(discovered["script_hits"]) >= 20:
                      break
              except Exception:
                  pass

          print(json.dumps(discovered, ensure_ascii=False, sort_keys=True))
          print("RMF_SSE_DELISTING_ENDPOINT_DISCOVERY_COMPLETE")

      - name: Trace SSE common-table data URL construction for delisting channels
        shell: python
        run: |
          import json
          import re
          import urllib.request

          urls = [
              "https://www.sse.com.cn/xhtml/js/common/common_table.js?v=V3.6.1_20250626",
              "https://www.sse.com.cn/xhtml/js/common/table_config.js?v=V3.7.9",
              "https://www.sse.com.cn/assortment/stock/list/delisting/",
              "https://www.sse.com.cn/services/information/delisting/",
          ]
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36",
              "Accept": "text/html,application/javascript,text/javascript,*/*",
          }
          needles = [
              r"js_delistedCompany",
              r"delisting_8530",
              r"channelCode",
              r"commonQuery",
              r"sseQuery",
              r"query\.do",
              r"sqlId",
              r"ajax",
              r"dataUrl",
              r"queryUrl",
              r"api",
          ]
          out = {"status":"DIAGNOSTIC_ONLY","sources":[]}
          for url in urls:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=25) as resp:
                  raw = resp.read()
                  status = resp.status
                  ctype = resp.headers.get("Content-Type","")
              text = raw.decode("utf-8", errors="replace")
              snippets = []
              for needle in needles:
                  for m in re.finditer(needle, text, flags=re.I):
                      snippets.append({
                          "needle": needle,
                          "snippet": text[max(0,m.start()-650):min(len(text),m.start()+1800)]
                      })
                      if len(snippets) >= 40:
                          break
                  if len(snippets) >= 40:
                      break
              out["sources"].append({
                  "url":url,
                  "http_status":status,
                  "content_type":ctype,
                  "bytes":len(raw),
                  "snippets":snippets,
              })
          print(json.dumps(out, ensure_ascii=False, sort_keys=True))
          print("RMF_SSE_COMMON_TABLE_TRACE_COMPLETE")

      - name: Extract inline delisting page scripts and RequireJS modules
        shell: python
        run: |
          import json
          import re
          import urllib.request

          pages = [
              "https://www.sse.com.cn/assortment/stock/list/delisting/",
              "https://www.sse.com.cn/services/information/delisting/",
          ]
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36",
              "Accept": "text/html,*/*",
          }
          out = {"status":"DIAGNOSTIC_ONLY","pages":[]}
          for url in pages:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=25) as resp:
                  html=resp.read().decode("utf-8",errors="replace")
              scripts=re.findall(r"<script([^>]*)>(.*?)</script>",html,flags=re.I|re.S)
              inline=[]
              srcs=[]
              for attrs,body in scripts:
                  m=re.search(r"""src\s*=\s*["']([^"']+)["']""",attrs,flags=re.I)
                  if m:
                      srcs.append(m.group(1))
                      continue
                  body=body.strip()
                  if body:
                      inline.append(body)
              interesting=[]
              for body in inline:
                  if re.search(r"delist|table|query|require|sseQuery|ajax|jsonp|sqlId|channelCode",body,flags=re.I):
                      interesting.append(body)
              out["pages"].append({
                  "url":url,
                  "src_count":len(srcs),
                  "srcs":srcs,
                  "inline_script_count":len(inline),
                  "interesting_inline_scripts":interesting,
              })
          print(json.dumps(out,ensure_ascii=False,sort_keys=True))
          print("RMF_SSE_INLINE_SCRIPT_TRACE_COMPLETE")
