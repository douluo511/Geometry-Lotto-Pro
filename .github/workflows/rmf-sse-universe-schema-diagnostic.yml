name: RMF SSE universe schema diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/rmf-sse-universe-schema-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe official SSE universe schema without promoting any product gate
        shell: python
        run: |
          import hashlib
          import json
          import re
          import sys
          import urllib.parse
          import urllib.request

          URL = "https://query.sse.com.cn/sseQuery/commonQuery.do"
          headers = {
              "Host": "query.sse.com.cn",
              "Pragma": "no-cache",
              "Referer": "https://www.sse.com.cn/assortment/stock/list/share/",
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36",
              "Accept": "application/json,text/plain,*/*",
          }

          def request(stock_type):
              params = {
                  "STOCK_TYPE": stock_type,
                  "REG_PROVINCE": "",
                  "CSRC_CODE": "",
                  "STOCK_CODE": "",
                  "sqlId": "COMMON_SSE_CP_GPJCTPZ_GPLB_GP_L",
                  "COMPANY_STATUS": "2,4,5,7,8",
                  "type": "inParams",
                  "isPagination": "true",
                  "pageHelp.cacheSize": "1",
                  "pageHelp.beginPage": "1",
                  "pageHelp.pageSize": "10000",
                  "pageHelp.pageNo": "1",
                  "pageHelp.endPage": "1",
              }
              url = URL + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw = resp.read()
                  status = resp.status
                  ctype = resp.headers.get("Content-Type", "")
              if status != 200:
                  raise RuntimeError(f"HTTP {status}")
              if "json" not in ctype.lower() and not raw.lstrip().startswith((b"{", b"[")):
                  raise RuntimeError(f"unexpected content type: {ctype}")
              obj = json.loads(raw.decode("utf-8-sig"))
              rows = obj.get("result")
              if not isinstance(rows, list) or not rows:
                  raise RuntimeError("SSE result is empty or malformed")
              keys = sorted({str(k) for row in rows if isinstance(row, dict) for k in row})
              date_like = [k for k in keys if re.search(r"DATE|TIME|LIST|DELIST|STATUS|BEGIN|END", k, re.I)]
              identity_like = [k for k in keys if re.search(r"CODE|SEC_NAME|COMPANY|STATUS", k, re.I)]
              interesting = sorted(set(date_like + identity_like))
              samples = []
              for row in rows[:5]:
                  samples.append({k: row.get(k) for k in interesting if k in row})

              def clean(value):
                  return str(value or "").strip()

              delisted = [
                  row for row in rows
                  if re.fullmatch(r"\\d{8}", clean(row.get("DELIST_DATE")))
              ]
              listed_dates = sorted(
                  clean(row.get("LIST_DATE")) for row in rows
                  if re.fullmatch(r"\\d{8}", clean(row.get("LIST_DATE")))
              )
              delist_dates = sorted(
                  clean(row.get("DELIST_DATE")) for row in delisted
              )
              status_counts = {}
              for key in ("STATE_CODE", "STATE_CODE_STOCK", "PRODUCT_STATUS"):
                  counts = {}
                  for row in rows:
                      value = clean(row.get(key))
                      counts[value] = counts.get(value, 0) + 1
                  status_counts[key] = dict(sorted(counts.items()))

              historical_anchor = "20240906"
              members_at_anchor = [
                  row for row in rows
                  if re.fullmatch(r"\\d{8}", clean(row.get("LIST_DATE")))
                  and clean(row.get("LIST_DATE")) <= historical_anchor
                  and (
                      not re.fullmatch(r"\\d{8}", clean(row.get("DELIST_DATE")))
                      or clean(row.get("DELIST_DATE")) >= historical_anchor
                  )
              ]
              delisted_samples = [
                  {k: row.get(k) for k in interesting if k in row}
                  for row in delisted[:10]
              ]
              return {
                  "stock_type": stock_type,
                  "http_status": status,
                  "content_type": ctype,
                  "payload_sha256": hashlib.sha256(raw).hexdigest(),
                  "row_count": len(rows),
                  "all_keys": keys,
                  "date_status_identity_keys": interesting,
                  "sample_rows": samples,
                  "valid_list_date_count": len(listed_dates),
                  "list_date_range": [listed_dates[0], listed_dates[-1]] if listed_dates else None,
                  "valid_delist_date_count": len(delist_dates),
                  "delist_date_range": [delist_dates[0], delist_dates[-1]] if delist_dates else None,
                  "delisted_samples": delisted_samples,
                  "status_counts": status_counts,
                  "historical_anchor": historical_anchor,
                  "membership_count_at_anchor_from_returned_rows": len(members_at_anchor),
              }

          result = {
              "status": "DIAGNOSTIC_ONLY_NOT_A_BUSINESS_PASS",
              "source": URL,
              "queries": [request("1"), request("8")],
              "decision_rule": {
                  "historical_survivorship_can_be_considered_for_implementation_only_if": [
                      "security identity is present",
                      "listing start date is present",
                      "termination/delisting or equivalent membership end is present for historical members",
                      "status semantics are explicit enough to reconstruct membership as-of a past date",
                  ],
                  "otherwise": "KEEP_HISTORICAL_SURVIVORSHIP_NOT_VERIFIED",
              },
          }
          encoded = json.dumps(result, ensure_ascii=False, sort_keys=True)
          print(encoded)
          with open("rmf_sse_schema_probe.json", "w", encoding="utf-8") as fh:
              json.dump(result, fh, ensure_ascii=False, indent=2, sort_keys=True)

          # Never convert diagnostic schema visibility into a business PASS.
          print("RMF_SSE_SCHEMA_PROBE_COMPLETE")
