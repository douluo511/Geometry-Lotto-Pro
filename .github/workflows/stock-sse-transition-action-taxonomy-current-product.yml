name: Stock SSE transition action taxonomy current product

on:
  push:
    branches:
      - diagnostic/stock-sse-transition-action-taxonomy-current-product-20261006
  pull_request:
    branches:
      - diagnostic/stock-sse-primary-transition-full-current-product-20261006
  workflow_dispatch:

permissions:
  contents: read

jobs:
  taxonomy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact checkout and current Stock product identity
        shell: bash
        run: |
          set -euo pipefail
          exact="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$exact"
          git merge-base --is-ancestor 8f990dfbc61ce6f977f91645194df245286c9d7d HEAD
          test -z "$(git diff --name-only 7f270b9ab58e11fd8129053a65e000c90ff9d8c1..HEAD -- StockAIPro)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2" "pypdf==5.4.0"
      - name: Rebuild exact source identity and classify transition actions
        run: python .github/stock_diag/stock_sse_transition_action_taxonomy_current_product.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: STOCK-SSE-ACTION-TAXONOMY-CURRENT-${{ github.event.pull_request.head.sha || github.sha }}
          path: stock_sse_transition_action_taxonomy_current_product.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: Preserve strict PIT boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f stock_sse_transition_action_taxonomy_current_product.json
          python - <<'PY'
          import json
          x=json.load(open("stock_sse_transition_action_taxonomy_current_product.json",encoding="utf-8"))
          a=x["adjudication"]
          assert a["effective_state_reconstruction"] == "NOT VERIFIED"
          assert a["shanghai_historical_st_pit"] == "NOT VERIFIED"
          assert a["full_historical_st_pit"] == "NOT VERIFIED"
          assert a["advanced_business"] == "NOT VERIFIED"
          assert a["final_gate"] == "FAIL"
          print("CURRENT_SOURCE_BINDING="+a["current_source_binding"])
          print("TITLE_ACTION_TAXONOMY="+a["title_action_taxonomy"])
          print("EFFECTIVE_DATE_DENOMINATOR="+a["effective_date_denominator_defined"])
          print("UNCLASSIFIED_COUNT="+str(x["unclassified_count"]))
          print("HISTORICAL_ST_PIT=NOT VERIFIED")
          print("FINAL_GATE=FAIL")
          PY
