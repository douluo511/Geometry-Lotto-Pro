name: DLT Independent Repository Create Capability Probe

on:
  pull_request:
    paths:
      - ".github/workflows/dlt-repo-create-probe.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_REPO: douluo511/Geometry-Lotto-Pro-DLT
      TARGET_NAME: Geometry-Lotto-Pro-DLT
      API_ROOT: https://api.github.com
    steps:
      - name: Checkout probe head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Probe exact REST capability and rate state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p probe-artifacts

          api_get() {
            local path="$1" body="$2" headers="$3"
            curl -sS               -D "$headers"               -o "$body"               -w '%{http_code}'               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "$API_ROOT$path"
          }

          rate_status="$(api_get /rate_limit probe-artifacts/rate.json probe-artifacts/rate.headers)"
          core_remaining="$(jq -r '.resources.core.remaining // -1' probe-artifacts/rate.json 2>/dev/null || echo -1)"
          core_limit="$(jq -r '.resources.core.limit // -1' probe-artifacts/rate.json 2>/dev/null || echo -1)"
          core_reset="$(jq -r '.resources.core.reset // 0' probe-artifacts/rate.json 2>/dev/null || echo 0)"
          echo "RATE_HTTP_STATUS=$rate_status"
          echo "RATE_CORE_REMAINING=$core_remaining"
          echo "RATE_CORE_LIMIT=$core_limit"
          echo "RATE_CORE_RESET=$core_reset"

          user_status="$(api_get /user probe-artifacts/user.json probe-artifacts/user.headers)"
          user_message="$(jq -r '.message // empty' probe-artifacts/user.json 2>/dev/null || true)"
          user_login="$(jq -r '.login // empty' probe-artifacts/user.json 2>/dev/null || true)"
          echo "USER_HTTP_STATUS=$user_status"
          echo "USER_LOGIN=${user_login:-UNAVAILABLE}"
          echo "USER_MESSAGE=${user_message:-NONE}"

          repo_status="$(api_get "/repos/$TARGET_REPO" probe-artifacts/existing.json probe-artifacts/existing.headers)"
          echo "TARGET_REPO_HTTP_STATUS=$repo_status"

          if [ "$repo_status" = "200" ]; then
            jq -n               --arg schema "dlt-repository-create-capability-v2"               --arg state "EXISTING"               --arg target "$TARGET_REPO"               --arg github_repository "$GITHUB_REPOSITORY"               --arg github_sha "$GITHUB_SHA"               --arg github_run_id "$GITHUB_RUN_ID"               --arg user_status "$user_status"               --arg user_login "$user_login"               --argjson rate_remaining "$core_remaining"               --argjson rate_limit "$core_limit"               --argjson rate_reset "$core_reset"               '{schema:$schema,state:$state,target_repository:$target,github_repository:$github_repository,github_sha:$github_sha,github_run_id:$github_run_id,user_http_status:$user_status,user_login:$user_login,rate_core_remaining:$rate_remaining,rate_core_limit:$rate_limit,rate_core_reset:$rate_reset}'               > probe-artifacts/result.json
            echo "REPOSITORY_CREATE_PROBE=EXISTING"
            exit 0
          fi

          payload='{"name":"Geometry-Lotto-Pro-DLT","private":false,"auto_init":true,"description":"Independent DLT release/acceptance repository for Geometry Lotto Pro"}'
          create_status="$(curl -sS             -D probe-artifacts/create.headers             -o probe-artifacts/create.json             -w '%{http_code}'             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             -H "Content-Type: application/json"             "$API_ROOT/user/repos"             -d "$payload")"

          create_message="$(jq -r '.message // empty' probe-artifacts/create.json 2>/dev/null || true)"
          create_doc="$(jq -r '.documentation_url // empty' probe-artifacts/create.json 2>/dev/null || true)"
          create_remaining="$(awk 'BEGIN{IGNORECASE=1} /^x-ratelimit-remaining:/ {gsub("\r","",$2); print $2}' probe-artifacts/create.headers | tail -1)"
          retry_after="$(awk 'BEGIN{IGNORECASE=1} /^retry-after:/ {gsub("\r","",$2); print $2}' probe-artifacts/create.headers | tail -1)"
          request_id="$(awk 'BEGIN{IGNORECASE=1} /^x-github-request-id:/ {$1=""; sub(/^ /,""); gsub("\r",""); print}' probe-artifacts/create.headers | tail -1)"

          echo "CREATE_HTTP_STATUS=$create_status"
          echo "CREATE_MESSAGE=${create_message:-NONE}"
          echo "CREATE_RATE_REMAINING=${create_remaining:-UNKNOWN}"
          echo "CREATE_RETRY_AFTER=${retry_after:-NONE}"
          echo "CREATE_REQUEST_ID=${request_id:-UNKNOWN}"

          state="DENIED"
          if [ "$create_status" = "201" ]; then
            full_name="$(jq -r '.full_name // empty' probe-artifacts/create.json)"
            test "$full_name" = "$TARGET_REPO"
            state="CREATED"
          elif [ "$core_remaining" = "0" ] || [ "${create_remaining:-}" = "0" ]; then
            state="RATE_LIMITED"
          elif echo "$create_message" | grep -qiE 'rate limit|secondary rate'; then
            state="THROTTLED"
          fi

          jq -n             --arg schema "dlt-repository-create-capability-v2"             --arg state "$state"             --arg target "$TARGET_REPO"             --arg github_repository "$GITHUB_REPOSITORY"             --arg github_sha "$GITHUB_SHA"             --arg github_run_id "$GITHUB_RUN_ID"             --arg rate_http_status "$rate_status"             --argjson rate_remaining "$core_remaining"             --argjson rate_limit "$core_limit"             --argjson rate_reset "$core_reset"             --arg user_http_status "$user_status"             --arg user_login "$user_login"             --arg user_message "$user_message"             --arg repo_http_status "$repo_status"             --arg create_http_status "$create_status"             --arg create_message "$create_message"             --arg create_documentation_url "$create_doc"             --arg create_rate_remaining "${create_remaining:-}"             --arg retry_after "${retry_after:-}"             --arg request_id "${request_id:-}"             '{schema:$schema,state:$state,target_repository:$target,github_repository:$github_repository,github_sha:$github_sha,github_run_id:$github_run_id,rate_http_status:$rate_http_status,rate_core_remaining:$rate_remaining,rate_core_limit:$rate_limit,rate_core_reset:$rate_reset,user_http_status:$user_http_status,user_login:$user_login,user_message:$user_message,target_repo_http_status:$repo_http_status,create_http_status:$create_http_status,create_message:$create_message,create_documentation_url:$create_documentation_url,create_rate_remaining:$create_rate_remaining,retry_after:$retry_after,github_request_id:$request_id}'             > probe-artifacts/result.json

          echo "REPOSITORY_CREATE_PROBE=$state"
          cat probe-artifacts/result.json

      - name: Probe GraphQL createRepository fallback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="$(jq -r '.state' probe-artifacts/result.json)"
          if [ "$state" = "EXISTING" ] || [ "$state" = "CREATED" ]; then
            echo "GRAPHQL_CREATE_PROBE=SKIPPED_ALREADY_RESOLVED"
            exit 0
          fi

          owner_query='query { viewer { login } repository(owner:"douluo511", name:"Geometry-Lotto-Pro") { owner { id login } } }'
          jq -n --arg query "$owner_query" '{query:$query}' > probe-artifacts/graphql-owner-request.json
          owner_http="$(curl -sS             -o probe-artifacts/graphql-owner.json             -w '%{http_code}'             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             -H "Content-Type: application/json"             "$API_ROOT/graphql"             --data-binary @probe-artifacts/graphql-owner-request.json)"
          owner_id="$(jq -r '.data.repository.owner.id // empty' probe-artifacts/graphql-owner.json 2>/dev/null || true)"
          owner_login="$(jq -r '.data.repository.owner.login // empty' probe-artifacts/graphql-owner.json 2>/dev/null || true)"
          viewer_login="$(jq -r '.data.viewer.login // empty' probe-artifacts/graphql-owner.json 2>/dev/null || true)"
          owner_errors="$(jq -c '.errors // []' probe-artifacts/graphql-owner.json 2>/dev/null || echo '[]')"
          echo "GRAPHQL_OWNER_HTTP_STATUS=$owner_http"
          echo "GRAPHQL_OWNER_LOGIN=${owner_login:-UNAVAILABLE}"
          echo "GRAPHQL_VIEWER_LOGIN=${viewer_login:-UNAVAILABLE}"
          echo "GRAPHQL_OWNER_ERRORS=$owner_errors"

          if [ -z "$owner_id" ]; then
            gql_state="DENIED_INTEGRATION"
            jq --arg gql_state "$gql_state"                --arg owner_http "$owner_http"                --arg owner_login "$owner_login"                --arg viewer_login "$viewer_login"                --argjson owner_errors "$owner_errors"                '.state=$gql_state | .graphql_owner_http_status=$owner_http | .graphql_owner_login=$owner_login | .graphql_viewer_login=$viewer_login | .graphql_owner_errors=$owner_errors'                probe-artifacts/result.json > probe-artifacts/result.tmp
            mv probe-artifacts/result.tmp probe-artifacts/result.json
            echo "GRAPHQL_CREATE_PROBE=$gql_state"
            cat probe-artifacts/result.json
            exit 0
          fi

          mutation='mutation($input:CreateRepositoryInput!){ createRepository(input:$input){ repository { nameWithOwner url visibility } } }'
          jq -n             --arg query "$mutation"             --arg ownerId "$owner_id"             --arg name "$TARGET_NAME"             '{query:$query,variables:{input:{ownerId:$ownerId,name:$name,visibility:"PUBLIC",description:"Independent DLT release/acceptance repository for Geometry Lotto Pro"}}}'             > probe-artifacts/graphql-create-request.json

          create_http="$(curl -sS             -o probe-artifacts/graphql-create.json             -w '%{http_code}'             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             -H "Content-Type: application/json"             "$API_ROOT/graphql"             --data-binary @probe-artifacts/graphql-create-request.json)"
          created_name="$(jq -r '.data.createRepository.repository.nameWithOwner // empty' probe-artifacts/graphql-create.json 2>/dev/null || true)"
          gql_errors="$(jq -c '.errors // []' probe-artifacts/graphql-create.json 2>/dev/null || echo '[]')"
          gql_messages="$(jq -r '[.errors[]?.message] | join(" | ")' probe-artifacts/graphql-create.json 2>/dev/null || true)"
          gql_state="DENIED_INTEGRATION"

          if [ "$created_name" = "$TARGET_REPO" ]; then
            gql_state="CREATED"
          elif echo "$gql_messages" | grep -qiE 'rate limit|secondary rate'; then
            gql_state="THROTTLED"
          elif echo "$gql_messages" | grep -qiE 'resource not accessible|forbidden|permission|not permitted|viewer'; then
            gql_state="DENIED_INTEGRATION"
          else
            gql_state="GRAPHQL_ERROR"
          fi

          jq --arg gql_state "$gql_state"              --arg owner_http "$owner_http"              --arg owner_login "$owner_login"              --arg viewer_login "$viewer_login"              --arg create_http "$create_http"              --arg created_name "$created_name"              --argjson owner_errors "$owner_errors"              --argjson create_errors "$gql_errors"              '.state=$gql_state | .graphql_owner_http_status=$owner_http | .graphql_owner_login=$owner_login | .graphql_viewer_login=$viewer_login | .graphql_owner_errors=$owner_errors | .graphql_create_http_status=$create_http | .graphql_created_name=$created_name | .graphql_create_errors=$create_errors'              probe-artifacts/result.json > probe-artifacts/result.tmp
          mv probe-artifacts/result.tmp probe-artifacts/result.json

          echo "GRAPHQL_CREATE_HTTP_STATUS=$create_http"
          echo "GRAPHQL_CREATED_NAME=${created_name:-NONE}"
          echo "GRAPHQL_CREATE_ERRORS=$gql_errors"
          echo "GRAPHQL_CREATE_PROBE=$gql_state"
          cat probe-artifacts/result.json

      - name: Verify probe evidence
        shell: bash
        run: |
          set -euo pipefail
          state="$(jq -r '.state' probe-artifacts/result.json)"
          case "$state" in
            EXISTING|CREATED|DENIED|DENIED_INTEGRATION|RATE_LIMITED|THROTTLED|GRAPHQL_ERROR) ;;
            *) echo "invalid probe state: $state"; exit 2 ;;
          esac
          test "$(jq -r '.target_repository' probe-artifacts/result.json)" = "$TARGET_REPO"
          echo "PROBE_EVIDENCE=PASS"
          echo "PROBE_STATE=$state"

      - name: Upload repository-create probe evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DLT-REPOSITORY-CREATE-CAPABILITY-PROBE-V2-${{ github.event.pull_request.head.sha || github.sha }}
          path: probe-artifacts/**
          if-no-files-found: error
          retention-days: 90
