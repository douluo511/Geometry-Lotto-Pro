name: Stock SZSE suspension detail corpus

on:
  push:
    branches:
      - diagnostic/stock-szse-suspension-detail-current-20261008
    paths:
      - ".github/stock_diag/stock_szse_suspension_static_archive.py"
      - ".github/stock_diag/stock_szse_suspension_detail_corpus.py"
      - ".github/stock_diag/test_szse_primary_article.py"
      - ".github/workflows/stock-szse-suspension-detail-corpus.yml"
  pull_request:
    paths:
      - ".github/stock_diag/stock_szse_suspension_static_archive.py"
      - ".github/stock_diag/stock_szse_suspension_detail_corpus.py"
      - ".github/stock_diag/test_szse_primary_article.py"
      - ".github/workflows/stock-szse-suspension-detail-corpus.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detail-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout and unchanged Stock product bytes
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          authoritative="9969490c89ccb4cc10536f66416976c5bf40caef"
          test "$(git rev-parse HEAD)" = "$expected"
          git merge-base --is-ancestor "$authoritative" HEAD
          test -z "$(git diff --name-only "$authoritative"..HEAD -- StockAIPro)"
          echo "STOCK_PRODUCT_BYTES_CHANGED=FALSE"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2" "beautifulsoup4==4.15.0"

      - name: Reject navigation and footer as evidence (five regressions)
        run: python .github/stock_diag/test_szse_primary_article.py

      - name: Fetch all official SZSE suspension detail pages
        run: python .github/stock_diag/stock_szse_suspension_detail_corpus.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-SZSE-SUSPENSION-DETAIL-CORPUS-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            stock_szse_suspension_static_archive.json
            stock_szse_suspension_detail_corpus.json
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve strict state boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f stock_szse_suspension_detail_corpus.json
          python - <<'PY'
          import json
          x=json.load(open("stock_szse_suspension_detail_corpus.json",encoding="utf-8"))
          a=x["adjudication"]
          assert a["shenzhen_historical_suspension_state"] == "NOT VERIFIED"
          assert a["shenzhen_historical_st_pit"] == "NOT VERIFIED"
          assert a["full_historical_st_pit"] == "NOT VERIFIED"
          assert a["advanced_business"] == "NOT VERIFIED"
          assert a["final_gate"] == "FAIL"
          print("FULL_DETAIL_PAGE_TRANSPORT="+a["full_detail_page_transport"])
          print("FULL_DETAIL_BODY_TEXT="+a["full_detail_body_text"])
          print("FULL_DETAIL_TITLE_SEMANTICS="+a["full_detail_title_semantics"])
          print("SHENZHEN_HISTORICAL_SUSPENSION_STATE=NOT VERIFIED")
          print("FULL_HISTORICAL_ST_PIT=NOT VERIFIED")
          print("FINAL_GATE=FAIL")
          PY
