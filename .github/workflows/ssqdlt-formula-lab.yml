name: SSQDLT code-only formula research

on:
  push:
    branches: ['research/causal-math-code-only-*']
    paths: ['research/formula_lab/**', '.github/workflows/ssqdlt-formula-lab.yml']
  pull_request:
    paths: ['research/formula_lab/**', '.github/workflows/ssqdlt-formula-lab.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formula-lab-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            research/formula_lab
            research/supercompute
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -r research/formula_lab/requirements.txt
      - name: Synthetic regression and private-storage firewall
        run: python -m pytest -q research/formula_lab/tests research/supercompute/tests/test_exhaustive.py research/supercompute/tests/test_p0_scheduler.py research/supercompute/tests/test_p0_acceptance.py

  compute:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            research/formula_lab
            research/supercompute
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -r research/formula_lab/requirements.txt
      - name: Actual bounded formula search on synthetic SSQ and DLT
        run: python -m research.formula_lab.cli synthetic --train 180 --validation 60 --holdout 120
      - name: Allocation-inclusive benchmark and selection profile
        run: python -m research.formula_lab.benchmark --parallel
