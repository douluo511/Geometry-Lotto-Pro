name: Stock BSE bounded warning state replay
on:
  push:
    branches:
      - diagnostic/stock-bse-warning-state-replay-20261006
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact checkout and unchanged Stock product bytes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor b6f11aed9cd584f5476c600f88becbc443747336 HEAD
          test -z "$(git diff --name-only b6f11aed9cd584f5476c600f88becbc443747336..HEAD -- StockAIPro)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
      - run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2"
      - name: Rebuild bounded BSE warning state intervals
        run: python .github/stock_diag/stock_bse_warning_state_replay.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: STOCK-BSE-WARNING-STATE-REPLAY-${{ github.sha }}
          path: |
            stock_bse_warning_state_replay.json
            stock_bse_post_implementation_state_sequence.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve strict boundary
        if: always()
        run: |
          echo "TRADING_DAY_ALIGNED_STATE_REPLAY=NOT VERIFIED"
          echo "BSE_EFFECTIVE_STATE_RECONSTRUCTION=NOT VERIFIED"
          echo "BSE_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "FULL_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"
