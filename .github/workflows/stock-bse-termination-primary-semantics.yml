name: Stock BSE termination primary semantics

on:
  push:
    branches:
      - diagnostic/stock-bse-termination-primary-semantics-20261006
  pull_request:
    paths:
      - ".github/stock_diag/bse_termination_primary_semantics.py"
      - ".github/workflows/stock-bse-termination-primary-semantics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  primary-semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout and unchanged Stock product bytes
        shell: bash
        run: |
          set -euo pipefail
          exact="${{ github.event.pull_request.head.sha || github.sha }}"
          authority="e67eaa9cabc34728fee3549262a2f1535d7e8383"
          test "$(git rev-parse HEAD)" = "$exact"
          test -z "$(git diff --name-only "$authority"..HEAD -- StockAIPro)"
          echo "STOCK_PRODUCT_TREE_BYTE_IDENTITY=PASS"

      - name: Setup pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.32.5" "pypdf==5.4.0"

      - name: Resolve primary-document terminal semantics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stock_bse_terminal_docs"
          python .github/stock_diag/bse_termination_primary_semantics.py             --output "$RUNNER_TEMP/stock_bse_termination_primary_semantics.json"             --raw-dir "$RUNNER_TEMP/stock_bse_terminal_docs"

      - name: Upload primary documents and semantic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-BSE-TERMINATION-PRIMARY-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/stock_bse_termination_primary_semantics.json
            ${{ runner.temp }}/stock_bse_terminal_docs/**
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve strict lifecycle boundary
        if: always()
        shell: bash
        run: |
          echo "BSE_DELISTING_EVENT_VOCABULARY_COMPLETE=NOT VERIFIED"
          echo "BSE_DELISTING_REMOVAL_LIFECYCLE_COMPLETE=NOT VERIFIED"
          echo "BSE_HISTORICAL_LIFECYCLE_AUTHORITY=NOT VERIFIED"
          echo "BSE_HISTORICAL_PIT_AVAILABILITY=NOT VERIFIED"
          echo "FULL_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "ADVANCED_BUSINESS=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"
