name: Stock BSE 2024 NEW 920 IPO rule vs 2025 old-issuer switch
on:
  push:
    branches: [diagnostic/stock-bse-2024-new-ipo-primary-witness-20261008]
    paths:
      - ".github/stock_diag/stock_bse_2024_ipo_primary_witness.py"
      - ".github/stock_diag/test_stock_bse_2024_ipo_primary_witness.py"
      - ".github/workflows/stock-bse-2024-920-ipo-rule-firstparty.yml"
  pull_request:
    paths:
      - ".github/stock_diag/stock_bse_2024_ipo_primary_witness.py"
      - ".github/stock_diag/test_stock_bse_2024_ipo_primary_witness.py"
      - ".github/workflows/stock-bse-2024-920-ipo-rule-firstparty.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-2024-rule-2024-ipo:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Checkout exact source witness code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Prevent changes to frozen PR 367 Stock product / candidate manifests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor aed7a628119d846fcc8b8c732c291a8e741e5027 HEAD
          test -z "$(git diff --name-only aed7a628119d846fcc8b8c732c291a8e741e5027..HEAD -- StockAIPro)"
          echo "STOCK_PRODUCT_AND_STAGED_MANIFESTS_UNCHANGED=PASS"
      - name: Use pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - name: Install bounded official HTML and TLS clients
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2" "beautifulsoup4==4.15.0"
      - name: 20 first-party claim/source/date/HTTP anti-fabrication cases
        run: python .github/stock_diag/test_stock_bse_2024_ipo_primary_witness.py
      - name: Real-first-party BSE April 2024 rule and actual December 2024 920098 issuer
        shell: bash
        run: |
          set -euo pipefail
          python .github/stock_diag/stock_bse_2024_ipo_primary_witness.py
      - name: Verify no complete historical PIT inferred from original first-party proof
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          test -f stock_bse_2024_ipo_primary_source.json
          python - <<'PY'
          import json
          d=json.load(open("stock_bse_2024_ipo_primary_source.json",encoding="utf-8"))
          assert d["new_920_ipo_code_rule_effective"]=="2024-04-22"
          assert d["new_920_ipo_actual_2024_listing_example"]=={"code":"920098","listed_date":"2024-12-05"}
          assert d["adjudication"]["production_historical_st_pit"]=="NOT VERIFIED"
          assert d["adjudication"]["historical_full_BSE_SecurityType1_master"]=="NOT VERIFIED"
          assert d["adjudication"]["final_gate"]=="FAIL"
          assert not __import__("pathlib").Path("historical_st_pit.json").exists()
          print("BSE_ORIGINAL_2024_RULE_AND_920098=PASS; FULL_PIT=NOT VERIFIED; FINAL_GATE=FAIL")
          PY
      - name: Upload exact official two live HTML raw bytes and audit ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-BSE-2024-NEW-IPO-NOT-PIT-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            stock_bse_2024_ipo_primary_source.json
            stock_bse_2024_new_ipo_920_rule.html
            stock_bse_2024_real_2024_920_ipo.html
          if-no-files-found: warn
          retention-days: 30
