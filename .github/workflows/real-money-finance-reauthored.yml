name: Real-Money Finance reauthored Windows candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'RealMoneyFinance/**'
      - '.github/workflows/real-money-finance-reauthored.yml'

concurrency:
  group: real-money-finance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-candidate:
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: RealMoneyFinance

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact checkout
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim()
          if($actual -ne $env:SOURCE_SHA){throw "stale checkout: $actual != $env:SOURCE_SHA"}

      - name: Setup pinned Windows Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
          architecture: 'x64'

      - name: Install frozen validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Static compile
        run: python -m compileall -q app tests main.py updater_main.py

      - name: Governance architecture and function inventory gate
        run: python -m tests.governance_gate

      - name: Contract gate
        run: python -m tests.contract_gate

      - name: Fault injection gate
        run: python -m tests.fault_injection_gate

      - name: Independent updater contract and rollback fault gate
        run: python -m tests.updater_contract_gate

      - name: Real production network gate
        run: python -m tests.real_network_gate

      - name: Cost leakage walk-forward and statistical business qualification
        run: python -m tests.business_qualification_gate

      - name: Windows native candidate build
        shell: pwsh
        run: ./build_windows.ps1

      - name: Exact EXE self-test and same-hash pre-GUI
        shell: pwsh
        run: |
          $exe=Resolve-Path ./dist/RealMoneyFinance.exe
          $before=(Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          $env:REAL_MONEY_FINANCE_ROOT=Join-Path $env:RUNNER_TEMP "rmf-selftest"
          $health=Join-Path $env:RUNNER_TEMP "rmf-selftest-health.json"
          $nonce=[guid]::NewGuid().ToString('N')
          $proc=Start-Process -FilePath $exe -ArgumentList @('--self-test','--health-report',"$health",'--health-nonce',$nonce) -Wait -PassThru
          if($proc.ExitCode -ne 0){throw "Exact EXE self-test failed rc=$($proc.ExitCode)"}
          $obj=Get-Content -Raw -LiteralPath $health|ConvertFrom-Json
          if($obj.status -ne 'PASS' -or $obj.product -ne 'RealMoneyFinance' -or $obj.source_sha -ne $env:SOURCE_SHA -or $obj.exe_sha256 -ne $before -or $obj.nonce -ne $nonce -or $obj.storage_integrity -ne 'ok'){throw "Exact EXE health identity failed"}
          $after=(Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          if($before -ne $after){throw "EXE changed after self-test"}
          [ordered]@{
            status="PASS"
            source_sha=$env:SOURCE_SHA
            health=$obj
            exact_exe="PASS"
            exe_sha256_before=$before
            exe_sha256_after=$after
            same_hash_pre_gui="PASS"
          }|ConvertTo-Json -Depth 5|Set-Content -Encoding UTF8 exact_exe_evidence.json

      - name: Independent updater negative production-context gate
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP "rmf-updater"
          New-Item -ItemType Directory -Force $root|Out-Null
          $updater=Resolve-Path ./dist/RealMoneyFinanceUpdater.exe
          $proc=Start-Process -FilePath $updater -ArgumentList @('--root',"$root") -Wait -PassThru -NoNewWindow
          $rc=$proc.ExitCode
          if($rc -ne 3){throw "expected BLOCKED rc=3 without production release context, got $rc"}
          [ordered]@{
            status="BLOCKED"
            reason="signed production release endpoint / real N-to-N+1 lineage unavailable"
            returncode=$rc
          }|ConvertTo-Json|Set-Content -Encoding UTF8 updater_blocked_evidence.json

      - name: Physical GUI click gate on exact EXE
        shell: pwsh
        run: |
          $exe=Resolve-Path ./dist/RealMoneyFinance.exe
          $root=Join-Path $env:RUNNER_TEMP "rmf-gui"
          python -m tests.gui_physical_click_gate --exe $exe --root $root --evidence gui_click_evidence.json

      - name: Freeze candidate manifest
        if: always()
        run: python -m tests.collect_candidate_evidence

      - name: Upload diagnostic candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Real-Money-Finance-reauthored-${{ env.SOURCE_SHA }}
          path: |
            RealMoneyFinance/dist/RealMoneyFinance.exe
            RealMoneyFinance/dist/RealMoneyFinanceUpdater.exe
            RealMoneyFinance/ACCEPTANCE_CONTRACT.json
            RealMoneyFinance/GOVERNANCE_SPEC.json
            RealMoneyFinance/governance_evidence.json
            RealMoneyFinance/contract_evidence.json
            RealMoneyFinance/fault_injection_evidence.json
            RealMoneyFinance/updater_contract_evidence.json
            RealMoneyFinance/real_network_evidence.json
            RealMoneyFinance/real_network_failure_evidence.json
            RealMoneyFinance/business_qualification_evidence.json
            RealMoneyFinance/windows_build_evidence.json
            RealMoneyFinance/exact_exe_evidence.json
            RealMoneyFinance/updater_blocked_evidence.json
            RealMoneyFinance/gui_click_evidence.json
            RealMoneyFinance/gui_click_evidence.png
            RealMoneyFinance/candidate_manifest.json
          if-no-files-found: warn

      - name: Explicit Final boundary
        if: success()
        shell: pwsh
        run: |
          Write-Host "MONOREPO_STAGE=CANDIDATE"
          Write-Host "REPOSITORY_INDEPENDENCE=BLOCKED"
          Write-Host "REAL_RELEASE_N_TO_N_PLUS_1=BLOCKED"
          Write-Host "CAPITAL_DEPLOYMENT_READY=FALSE"
          Write-Host "FINAL_GATE=FAIL"

