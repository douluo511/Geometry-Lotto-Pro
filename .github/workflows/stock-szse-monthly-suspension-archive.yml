name: Stock SZSE monthly suspension archive discovery
on:
  push:
    branches:
      - diagnostic/stock-szse-monthly-suspension-archive-20261006
  workflow_dispatch:
concurrency:
  group: stock-szse-monthly-suspension-archive
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify current Stock product byte identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          authoritative="7f270b9ab58e11fd8129053a65e000c90ff9d8c1"
          test -z "$(git diff --name-only "$authoritative"..HEAD -- StockAIPro)"
          echo "STOCK_PRODUCT_TREE_BYTE_IDENTITY=PASS"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2"
      - name: Discover official monthly suspension archive
        run: python .github/stock_diag/stock_szse_monthly_suspension_archive_discovery.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: STOCK-SZSE-MONTHLY-SUSPENSION-ARCHIVE-${{ github.sha }}
          path: stock_szse_monthly_suspension_archive_discovery.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve strict boundary
        if: always()
        run: |
          echo "SHENZHEN_HISTORICAL_SUSPENSION_STATE=NOT VERIFIED"
          echo "SHENZHEN_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "FULL_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"
