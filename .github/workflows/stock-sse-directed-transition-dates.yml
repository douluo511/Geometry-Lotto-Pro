name: Stock SSE directed transition dates
on:
  push:
    branches:
      - diagnostic/stock-sse-directed-transition-dates-20261006
  workflow_dispatch:
permissions:
  contents: read
jobs:
  directed:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact checkout and unchanged Stock product bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 298131d1aceb2a5e67ac2210bc713a2bb6d09d69 HEAD
          test -z "$(git diff --name-only 298131d1aceb2a5e67ac2210bc713a2bb6d09d69..HEAD -- StockAIPro)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2" "pypdf==5.4.0"
      - name: Extract directed transition dates from all candidates
        run: python .github/stock_diag/stock_sse_directed_transition_dates.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: STOCK-SSE-DIRECTED-TRANSITION-DATES-${{ github.sha }}
          path: stock_sse_directed_transition_dates.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve strict boundary
        if: always()
        run: |
          echo "PRIMARY_DOCUMENT_SEMANTICS_COMPLETE=NOT VERIFIED"
          echo "EFFECTIVE_STATE_RECONSTRUCTION=NOT VERIFIED"
          echo "SHANGHAI_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "FULL_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "ADVANCED_BUSINESS=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"
