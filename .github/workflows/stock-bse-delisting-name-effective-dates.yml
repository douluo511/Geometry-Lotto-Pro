name: Stock BSE delisting-name effective dates
on:
  push:
    branches:
      - diagnostic/stock-bse-delisting-name-effective-dates-20261006
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delisting-dates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact checkout and unchanged Stock product bytes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor d95096206412d89839e08304cf04559d4e05488e HEAD
          test -z "$(git diff --name-only d95096206412d89839e08304cf04559d4e05488e..HEAD -- StockAIPro)"
      - uses: actions/setup-python@a26af69be951213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
      - run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2" "pypdf==5.4.0"
      - name: Resolve two observed BSE delisting-name transition dates
        run: python .github/stock_diag/stock_bse_delisting_name_effective_dates.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: STOCK-BSE-DELISTING-NAME-DATES-${{ github.sha }}
          path: |
            stock_bse_delisting_name_effective_dates.json
            stock_bse_post_implementation_state_sequence.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve strict boundary
        if: always()
        run: |
          echo "REMOVAL_EVENT_HISTORY_COMPLETE=NOT VERIFIED"
          echo "BSE_EFFECTIVE_STATE_RECONSTRUCTION=NOT VERIFIED"
          echo "BSE_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "FULL_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"
