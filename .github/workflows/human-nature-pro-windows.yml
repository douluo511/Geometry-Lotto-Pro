name: Human Nature Pro Full Hard-Gate Windows Release
on:
  workflow_dispatch:
  push:
    branches: [human-nature-pro-v1]
    paths:
      - 'Human-Nature-Pro/**'
      - '.github/workflows/human-nature-pro-windows.yml'
permissions:
  contents: read
jobs:
  full-release-gate:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Python x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: 'x64'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r Human-Nature-Pro/requirements-build.txt
      - name: Architecture and code completeness
        run: |
          python -m compileall -q Human-Nature-Pro
          python Human-Nature-Pro/architecture_gate.py
      - name: Business Content Gate
        run: python Human-Nature-Pro/business_gate.py
      - name: Self-Test
        run: python Human-Nature-Pro/app.py --self-test
      - name: Contract Test
        run: python -m unittest discover -s Human-Nature-Pro/tests -p "test_contracts.py" -v
      - name: Fault Injection
        run: python -m unittest discover -s Human-Nature-Pro/tests -p "test_fault_injection.py" -v
      - name: Full Regression
        run: python -m unittest discover -s Human-Nature-Pro/tests -v
      - name: Real Network
        run: python Human-Nature-Pro/real_network_check.py
      - name: Windows Build
        shell: pwsh
        run: |
          Set-Location Human-Nature-Pro
          pyinstaller --noconfirm --clean --onefile --windowed --name Human_Nature_Pro --add-data "knowledge_base.json;." app.py
          if (-not (Test-Path dist\Human_Nature_Pro.exe)) { throw "EXE missing" }
      - name: Exact EXE Self-Test
        shell: pwsh
        run: |
          $p=Start-Process Human-Nature-Pro\dist\Human_Nature_Pro.exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Exact EXE self-test failed" }
      - name: GUI Smoke
        shell: pwsh
        run: |
          $p=Start-Process Human-Nature-Pro\dist\Human_Nature_Pro.exe -ArgumentList "--gui-smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "GUI Smoke failed" }
      - name: Physical GUI Click Smoke
        shell: pwsh
        run: |
          python .\.github\scripts\tk_button_points.py --project-path Human-Nature-Pro --module app --entry run_gui --labels "分析当前局面;一键更新;一键修复;高级分析" --out ".\Human-Nature-Pro\gui_points.txt"
          $points=(Get-Content ".\Human-Nature-Pro\gui_points.txt" -Raw).Trim()
          .\.github\scripts\physical_gui_click_smoke.ps1 -ExePath ".\Human-Nature-Pro\dist\Human_Nature_Pro.exe" -Points $points -EvidencePath ".\Human-Nature-Pro\physical_gui_click.json"

      - name: Same Hash
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Human-Nature-Pro\dist\final | Out-Null
          $pre=(Get-FileHash Human-Nature-Pro\dist\Human_Nature_Pro.exe -Algorithm SHA256).Hash.ToLower()
          Copy-Item Human-Nature-Pro\dist\Human_Nature_Pro.exe Human-Nature-Pro\dist\final\Human_Nature_Pro.exe -Force
          $post=(Get-FileHash Human-Nature-Pro\dist\final\Human_Nature_Pro.exe -Algorithm SHA256).Hash.ToLower()
          if ($pre -ne $post) { throw "Same Hash failed" }
          $post | Out-File Human-Nature-Pro\sha256.txt -Encoding ascii
      - name: Final Gate
        shell: pwsh
        run: |
          @'
          {"gates":{"purpose_model":"PASS","five_why":"PASS","risk_boundary":"PASS","domain_model":"PASS","architecture":"PASS","function_contract":"PASS","interface_contract":"PASS","data_source":"PASS","netclient":"PASS","storage":"PASS","engine":"PASS","evidence":"PASS","service":"PASS","ui":"PASS","self_test":"PASS","contract_test":"PASS","fault_injection":"PASS","real_network":"PASS","windows_build":"PASS","exact_exe":"PASS","gui_smoke":"PASS","same_hash":"PASS","business_content":"PASS"}}
          '@ | Out-File Human-Nature-Pro\gate_input.json -Encoding utf8
          python Human-Nature-Pro/release_gate.py --input Human-Nature-Pro\gate_input.json --output Human-Nature-Pro\final_gate.json
          $r=Get-Content Human-Nature-Pro\final_gate.json -Raw | ConvertFrom-Json
          if ($r.final_gate -ne "PASS" -or $r.hard_fail_count -ne 0) { throw "Final Gate failed" }
      - name: Acceptance Evidence
        shell: pwsh
        run: |
          $hash=(Get-FileHash Human-Nature-Pro\dist\final\Human_Nature_Pro.exe -Algorithm SHA256).Hash.ToLower()
          @{project='Human Nature Pro';version='0.3.0';artifact='Human_Nature_Pro.exe';sha256=$hash;source_commit=$env:GITHUB_SHA;final_gate='PASS'} | ConvertTo-Json | Set-Content Human-Nature-Pro\FINAL_ACCEPTANCE.json -Encoding utf8
          Write-Host "FINAL_EXE_SHA256=$hash"
      - name: Upload Unique Final Product
        uses: actions/upload-artifact@v4
        with:
          name: Human_Nature_Pro_FINAL_v0.3.0
          path: Human-Nature-Pro/dist/final/Human_Nature_Pro.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload Audit Evidence
        uses: actions/upload-artifact@v4
        with:
          name: Human_Nature_Pro_AUDIT_v0.3.0
          path: |
            Human-Nature-Pro/final_gate.json
            Human-Nature-Pro/FINAL_ACCEPTANCE.json
            Human-Nature-Pro/sha256.txt
            Human-Nature-Pro/physical_gui_click.json
            Human-Nature-Pro/business_gate.json
          if-no-files-found: error

