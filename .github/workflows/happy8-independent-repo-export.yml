name: Happy8 Independent Repository Export Verification

on:
  pull_request:
    paths:
      - "Happy8/**"
      - ".github/workflows/happy8-staging-recovery.yml"
      - ".github/workflows/happy8-independent-repo-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-and-verify:
    runs-on: ubuntu-latest
    env:
      PRODUCT_BASE_SHA: 8de39dcfd4c3c6a0070eb6506e5ad56cb859eaba
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Exact checkout and product-byte identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git merge-base --is-ancestor "$PRODUCT_BASE_SHA" HEAD
          test -z "$(git diff --name-only "$PRODUCT_BASE_SHA"..HEAD -- Happy8 .github/workflows/happy8-staging-recovery.yml | grep -v '^Happy8/staging/scripts/export_independent_repo.py
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Deterministic project-only export
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPORT_DIR: ${{ runner.temp }}/happy8-independent
        run: |
          set -euo pipefail
          python Happy8/staging/scripts/export_independent_repo.py --destination "$EXPORT_DIR" --source-commit "$SOURCE_SHA" | tee "$RUNNER_TEMP/HAPPY8_EXPORT.json"
      - name: Independent second-pass verification
        env:
          EXPORT_DIR: ${{ runner.temp }}/happy8-independent
        run: |
          set -euo pipefail
          python Happy8/staging/scripts/export_independent_repo.py --destination "$EXPORT_DIR" --verify-only | tee "$RUNNER_TEMP/HAPPY8_VERIFY.json"
          grep -q '"status": "PASS"' "$RUNNER_TEMP/HAPPY8_VERIFY.json"
      - name: Mutation must fail closed
        env:
          EXPORT_DIR: ${{ runner.temp }}/happy8-independent
        run: |
          set -euo pipefail
          cp -a "$EXPORT_DIR" "$RUNNER_TEMP/happy8-tampered"
          printf '\n# tampered\n' >> "$RUNNER_TEMP/happy8-tampered/Happy8/ENGINEERING_ACCEPTANCE_BASELINE.json"
          set +e
          python Happy8/staging/scripts/export_independent_repo.py --destination "$RUNNER_TEMP/happy8-tampered" --verify-only > "$RUNNER_TEMP/HAPPY8_TAMPER.json"
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q '"status": "FAIL"' "$RUNNER_TEMP/HAPPY8_TAMPER.json"
      - name: Upload reproducible export candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: HAPPY8-INDEPENDENT-REPO-EXPORT-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/happy8-independent
            ${{ runner.temp }}/HAPPY8_EXPORT.json
            ${{ runner.temp }}/HAPPY8_VERIFY.json
            ${{ runner.temp }}/HAPPY8_TAMPER.json
          if-no-files-found: error
          retention-days: 30
      - name: Explicit boundary
        run: |
          echo "PROJECT_ONLY_EXPORT=PASS"
          echo "REPOSITORY_INDEPENDENCE=NOT VERIFIED"
          echo "REAL_RELEASE_N_TO_N_PLUS_1=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"
 || true)"
          echo "PRODUCT_TREE_BYTE_IDENTITY=PASS"
          echo "PRODUCT_BASE_SHA=$PRODUCT_BASE_SHA"
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Deterministic project-only export
        env:
