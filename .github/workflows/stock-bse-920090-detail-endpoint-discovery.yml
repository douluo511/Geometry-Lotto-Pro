name: Stock BSE 920090 detail endpoint discovery
on:
  push:
    branches:
      - diagnostic/stock-bse-920090-detail-endpoint-20261006
    paths:
      - ".github/stock_diag/bse_920090_detail_endpoint_discovery.py"
      - ".github/workflows/stock-bse-920090-detail-endpoint-discovery.yml"
  pull_request:
    paths:
      - ".github/stock_diag/bse_920090_detail_endpoint_discovery.py"
      - ".github/workflows/stock-bse-920090-detail-endpoint-discovery.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2"
      - name: Trace first-party identifier usage
        run: python .github/stock_diag/bse_920090_detail_endpoint_discovery.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: STOCK-BSE-920090-DETAIL-ENDPOINT-${{ github.event.pull_request.head.sha || github.sha }}
          path: stock_bse_920090_detail_endpoint_discovery.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve strict boundary
        if: always()
        run: |
          echo "DETAIL_ENDPOINT_CONTRACT=NOT VERIFIED"
          echo "EFFECTIVE_RESUME_DATE=NOT VERIFIED"
          echo "BSE_DAILY_SUSPENSION_PIT=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"
