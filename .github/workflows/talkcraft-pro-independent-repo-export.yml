name: TalkCraft Pro Independent Repository Export Verification

on:
  pull_request:
    paths:
      - "talkcraft_pro/**"
      - ".github/workflows/talkcraft-pro-independent-repo-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Exact checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Adversarial exporter regression
        run: python talkcraft_pro/tests/test_independent_repo_export.py
      - name: Export and verify
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OUT: ${{ runner.temp }}/independent-repo
        run: |
          set -euo pipefail
          python talkcraft_pro/tools/export_independent_repo.py --destination "$OUT" --source-commit "$SHA" | tee "$RUNNER_TEMP/export-proof.json"
          python talkcraft_pro/tools/export_independent_repo.py --destination "$OUT" --verify-only | tee "$RUNNER_TEMP/verify-proof.json"
          grep -q '"status": "PASS"' "$RUNNER_TEMP/verify-proof.json"
      - name: Upload verified export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TALKCRAFT-PRO-INDEPENDENT-REPO-EXPORT-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/independent-repo
            ${{ runner.temp }}/export-proof.json
            ${{ runner.temp }}/verify-proof.json
          if-no-files-found: error
          retention-days: 30
