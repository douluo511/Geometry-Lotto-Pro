name: Stock PIT source-native origin required - fail-first forged selfhash
on:
  push:
    branches: [fix/stock-pit-forged-native-universe-hard-gate-20261008]
    paths:
      - "StockAIPro/staging/Stock_AI_Pro/versions/4.3.0/stock_ai/historical_pit.py"
      - "StockAIPro/hardening_tests/historical_st_pit_contract_test.py"
      - "StockAIPro/hardening_tests/historical_native_source_authority_failclosed_test.py"
      - ".github/workflows/stock-pit-native-authority-no-selfhash-falsepass.yml"
  pull_request:
    paths:
      - "StockAIPro/staging/Stock_AI_Pro/versions/4.3.0/stock_ai/historical_pit.py"
      - "StockAIPro/hardening_tests/historical_st_pit_contract_test.py"
      - "StockAIPro/hardening_tests/historical_native_source_authority_failclosed_test.py"
      - ".github/workflows/stock-pit-native-authority-no-selfhash-falsepass.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reject-self-signed-fake-universe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Exact SHA and parent candidate check
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor aed7a628119d846fcc8b8c732c291a8e741e5027 HEAD
      - name: Python pinned
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false
      - name: Compile product and business adversarial gate
        run: python -m py_compile StockAIPro/staging/Stock_AI_Pro/versions/4.3.0/stock_ai/historical_pit.py StockAIPro/hardening_tests/historical_native_source_authority_failclosed_test.py
      - name: Prove forged full three-market source universe cannot earn product PASS
        run: python StockAIPro/hardening_tests/historical_native_source_authority_failclosed_test.py
      - name: Compute exact stage source and projected nested manifest hashes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          base=Path("StockAIPro/staging/Stock_AI_Pro")
          src=base/"versions/4.3.0/stock_ai/historical_pit.py"
          inner=base/"versions/4.3.0/PACKAGE_MANIFEST.json"
          outer=base/"PACKAGE_MANIFEST.json"
          sha=lambda b:hashlib.sha256(b).hexdigest()
          current=sha(src.read_bytes())
          old="d69c08a80bbbb95f9dbacc1d6aeb8e2b74ad86e1dcc8ca95bc066d7a147adb4b"
          before='"stock_ai/historical_pit.py": "'+old+'"'
          after='"stock_ai/historical_pit.py": "'+current+'"'
          content=inner.read_text(encoding="utf-8")
          if before not in content and after not in content:
              raise RuntimeError("unexpected staged source manifest authority")
          projected=content.replace(before,after)
          inner_hash=sha(projected.encode("utf-8"))
          old_inner_hash="a7214b68ad4ddc26efc09ddae590c1f5936585ddd8dc3adf472e999a33e9cca5"
          outer_text=outer.read_text(encoding="utf-8")
          if (old_inner_hash not in outer_text and inner_hash not in outer_text):
              raise RuntimeError("staged root manifest not pinned to old/new inner hash")
          print("STOCK_PIT_NEW_SOURCE_SHA256="+current)
          print("STOCK_PIT_NEW_INNER_MANIFEST_SHA256="+inner_hash)
          print("STOCK_PIT_REPAIRED_CANDIDATE_ONLY_NOT_IMMUTABLE_OR_RELEASE")
          PY
      - name: Record not a qualified historical market archive
        if: always()
        shell: bash
        run: |
          echo "BSE_SSE_SZSE_FIRST_PARTY_HISTORIC_DAILY_NATIVE_MASTERS=NOT VERIFIED"
          echo "ALL_DAILY_SOURCE_ST_AND_HALT=NOT VERIFIED"
          echo "HISTORICAL_ST_PIT_RELEASE=FAIL"
          echo "STOCK_FINAL_GATE=FAIL"
