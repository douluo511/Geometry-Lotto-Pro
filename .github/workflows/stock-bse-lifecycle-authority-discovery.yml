name: Stock BSE current lifecycle authority discovery

on:
  push:
    branches:
      - diagnostic/stock-bse-lifecycle-authority-20261006-v1
  pull_request:
    paths:
      - ".github/stock_diag/bse_lifecycle_authority_discovery.py"
      - ".github/workflows/stock-bse-lifecycle-authority-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout and unchanged Stock product bytes
        shell: bash
        run: |
          set -euo pipefail
          exact="${{ github.event.pull_request.head.sha || github.sha }}"
          authority="e67eaa9cabc34728fee3549262a2f1535d7e8383"
          test "$(git rev-parse HEAD)" = "$exact"
          test -z "$(git diff --name-only "$authority"..HEAD -- StockAIPro)"
          echo "STOCK_PRODUCT_TREE_BYTE_IDENTITY=PASS"

      - name: Setup pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          check-latest: false

      - name: Install pinned dependency
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.32.5"

      - name: Discover first-party BSE machine schema
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stock_bse_raw"
          python .github/stock_diag/bse_lifecycle_authority_discovery.py \
            --output "$RUNNER_TEMP/stock_bse_lifecycle_discovery.json" \
            --raw "$RUNNER_TEMP/stock_bse_raw/bse_current_securities.raw"

      - name: Upload exact raw and discovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-BSE-LIFECYCLE-DISCOVERY-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/stock_bse_lifecycle_discovery.json
            ${{ runner.temp }}/stock_bse_raw/**
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve strict non-promotion boundary
        if: always()
        shell: bash
        run: |
          echo "BSE_CURRENT_LIFECYCLE_AUTHORITY=NOT VERIFIED"
          echo "BSE_HISTORICAL_PIT_AVAILABILITY=NOT VERIFIED"
          echo "FULL_THREE_MARKET_AUTHORITY=NOT VERIFIED"
          echo "FULL_HISTORICAL_ST_PIT=NOT VERIFIED"
          echo "ADVANCED_BUSINESS=NOT VERIFIED"
          echo "FINAL_GATE=FAIL"
