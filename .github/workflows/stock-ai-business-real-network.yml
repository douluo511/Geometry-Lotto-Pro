name: Stock AI full production daily business gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'StockAIPro/**'
      - '.github/workflows/stock-ai-business-real-network.yml'
permissions:
  contents: read
jobs:
  full-daily-business:
    runs-on: windows-2022
    timeout-minutes: 65
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      STOCK_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: StockAIPro
    steps:
      - name: Checkout exact Stock AI head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.STOCK_SOURCE_SHA }}
          fetch-depth: 0
      - name: Exact checkout identity
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim()
          if ($actual -ne $env:STOCK_SOURCE_SHA) { throw "stale checkout: $actual != $env:STOCK_SOURCE_SHA" }
      - name: Setup pinned Windows Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
          architecture: 'x64'
      - name: Install frozen runtime dependencies
        run: python -m pip install --disable-pip-version-check -r staging/Stock_AI_Pro/versions/4.3.0/requirements.txt
      - name: Default production daily source-engine-business chain
        run: python hardening_tests/full_daily_business_gate.py
      - name: Upload full business diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Stock-AI-full-daily-${{ env.STOCK_SOURCE_SHA }}
          path: |
            StockAIPro/business_daily_evidence.json
            StockAIPro/business_daily.log
            StockAIPro/_business_gate_data/state/**
            StockAIPro/_business_gate_data/reports/**
            StockAIPro/_business_gate_data/predictions/latest/**
            StockAIPro/_business_gate_data/cache/last_update_status.json
            StockAIPro/_business_gate_data/evidence/netclient_raw.jsonl
          if-no-files-found: warn
      - name: Explicit desktop/final boundary
        if: success()
        run: |
          Write-Host 'FULL_DAILY_BUSINESS=PASS'
          Write-Host 'WINDOWS_DESKTOP_EXE=NOT VERIFIED'
          Write-Host 'PHYSICAL_GUI=NOT VERIFIED'
          Write-Host 'SAME_HASH=NOT VERIFIED'
          Write-Host 'FINAL_GATE=FAIL'
