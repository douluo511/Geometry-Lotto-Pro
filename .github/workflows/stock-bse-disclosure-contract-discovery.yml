name: Stock BSE disclosure contract discovery

on:
  pull_request:
    paths:
      - ".github/stock_diag/stock_bse_disclosure_contract_discovery.py"
      - ".github/workflows/stock-bse-disclosure-contract-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout and unchanged Stock product bytes
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          authoritative="7f270b9ab58e11fd8129053a65e000c90ff9d8c1"
          git merge-base --is-ancestor "$authoritative" HEAD
          test -z "$(git diff --name-only "$authoritative"..HEAD -- StockAIPro)"
          echo "STOCK_PRODUCT_BYTES_CHANGED=FALSE"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"

      - name: Install pinned dependency
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2"

      - name: Discover official BSE disclosure query contract
        run: python .github/stock_diag/stock_bse_disclosure_contract_discovery.py

      - name: Upload discovery evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-BSE-DISCLOSURE-CONTRACT-${{ github.event.pull_request.head.sha || github.sha }}
          path: stock_bse_disclosure_contract_discovery.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve strict boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          x=json.load(open("stock_bse_disclosure_contract_discovery.json",encoding="utf-8"))
          a=x["adjudication"]
          assert a["bse_historical_st_pit"] == "NOT VERIFIED"
          assert a["bse_historical_suspension_pit"] == "NOT VERIFIED"
          assert a["full_historical_st_pit"] == "NOT VERIFIED"
          assert a["final_gate"] == "FAIL"
          print("BSE_MACHINE_QUERY_CONTRACT="+a["machine_query_contract"])
          print("FULL_HISTORICAL_ST_PIT=NOT VERIFIED")
          print("FINAL_GATE=FAIL")
          PY
