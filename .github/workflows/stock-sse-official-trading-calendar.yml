name: Stock SSE official trading calendar

on:
  push:
    branches:
      - "diagnostic/stock-sse-calendar-semantic-probe-20261005"
    paths:
      - "StockAIPro/hardening_tests/stock_sse_official_trading_calendar.py"
      - ".github/workflows/stock-sse-official-trading-calendar.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact diagnostic checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${{ github.sha }}"
          echo "EXACT_DIAGNOSTIC_HEAD=$actual"
      - name: Verify authoritative Stock product bytes unchanged
        shell: bash
        run: |
          set -euo pipefail
          base="43168d9e75c70ab55be808d8a51f0c0eb14d83d5"
          git merge-base --is-ancestor "$base" HEAD
          changed="$(git diff --name-only "$base..HEAD" -- StockAIPro             | grep -v '^StockAIPro/hardening_tests/stock_sse_suspension_endpoint_discovery.py$'             | grep -v '^StockAIPro/hardening_tests/stock_sse_historical_suspension_query.py$'             | grep -v '^StockAIPro/hardening_tests/stock_sse_calendar_semantic_probe.py$'             | grep -v '^StockAIPro/hardening_tests/stock_sse_end_semantics_from_artifact.py$'             | grep -v '^StockAIPro/hardening_tests/stock_sse_official_trading_calendar.py$' || true)"
          test -z "$changed" || { echo "$changed"; exit 1; }
          echo "STOCK_PRODUCT_BYTES_CHANGED=FALSE"
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
      - name: Install pinned dependency
        run: python -m pip install --disable-pip-version-check --no-input "requests==2.34.2"
      - name: Verify six first-party SSE annual closure notices and build calendar
        working-directory: StockAIPro
        run: python hardening_tests/stock_sse_official_trading_calendar.py
      - name: Enforce strict non-promotion boundary
        working-directory: StockAIPro
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("stock_sse_official_trading_calendar.json").read_text(encoding="utf-8"))
          a=x["adjudication"]
          assert a["exchange_trading_calendar_frozen_window"] == "PASS"
          assert a["historical_daily_suspension_state"] == "NOT VERIFIED"
          assert a["shanghai_historical_st_pit"] == "NOT VERIFIED"
          assert a["full_historical_st_pit"] == "NOT VERIFIED"
          assert a["advanced_business"] == "NOT VERIFIED"
          assert a["product_bytes_changed"] is False
          assert a["final_gate"] == "FAIL"
          print("EXCHANGE_TRADING_CALENDAR_FROZEN_WINDOW=PASS")
          print("HISTORICAL_DAILY_SUSPENSION_STATE=NOT VERIFIED")
          print("ADVANCED_BUSINESS=NOT VERIFIED")
          print("FINAL_GATE=FAIL")
          PY
      - name: Upload calendar evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: STOCK-SSE-OFFICIAL-TRADING-CALENDAR-${{ github.sha }}
          path: StockAIPro/stock_sse_official_trading_calendar.json
          if-no-files-found: error
          retention-days: 30
