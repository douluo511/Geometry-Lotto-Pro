name: Stock AI immutable recovery and Windows offline regressions
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'StockAIPro/recovered_exact/**'
      - 'StockAIPro/staging/**'
      - 'StockAIPro/desktop_native/**'
      - 'StockAIPro/hardening_tests/desktop_native_contract_test.py'
      - 'StockAIPro/verify_recovery.py'
      - 'StockAIPro/requirements-offline-ci.txt'
      - 'StockAIPro/hardening_tests/netclient_contract_test.py'
      - 'StockAIPro/hardening_tests/universe_fallback_test.py'
      - 'StockAIPro/hardening_tests/history_execution_contract_test.py'
      - 'StockAIPro/hardening_tests/pipeline_overlap_contract_test.py'
      - 'StockAIPro/hardening_tests/valuation_qualification_contract_test.py'
      - 'StockAIPro/hardening_tests/historical_st_pit_contract_test.py'
      - 'StockAIPro/hardening_tests/historical_pit_consumption_contract_test.py'
      - 'StockAIPro/hardening_tests/full_daily_business_gate.py'
      - 'StockAIPro/hardening_tests/restore_immutable_git_bytes.py'
      - 'StockAIPro/hardening_tests/real_network_gate.py'
      - '.github/workflows/stock-ai-source-recovery.yml'
concurrency:
  group: stock-ai-source-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  source-recovery:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      STOCK_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: StockAIPro
    steps:
      - name: Checkout exact recovery head without line-ending conversion
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.STOCK_SOURCE_SHA }}
          fetch-depth: 0
      - name: Restore exact immutable archive bytes from Git blobs
        shell: pwsh
        run: |
          git config core.autocrlf false
          python hardening_tests/restore_immutable_git_bytes.py
          if ($LASTEXITCODE -ne 0) { throw 'immutable raw-byte restore failed' }
      - name: Setup pinned Windows Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
          architecture: 'x64'
      - name: Install offline validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-offline-ci.txt
      - name: Strict NetClient contract and fault gate
        run: python hardening_tests/netclient_contract_test.py
      - name: Full-universe failover contract gate
        run: python hardening_tests/universe_fallback_test.py
      - name: Bounded concurrent history and timeout fault regressions
        run: python hardening_tests/history_execution_contract_test.py
      - name: Bounded concurrent industry enrichment regression
        run: python hardening_tests/industry_enrichment_contract_test.py
      - name: Critical-path independent-operation overlap contract
        run: python hardening_tests/pipeline_overlap_contract_test.py
      - name: Historical PIT valuation qualification contract
        run: python hardening_tests/valuation_qualification_contract_test.py
      - name: Historical ST and suspension PIT fail-closed contract
        run: python hardening_tests/historical_st_pit_contract_test.py
      - name: Historical PIT backtest consumption and no-future-leakage contract
        run: python hardening_tests/historical_pit_consumption_contract_test.py
      - name: Immutable 187 file import and full 32 gate Windows offline regression
        run: python verify_recovery.py --repo-root .. --output source_recovery_evidence.json
      - name: Install pinned AkShare for production source integration
        run: python -m pip install --disable-pip-version-check "akshare==1.18.94"
      - name: Real AkShare source network -> canonical -> feature gate
        run: python hardening_tests/real_network_gate.py
      - name: Upload recovery diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Stock-AI-source-recovery-${{ env.STOCK_SOURCE_SHA }}
          path: |
            StockAIPro/source_recovery_evidence.json
            StockAIPro/source_recovery_evidence.log
            StockAIPro/netclient_contract_evidence.json
            StockAIPro/history_execution_contract_evidence.json
            StockAIPro/industry_enrichment_contract_evidence.json
            StockAIPro/valuation_qualification_contract_evidence.json
            StockAIPro/real_network_evidence.json
            StockAIPro/_real_network_gate_data/evidence/netclient_raw.jsonl
            StockAIPro/_real_network_gate_data/cache/real_network_snapshot.csv
            StockAIPro/_real_network_gate_data/cache/real_network_features.csv
          if-no-files-found: warn
      - name: Explicit non-final boundary
        run: |
          Write-Host 'SOURCE_RECOVERY_ONLY; REAL_NETWORK=NOT VERIFIED; DESKTOP_EXE=NOT VERIFIED; FINAL_GATE=FAIL'
