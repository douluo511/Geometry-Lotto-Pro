# Legacy filename retained; this workflow validates the V4.7 SHADOW contract.
name: V4.7 research harness synthetic tests
on:
  push:
    branches:
      - "research/ssq-dlt-v46-harness-bootstrap-20261022"
      - "research/ssq-dlt-v46-test10-convergence-20261022"
      - "research/ssq-dlt-v47-p0a-r5-20261022"
    paths:
      - "research/harness_v46/**"
      - "SSQ/**"
      - "DLT/**"
      - ".github/workflows/v46-harness-fixtures.yml"
  pull_request:
    paths:
      - "research/harness_v46/**"
      - "SSQ/**"
      - "DLT/**"
      - ".github/workflows/v46-harness-fixtures.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    name: Synthetic gate tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependency for offline source-parser replay
        run: python -m pip install --disable-pip-version-check requests==2.34.2
      - name: Verify exact candidate commit before testing
        shell: bash
        env:
          EXPECTED_TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          expected = os.environ["EXPECTED_TEST_SHA"]
          print(f"expected_test_sha={expected}")
          print(f"actual_checkout_sha={actual}")
          if actual != expected:
              raise SystemExit("EXACT_CANDIDATE_SHA_MISMATCH")
          PY
      - name: Test deterministic contracts and record each case without unaccounted skips
        run: python -m research.harness_v46.ci_coverage run --output out/ci-coverage/${{ matrix.os }}.json
      - name: Execute unified synthetic research stack (M1/M2/M3 + both geometries + mechanical toy)
        run: python -m research.harness_v46.research_stack --synthetic --seed 20261114 --trials 3000 --steps 12
      - name: Test offline SSQ source-app contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/SSQ/SSQ
          GLP_DISABLE_BACKGROUND: "1"
          GLP_DATA_DIR: ${{ runner.temp }}/v47-ssq-offline-tests
        run: python -B -m unittest discover -s SSQ/tests -p "test*.py" -v
      - name: Test offline DLT source-app contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/DLT/src
          GLP_DISABLE_BACKGROUND: "1"
          GLP_DATA_DIR: ${{ runner.temp }}/v47-dlt-offline-tests
        run: python -B -m unittest discover -s DLT/tests -p "test*.py" -v
      - name: Upload exact-HEAD per-test coverage receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v47-coverage-${{ matrix.os }}
          path: out/ci-coverage/${{ matrix.os }}.json
          if-no-files-found: error
          retention-days: 30

  coverage-gate:
    name: Enforce zero unexecuted tests across Ubuntu and Windows
    needs: fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: v47-coverage-*
          path: out/ci-coverage
          merge-multiple: true
      - name: Verify all 19 Linux-skipped native cases passed on exact-HEAD Windows
        run: python -m research.harness_v46.ci_coverage matrix --linux out/ci-coverage/ubuntu-latest.json --windows out/ci-coverage/windows-2022.json
