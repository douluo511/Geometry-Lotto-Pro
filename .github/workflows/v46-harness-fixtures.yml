# Legacy filename retained; this workflow validates the V4.7 SHADOW contract.
name: V4.7 research harness synthetic tests
on:
  push:
    branches:
      - "research/ssq-dlt-v46-harness-bootstrap-20261022"
      - "research/ssq-dlt-v46-test10-convergence-20261022"
    paths:
      - "research/harness_v46/**"
      - ".github/workflows/v46-harness-fixtures.yml"
  pull_request:
    paths:
      - "research/harness_v46/**"
      - ".github/workflows/v46-harness-fixtures.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    name: Synthetic gate tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source parser dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Test deterministic contracts with invented fixtures only
        run: python -m unittest discover -s research/harness_v46/tests -v
