# Legacy filename retained; this workflow validates the V4.7 SHADOW contract.
name: V4.7 research harness synthetic tests
on:
  push:
    branches:
      - "research/ssq-dlt-v46-harness-bootstrap-20261022"
      - "research/ssq-dlt-v46-test10-convergence-20261022"
      - "research/ssq-dlt-v47-p0a-r5-20261022"
    paths:
      - "research/harness_v46/**"
      - "SSQ/**"
      - "DLT/**"
      - ".github/workflows/v46-harness-fixtures.yml"
  pull_request:
    paths:
      - "research/harness_v46/**"
      - "SSQ/**"
      - "DLT/**"
      - ".github/workflows/v46-harness-fixtures.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    name: Synthetic gate tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependency for offline source-parser replay
        run: python -m pip install --disable-pip-version-check requests==2.34.2
      - name: Verify exact candidate commit before testing
        shell: bash
        env:
          EXPECTED_TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          expected = os.environ["EXPECTED_TEST_SHA"]
          print(f"expected_test_sha={expected}")
          print(f"actual_checkout_sha={actual}")
          if actual != expected:
              raise SystemExit("EXACT_CANDIDATE_SHA_MISMATCH")
          PY
      - name: Test deterministic contracts with invented fixtures only
        run: python -m unittest discover -s research/harness_v46/tests -v
      - name: Test offline SSQ source-app contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/SSQ/SSQ
          GLP_DISABLE_BACKGROUND: "1"
          GLP_DATA_DIR: ${{ runner.temp }}/v47-ssq-offline-tests
        run: python -B -m unittest discover -s SSQ/tests -p "test*.py" -v
      - name: Test offline DLT source-app contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/DLT/src
          GLP_DISABLE_BACKGROUND: "1"
          GLP_DATA_DIR: ${{ runner.temp }}/v47-dlt-offline-tests
        run: python -B -m unittest discover -s DLT/tests -p "test*.py" -v
