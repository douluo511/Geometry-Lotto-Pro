services:
  ssq-dlt-v45:
    profiles: ["local-runtime"]
    build:
      context: ../..
      dockerfile: research/ssq_dlt_v45/Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      TZ: Asia/Tokyo
    volumes:
      - type: bind
        source: ${V45_CONFIG_DIRECTORY:?Set V45_CONFIG_DIRECTORY to the directory containing runtime.json}
        target: /config
        read_only: true
      - type: bind
        source: ${V45_DATA_DIRECTORY:?Set V45_DATA_DIRECTORY to the prepared writable data directory}
        target: /data
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
